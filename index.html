  const fmtDate = (value, includeTime=false) => { if(!value) return '-'; const d = new Date(value.length===10 ? value+'T00:00:00' : value); if(Number.isNaN(d.getTime())) return esc(value); return new Intl.DateTimeFormat('ko-KR', includeTime?{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}:{year:'numeric',month:'2-digit',day:'2-digit'}).format(d); };

  const eventOperator = e => e?.operatorName || (['AS접수','AS회수','폐기'].includes(e?.stage) ? (e?.data?.operatorName||'') : '');
  function getMovementCounts(barcode){
    const code=cleanBarcodeValue(barcode);
    const events=state.events
      .filter(e=>cleanBarcodeValue(e.barcode)===code)
      .sort((a,b)=>new Date(a.timestamp||0)-new Date(b.timestamp||0));
    let outbound=0,returned=0,asDispatch=0,directOutbound=0,asReturn=0,reIntake=0,seenInitialIntake=false;
    for(const event of events){
      const action=String(event.action||'');
      // A metadata-only edit is not a physical movement. A saved stage change is counted.
      if(action==='품목 정보 수정'||(action.startsWith('품목 정보 수정')&&!action.includes('단계 변경')))continue;

        else{seenInitialIntake=true;returned++;reIntake++;}

  function loadStore(){ try { const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); return {inventory:Array.isArray(s.inventory)?s.inventory:[],events:Array.isArray(s.events)?s.events:[]}; } catch { return {inventory:[],events:[]}; } }
  function normalizeCatalogName(value){return String(value??'').trim().replace(/\s+/g,' ');}

      }
    }catch(e){console.warn('제품 목록을 읽지 못했습니다.',e);}

    (state.inventory||[]).forEach(add);
    (state.events||[]).forEach(ev=>add(ev?.data||ev));

  // 제품 수정·삭제 이벤트가 이 공통 전송 함수를 거쳐 Google Sheets로 전달됩니다.
  function sendNewEventToGoogleSheet(event){
    const url=googleSheetConfig?.url;
    if(!url||!event)return;
    if(!event.id||!event.stage){
      const st=$('#googleSheetStatus');
      if(st)st.textContent='Google Sheets 전송을 건너뛰었습니다. 업무 구분 또는 이력 ID가 없습니다.';
      console.warn('Google Sheets: event.id 또는 event.stage 누락',event);
      return;
    }
    try{
      let frame=$('#asflowGoogleSheetFrame');
      if(!frame){
        frame=document.createElement('iframe');
        frame.name='asflowGoogleSheetFrame';
        frame.id='asflowGoogleSheetFrame';
        frame.style.display='none';
        document.body.appendChild(frame);
      }
      const form=document.createElement('form');
      form.method='POST';
      form.action=url;
      form.target=frame.name;
      form.acceptCharset='UTF-8';
      form.style.display='none';
      const input=document.createElement('input');
      input.type='hidden';
      input.name='payload';
      input.value=JSON.stringify({source:'AS FLOW v1.0.16',token:googleSheetConfig.token||'',event});

      document.body.appendChild(form);
      form.submit();
      // 일부 브라우저에서 submit 직후 폼 제거로 전송이 취소되지 않도록 잠시 유지합니다.
      setTimeout(()=>form.remove(),1200);
      const st=$('#googleSheetStatus');
      if(st)st.textContent=`${event.stage} 기록 전송 요청을 보냈습니다. Google Sheets의 전체기록 및 ${event.stage} 탭을 확인해 주세요.`;
    }catch(err){
      const st=$('#googleSheetStatus');
      if(st)st.textContent='Google Sheets 전송 요청 실패: '+err.message;
      toast('Google Sheets 전송 요청에 실패했습니다.','error');
    }
  }
  function loadSession(){ try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null} }
  function saveConfig(){ cloudConfig={url:($('#cloudUrl')?.value||'').trim().replace(/\/$/,''),key:($('#cloudKey')?.value||'').trim()}; localStorage.setItem(CONFIG_KEY,JSON.stringify(cloudConfig)); toast('클라우드 연결 설정을 저장했습니다.','success'); }
  function updateSyncLabels(){ const connected=!!(cloudConfig.url&&cloudConfig.key&&cloudSession?.access_token); const txt=connected?'클라우드 연결됨':'로컬 저장 사용 중'; const a=$('#sideSyncStatus'),b=$('#topSyncStatus'); if(a)a.textContent=txt;if(b)b.textContent=connected?'클라우드 동기화 준비됨':'자동 저장 활성화'; }

  function statCount(stage){return state.inventory.filter(item=>item.stage===stage).length}
  function totalEventsSince(start,end){return state.events.filter(e=>{const t=new Date(e.timestamp||e.date||0);return t>=start&&t<end}).length}
  function setView(view){currentView=view;$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const names={dashboard:'대시보드',workflow:'업무 등록',outbound:'출고등록',history:'재고·이력 조회',reports:'월간·연간 보고서',settings:'설정·데이터 관리'};$('#pageTitle').textContent=names[view]||'AS FLOW';renderMain();window.scrollTo({top:0,behavior:'smooth'});}
  function renderMain(){const root=$('#appContent'); if(currentView==='dashboard')root.innerHTML=renderDashboard();else if(currentView==='workflow')root.innerHTML=renderWorkflow();else if(currentView==='outbound')root.innerHTML=renderOutbound();else if(currentView==='history')root.innerHTML=renderHistory();else if(currentView==='reports')root.innerHTML=renderReports();else root.innerHTML=renderSettings();attachViewEvents();updateSyncLabels();}
  function renderDashboard(){
    const counts=[...STAGES,OUTBOUND_STAGE].map(s=>({stage:s.id,count:statCount(s.id)}));
    const last6=[]; const now=new Date(); for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;last6.push({key,label:`${d.getMonth()+1}월`,count:state.events.filter(e=>(e.timestamp||'').slice(0,7)===key).length});}
    const maxBar=Math.max(1,...last6.map(x=>x.count));
    const gradeCounts=GRADES.map(g=>({grade:g,count:state.inventory.filter(i=>i.grade===g&&!['폐기','출고등록'].includes(i.stage)).length}));const maxGrade=Math.max(1,...gradeCounts.map(x=>x.count));
    const recent=[...state.events].sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||'')).slice(0,6);
    return `<div class="section-head"><div><div class="eyebrow">OVERVIEW / TODAY</div><h2 class="section-title" style="margin-top:7px">전체 업무 현황</h2><div class="section-sub">AS 접수부터 상품화·폐기까지, 재고 흐름을 한눈에 확인합니다.</div></div><div class="btn-row no-print"><button class="btn" data-action="quick-report">보고서 보기 ↗</button><button class="btn primary" data-action="new-work">＋ 업무 등록</button></div></div>
    <div class="cards">${[
      ['전체 관리 품목',state.inventory.length,'▦','등록된 바코드 기준'],['AS 접수',statCount('AS접수'),'↙','접수 단계'],['AS 발송',statCount('AS발송'),'↗','센터 발송 단계'],['AS 회수',statCount('AS회수'),'↩','회수 및 수리 판정'],['CS용 재고',statCount('CS용'),'＋','CS 대응용'],['상품화 가능',statCount('상품화'),'✓','폐기 제외 등급 재고']
    ].map((c,i)=>`<div class="metric"><div class="metric-top"><div class="metric-label">${c[0]}</div><div class="metric-icon">${c[2]}</div></div><div class="metric-value">${c[1].toLocaleString('ko-KR')}</div><div class="metric-bottom">${c[3]}</div></div>`).join('')}</div>
    <div class="panel-grid"><section class="panel panel-pad"><div class="panel-head"><div><h3 class="panel-title">월별 업무 처리량</h3><div class="panel-desc">최근 6개월 · 등록된 업무 이력 기준</div></div><span class="pill green">${new Date().getFullYear()}년</span></div><div class="chart"><div class="bar-chart">${last6.map(m=>`<div class="bar-group"><div class="bar-value">${m.count}</div><div class="bar-stack"><div class="bar-fill" style="height:${Math.max(m.count?4:0,m.count/maxBar*100)}%"></div></div><div class="bar-month">${m.label}</div></div>`).join('')}</div></div><div class="legend"><span><i></i>월별 등록 이력 건수</span><span style="margin-left:auto">총 ${last6.reduce((a,b)=>a+b.count,0)}건</span></div></section>
    <section class="panel panel-pad"><div class="panel-head"><div><h3 class="panel-title">현재 업무 단계</h3><div class="panel-desc">단계별 현재 품목 수</div></div><button class="btn small" data-action="show-inventory">재고 확인 ↗</button></div><div class="stage-list">${counts.map(s=>`<div class="stage-line"><div class="stage-name">${esc(s.stage)}</div><div class="stage-track"><div class="stage-progress" style="width:${Math.min(100,s.count/Math.max(1,state.inventory.length)*100)}%"></div></div><div class="stage-count">${s.count}</div></div>`).join('')}</div><div class="divider"></div><div class="panel-desc">전체 품목 ${state.inventory.length}개 중 폐기 ${statCount('폐기')}개</div></section></div>
    <div class="panel-grid"><section class="panel"><div class="panel-head" style="padding:19px 20px 0;margin-bottom:8px"><div><h3 class="panel-title">최근 업무 이력</h3><div class="panel-desc">가장 최근에 등록·변경된 기록</div></div><button class="btn small" data-action="show-history">전체 이력 ↗</button></div><div class="table-wrap"><table><thead><tr><th>업무 단계</th><th>제품 / 모델</th><th>바코드</th><th>등급</th><th>입력자</th><th>처리 일시</th></tr></thead><tbody>${recent.length?recent.map(e=>`<tr><td>${stagePill(e.stage)}</td><td><div class="table-primary">${esc(e.data?.productName||e.productName||'-')}</div><div class="table-secondary">${esc(e.data?.modelName||e.modelName||'-')}</div></td><td>${esc(e.barcode||'-')}</td><td>${gradeHtml(e.data?.grade||e.grade)}</td><td>${esc(eventOperator(e)||'-')}</td><td>${fmtDate(e.timestamp,true)}</td></tr>`).join(''):`<tr><td colspan="6"><div class="empty"><div class="empty-icon">▤</div>아직 등록된 업무 이력이 없습니다.<br>업무 등록에서 첫 품목을 추가해 보세요.</div></td></tr>`}</tbody></table></div></section>
    <section class="panel panel-pad"><div class="panel-head"><div><h3 class="panel-title">등급별 재고</h3><div class="panel-desc">폐기·출고 단계를 제외한 현재 재고</div></div></div><div class="stage-list">${gradeCounts.map(g=>`<div class="stage-line"><div style="display:flex;align-items:center;gap:7px">${gradeHtml(g.grade)}<span class="stage-name">등급</span></div><div class="stage-track"><div class="stage-progress" style="width:${g.count/maxGrade*100}%;background:${g.grade==='D'?'#cf7272':g.grade==='C'?'#d4a342':g.grade==='A'||g.grade==='B'?'#4d8dbb':'var(--green)'}"></div></div><div class="stage-count">${g.count}</div></div>`).join('')}</div><div class="divider"></div><div class="small-note">등급은 S(최상)부터 D(폐급/불량)까지 관리합니다. 실제 등급 의미는 사내 기준에 맞춰 적용해 주세요.</div></section></div>`;
  }
  function renderWorkflow(){return `<div class="section-head"><div><div class="eyebrow">WORKFLOW / REGISTER</div><h2 class="section-title" style="margin-top:7px">업무 등록</h2><div class="section-sub">업무 단계를 선택하고 상품 정보와 바코드를 입력하세요. 같은 바코드는 기존 품목을 찾아 단계가 갱신됩니다.</div></div></div><div class="workflow-grid">${STAGES.map(s=>`<button class="workflow-card" data-stage="${esc(s.id)}"><div class="workflow-head"><div class="workflow-ico">${s.icon}</div><span class="workflow-count">현재 ${statCount(s.id)}개</span></div><h3>${s.label}</h3><p>${s.hint}</p><span class="arrow">↗</span></button>`).join('')}</div><div class="panel panel-pad" style="margin-top:17px"><div class="panel-head"><div><h3 class="panel-title">등록 순서</h3><div class="panel-desc">현장 담당자가 빠르게 기록할 수 있도록 단계를 단순화했습니다.</div></div></div><div class="workflow-steps">${STAGES.map((s,i)=>`<div style="text-align:center"><div style="height:32px;width:32px;border-radius:10px;background:#edf6e8;color:#4b8d38;font-weight:850;font-size:11px;display:grid;place-items:center;margin:0 auto 7px">${String(i+1).padStart(2,'0')}</div><div style="font-size:10px;font-weight:750">${s.label}</div></div>`).join('')}</div><div class="small-note" style="margin-top:18px">※ 단계 변경 때마다 이력이 누적됩니다. 폐기 처리된 품목도 기록에서 사라지지 않고 폐기 사유와 함께 보관됩니다.</div></div>`;}
  function renderOutbound(){
    const outboundItems=state.inventory.filter(i=>i.stage==='출고등록').sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
    const outboundEvents=[...state.events].filter(e=>e.stage==='출고등록').sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||'')).slice(0,30);

      <div class="outbound-summary"><div class="metric"><div class="metric-label">현재 출고 처리 품목</div><div class="metric-value">${outboundItems.length.toLocaleString('ko-KR')}</div><div class="metric-bottom">현재 단계가 출고등록인 품목</div></div><div class="metric"><div class="metric-label">이번 달 출고 이력</div><div class="metric-value">${monthCount.toLocaleString('ko-KR')}</div><div class="metric-bottom">${today().slice(0,7).replace('-', '년 ')}월</div></div><div class="metric"><div class="metric-label">누적 출고 이력</div><div class="metric-value">${state.events.filter(e=>e.stage==='출고등록').length.toLocaleString('ko-KR')}</div><div class="metric-bottom">출고 등록 이벤트 기준</div></div></div>
      <section class="panel panel-pad" style="margin-bottom:16px"><div class="panel-head"><div><h3 class="panel-title">출고 등록 순서</h3><div class="panel-desc">출고 처리된 상품도 이력에 남아 월간·연간 보고서에 반영됩니다.</div></div></div><div class="stage-list"><div class="stage-line" style="grid-template-columns:25px 1fr"><span class="grade S">1</span><div><div style="font-size:12px;font-weight:750">기존 바코드 스캔</div><div class="small-note">카메라 촬영 버튼으로 바코드를 읽습니다. 등록된 재고 바코드만 출고 처리할 수 있습니다.</div></div></div><div class="stage-line" style="grid-template-columns:25px 1fr"><span class="grade A">2</span><div><div style="font-size:12px;font-weight:750">출고처·출고 구분 입력</div><div class="small-note">바코드가 등록되어 있으면 제품명과 모델명이 자동으로 채워집니다.</div></div></div><div class="stage-line" style="grid-template-columns:25px 1fr"><span class="grade B">3</span><div><div style="font-size:12px;font-weight:750">저장 및 이력 반영</div><div class="small-note">저장 즉시 현재 재고 단계가 출고등록으로 변경되고, 기존의 모든 업무 이력은 유지됩니다.</div></div></div></div><div class="btn-row" style="margin-top:17px"><button class="btn primary" data-action="new-outbound">＋ 출고 등록 시작</button></div></section>

  function renderHistory(){return `<div class="section-head"><div><div class="eyebrow">INVENTORY / HISTORY</div><h2 class="section-title" style="margin-top:7px">재고·이력 조회</h2><div class="section-sub">바코드, 제품명, 모델명으로 검색하고 현재 상태 또는 업무 변경 내역을 확인합니다.</div></div><div class="btn-row no-print"><button class="btn" data-action="export-csv">CSV 내보내기</button><button class="btn primary" data-action="new-work">＋ 업무 등록</button></div></div><div class="panel"><div class="panel-pad" style="padding-bottom:14px"><div class="toolbar"><div class="segmented"><button class="${historyMode==='inventory'?'active':''}" data-history-mode="inventory">현재 재고 (${state.inventory.length})</button><button class="${historyMode==='events'?'active':''}" data-history-mode="events">업무 이력 (${state.events.length})</button></div><div class="searchbox"><span class="search-icon">⌕</span><input id="historySearch" placeholder="바코드·제품명·모델명 검색"></div><select class="filter-select" id="historyFilter"><option value="">전체 단계</option>${[...STAGES,OUTBOUND_STAGE].map(s=>`<option value="${s.id}">${s.label}</option>`).join('')}</select></div></div><div class="table-wrap" id="historyTableWrap">${renderHistoryTable()}</div><div class="small-note" style="padding:0 18px 15px">총 ${historyMode==='inventory'?state.inventory.length:state.events.length}건 · 기록은 바코드 기준으로 연결됩니다. 이동 횟수는 AS발송·출고등록을 나감, AS회수·최초 AS접수 이후 재접수를 들어옴으로 계산합니다.</div></div>`;}
  function renderHistoryTable(){if(historyMode==='inventory'){const list=[...state.inventory].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));return `<table><thead><tr><th>단계</th><th>제품 / 모델 · 이동 횟수</th><th>바코드</th><th>가맹점 / 출고처</th><th>등급</th><th>최종 변경</th><th class="no-print">관리</th></tr></thead><tbody>${list.length?list.map(item=>{const move=getMovementCounts(item.barcode);return `<tr data-search="${esc([item.stage,item.productName,item.modelName,item.barcode,item.branch,item.returnedBranch,item.outboundTo,item.outboundReason,item.grade,item.reason,item.operatorName].join(' ').toLowerCase())}" data-stage="${esc(item.stage)}"><td>${stagePill(item.stage)}</td><td><div class="table-primary">${esc(item.productName||'-')}</div><div class="table-secondary">${esc(item.modelName||'-')}</div><div class="movement-line" title="나감: AS발송+출고등록 / 들어옴: AS회수+최초 AS접수 이후 재접수"><span class="movement-tag out">↗ 나감 ${move.outbound}회</span><span class="movement-tag in">↩ 들어옴 ${move.returned}회</span></div><div class="table-secondary">최근 입력자: ${esc(item.operatorName||'-')}</div></td><td><span class="table-primary">${esc(item.barcode||'-')}</span></td><td>${esc(item.outboundTo||item.returnedBranch||item.branch||'-')}</td><td>${gradeHtml(item.grade)}</td><td>${fmtDate(item.updatedAt,true)}</td><td class="no-print"><div class="btn-row" style="flex-wrap:nowrap"><button class="btn small" data-detail-barcode="${esc(item.barcode)}">상세</button><button class="btn small primary" data-edit-barcode="${esc(item.barcode)}">수정</button><button class="btn small danger" data-delete-barcode="${esc(item.barcode)}">삭제</button></div></td></tr>`}).join(''):`<tr><td colspan="7"><div class="empty"><div class="empty-icon">▦</div>등록된 품목이 없습니다.</div></td></tr>`}</tbody></table>`;}
    const events=[...state.events].sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||''));return `<table><thead><tr><th>업무 단계</th><th>제품 / 모델 · 누적 이동</th><th>바코드</th><th>등급</th><th>입력자</th><th>변경 날짜</th><th>메모</th></tr></thead><tbody>${events.length?events.map(e=>{const move=getMovementCounts(e.barcode);return `<tr data-search="${esc([e.stage,e.data?.productName,e.data?.modelName,e.barcode,e.data?.branch,e.data?.returnedBranch,e.data?.grade,e.data?.reason,e.data?.outboundTo,e.data?.outboundReason,e.operatorName,e.data?.operatorName].join(' ').toLowerCase())}" data-stage="${esc(e.stage)}"><td>${stagePill(e.stage)}</td><td><div class="table-primary">${esc(e.data?.productName||'-')}</div><div class="table-secondary">${esc(e.data?.modelName||'-')}</div><div class="movement-line"><span class="movement-tag out">↗ 나감 ${move.outbound}회</span><span class="movement-tag in">↩ 들어옴 ${move.returned}회</span></div></td><td>${esc(e.barcode||'-')}</td><td>${gradeHtml(e.data?.grade)}</td><td>${esc(eventOperator(e)||'-')}</td><td>${fmtDate(e.timestamp,true)}</td><td>${esc(eventMemo(e))}</td></tr>`}).join(''):`<tr><td colspan="7"><div class="empty"><div class="empty-icon">◷</div>아직 업무 이력이 없습니다.</div></td></tr>`}</tbody></table>`;}
  function renderReports(){const y=Number($('#reportYear')?.value||new Date().getFullYear());const m=Number($('#reportMonth')?.value||new Date().getMonth()+1);return reportBody(y,m);}
  function reportBody(year,month){let start,end,label;if(reportMode==='monthly'){start=new Date(year,month-1,1);end=new Date(year,month,1);label=`${year}년 ${month}월 월간 보고서`;}else{start=new Date(year,0,1);end=new Date(year+1,0,1);label=`${year}년 연간 보고서`;}
    const periodEvents=state.events.filter(e=>{const d=new Date(e.timestamp||0);return d>=start&&d<end;});const closed=periodEvents.filter(e=>e.stage==='폐기').length;const newProducts=periodEvents.filter(e=>e.stage==='AS접수').length;const goods=periodEvents.filter(e=>e.stage==='상품화').length;const rows=[...STAGES,OUTBOUND_STAGE].map(s=>({stage:s.id,count:periodEvents.filter(e=>e.stage===s.id).length}));const max=Math.max(1,...rows.map(r=>r.count));const periodItems=state.inventory.filter(item=>{const d=new Date(item.updatedAt||0);return d>=start&&d<end;}).length;
    const currentStageCounts=[...STAGES,OUTBOUND_STAGE].map(s=>({stage:s.id,count:statCount(s.id)}));
    // 선택 기간의 업무 이력을 바코드/제품별로 묶어 제품 단위 실적을 계산합니다.
    const productMap=new Map();
    periodEvents.forEach(e=>{
      const d=e.data||{};
      const key=String(e.barcode||d.barcode||`${d.productName||'미등록'}|${d.modelName||''}`);
      if(!productMap.has(key)) productMap.set(key,{key,barcode:e.barcode||d.barcode||'',productName:d.productName||e.productName||'제품명 없음',modelName:d.modelName||e.modelName||'',total:0,stages:{},lastAt:e.timestamp||''});
      const row=productMap.get(key); row.total++; row.stages[e.stage]=(row.stages[e.stage]||0)+1;
      if((e.timestamp||'')>row.lastAt) row.lastAt=e.timestamp||'';
      if(!row.productName||row.productName==='제품명 없음') row.productName=d.productName||e.productName||row.productName;
      if(!row.modelName) row.modelName=d.modelName||e.modelName||'';
    });
    const productRows=[...productMap.values()].sort((a,b)=>b.total-a.total||String(a.productName).localeCompare(String(b.productName),'ko'));
    const productStageCols=['AS접수','AS발송','AS회수','출고등록','CS용','상품화','폐기'];
    return `<div class="section-head"><div><div class="eyebrow">REPORTS / ANALYTICS</div><h2 class="section-title" style="margin-top:7px">월간·연간 보고서</h2><div class="section-sub">선택한 기간의 업무 처리량과 현재 재고 현황을 확인하고 PDF로 저장합니다.</div></div><div class="btn-row no-print"><button class="btn" data-action="export-csv">데이터 CSV</button><button class="btn primary" data-action="print-report">PDF 보고서 저장 ↗</button></div></div>
    <div class="panel panel-pad report-controls no-print"><div class="toolbar"><div class="segmented"><button data-report-mode="monthly" class="${reportMode==='monthly'?'active':''}">월간 보고서</button><button data-report-mode="annual" class="${reportMode==='annual'?'active':''}">연간 보고서</button></div><select class="filter-select" id="reportYear">${Array.from({length:8},(_,i)=>new Date().getFullYear()-5+i).map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}년</option>`).join('')}</select>${reportMode==='monthly'?`<select class="filter-select" id="reportMonth">${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===month?'selected':''}>${m}월</option>`).join('')}</select>`:''}<span class="small-note">PDF 저장: 버튼을 누른 뒤 프린터에서 ‘PDF로 저장’을 선택하세요.</span></div></div>
    <div class="report-sheet"><div class="print-only" style="font-size:10px;color:#62737d;margin-bottom:14px">AS FLOW · 재고 및 A/S 업무 보고서</div><div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start"><div><div class="eyebrow">AS FLOW · PERIOD REPORT</div><h1 class="report-title" style="margin-top:8px">${label}</h1><div class="report-subtitle">보고서 생성일 ${fmtDate(today())} · 저장된 업무 이력 기준</div></div><div class="pill green">${reportMode==='monthly'?'MONTHLY':'ANNUAL'} REPORT</div></div>
      <div class="report-summary"><div class="report-stat"><div class="label">기간 내 업무 이력</div><div class="value">${periodEvents.length}</div><div class="note">모든 단계의 등록·변경 수</div></div><div class="report-stat"><div class="label">AS 접수</div><div class="value">${newProducts}</div><div class="note">기간 내 접수 기록</div></div><div class="report-stat"><div class="label">상품화 등록</div><div class="value">${goods}</div><div class="note">기간 내 상품화 기록</div></div><div class="report-stat"><div class="label">폐기 처리</div><div class="value">${closed}</div><div class="note">기간 내 폐기 기록</div></div></div>
      <div class="report-body-grid"><section class="panel panel-pad"><div class="panel-head"><div><h3 class="panel-title">기간 내 업무 처리 현황</h3><div class="panel-desc">단계별 업무 등록·변경 횟수</div></div></div><div class="report-breakdown">${rows.map(r=>`<div class="report-barrow"><div class="name">${r.stage}</div><div class="track"><div class="fill" style="width:${r.count/max*100}%"></div></div><div class="num">${r.count}</div></div>`).join('')}</div></section><section class="panel panel-pad"><div class="panel-head"><div><h3 class="panel-title">현재 재고 단계 현황</h3><div class="panel-desc">보고서 작성 시점 기준</div></div></div><div class="report-breakdown">${currentStageCounts.map(r=>`<div class="report-barrow"><div class="name">${r.stage}</div><div class="track"><div class="fill" style="width:${r.count/Math.max(1,state.inventory.length)*100}%"></div></div><div class="num">${r.count}</div></div>`).join('')}</div></section></div>
      <section class="panel" style="margin-top:16px"><div class="panel-head" style="padding:18px 20px 0"><div><h3 class="panel-title">제품별 처리 실적</h3><div class="panel-desc">선택한 기간의 업무 이력을 제품·바코드별로 집계합니다. 같은 제품의 반복 접수·발송·회수도 횟수에 포함됩니다.</div></div><span class="pill green">${productRows.length}개 제품</span></div><div class="table-wrap"><table><thead><tr><th>제품 / 모델</th><th>바코드</th><th>총 업무</th>${productStageCols.map(stage=>`<th>${stage}</th>`).join('')}<th>최근 처리일</th></tr></thead><tbody>${productRows.length?productRows.map(r=>`<tr><td><div class="table-primary">${esc(r.productName)}</div><div class="table-secondary">${esc(r.modelName||'-')}</div></td><td>${esc(r.barcode||'-')}</td><td><strong>${r.total}</strong></td>${productStageCols.map(stage=>`<td>${r.stages[stage]||0}</td>`).join('')}<td>${fmtDate(r.lastAt,true)}</td></tr>`).join(''):`<tr><td colspan="${productStageCols.length+4}"><div class="empty">선택한 기간에 제품별 업무 이력이 없습니다.</div></td></tr>`}</tbody></table></div></section>
      <section class="panel" style="margin-top:16px"><div class="panel-head" style="padding:18px 20px 0"><div><h3 class="panel-title">기간 내 상세 이력</h3><div class="panel-desc">총 ${periodEvents.length}건 · 제품별 업무 변경 내용</div></div></div><div class="table-wrap"><table><thead><tr><th>처리 일시</th><th>업무 단계</th><th>제품 / 모델</th><th>바코드</th><th>등급</th><th>입력자</th><th>메모</th></tr></thead><tbody>${periodEvents.length?[...periodEvents].sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||'')).slice(0,200).map(e=>`<tr><td>${fmtDate(e.timestamp,true)}</td><td>${stagePill(e.stage)}</td><td><div class="table-primary">${esc(e.data?.productName||'-')}</div><div class="table-secondary">${esc(e.data?.modelName||'-')}</div></td><td>${esc(e.barcode||'-')}</td><td>${gradeHtml(e.data?.grade)}</td><td>${esc(eventOperator(e)||'-')}</td><td>${esc(eventMemo(e))}</td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">선택한 기간에 등록된 이력이 없습니다.</div></td></tr>`}</tbody></table></div></section><div class="small-note" style="margin-top:13px">※ 보고서는 이 브라우저에 저장된 데이터 기준입니다. 다른 기기의 데이터까지 보고서에 포함하려면 설정에서 동일한 클라우드 계정으로 동기화하세요.</div></div>`;
  }
  const SQL_SETUP = `create table if not exists public.inventory (\n  user_id uuid not null references auth.users(id) on delete cascade,\n  barcode text not null,\n  data jsonb not null,\n  updated_at timestamptz not null default now(),\n  primary key (user_id, barcode)\n);\ncreate table if not exists public.events (\n  user_id uuid not null references auth.users(id) on delete cascade,\n  id text not null,\n  data jsonb not null,\n  created_at timestamptz not null default now(),\n  primary key (user_id, id)\n);\nalter table public.inventory enable row level security;\nalter table public.events enable row level security;\ndrop policy if exists "Users manage own inventory" on public.inventory;\ncreate policy "Users manage own inventory" on public.inventory for all to authenticated using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndrop policy if exists "Users manage own events" on public.events;\ncreate policy "Users manage own events" on public.events for all to authenticated using (auth.uid() = user_id) with check (auth.uid() = user_id);`;
  function renderProductCatalogSettings(){
    return `<section class="panel panel-pad" style="grid-column:1/-1">
      <div class="panel-head"><div><h3 class="panel-title">제품명 · 모델명 목록 관리</h3><div class="panel-desc">AS접수 화면의 제품명과 모델명 선택 목록을 관리합니다. POS를 선택하면 POS에 등록한 모델명만 표시됩니다.</div></div><span class="pill green">${productCatalog.length}개 제품</span></div>
      <form id="catalogProductForm" class="btn-row" style="align-items:center;margin-bottom:15px"><input id="catalogNewProductName" class="control" style="max-width:320px" name="productName" placeholder="새 제품명 입력 (예: POS)" required><button class="btn primary" type="submit">＋ 제품 추가</button></form>
      <div class="small-note" style="margin:-4px 0 12px">위·아래 버튼으로 순서를 바꾸면 AS접수의 제품명·모델명 선택 목록에도 같은 순서로 반영됩니다.</div>
      <div style="display:grid;gap:12px">${productCatalog.map((p,pi)=>`<div style="border:1px solid var(--line);border-radius:11px;padding:14px;background:#fbfcfd">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div style="display:flex;align-items:center;gap:9px"><span class="pill">${pi+1}</span><div><div style="font-weight:800;font-size:13px">${esc(p.name)}</div><div class="small-note">등록 모델 ${p.models.length}개</div></div></div><div class="btn-row"><button type="button" class="btn small" data-catalog-action="move-product-up" data-product-index="${pi}" title="제품을 위로 이동" aria-label="제품 ${esc(p.name)} 위로 이동" ${pi===0?'disabled':''}>↑ 위로</button><button type="button" class="btn small" data-catalog-action="move-product-down" data-product-index="${pi}" title="제품을 아래로 이동" aria-label="제품 ${esc(p.name)} 아래로 이동" ${pi===productCatalog.length-1?'disabled':''}>↓ 아래로</button><button type="button" class="btn small" data-catalog-action="rename-product" data-product-index="${pi}">제품명 수정</button><button type="button" class="btn small danger" data-catalog-action="delete-product" data-product-index="${pi}">제품 삭제</button></div></div>
        <div style="margin-top:12px;display:grid;gap:7px">${p.models.length?p.models.map((m,mi)=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #e9eef0;padding-top:8px"><div style="display:flex;align-items:center;gap:8px"><span class="small-note" style="min-width:20px">${mi+1}.</span><span style="font-size:12px">${esc(m)}</span></div><div class="btn-row"><button type="button" class="btn small" data-catalog-action="move-model-up" data-product-index="${pi}" data-model-index="${mi}" title="모델을 위로 이동" aria-label="모델 ${esc(m)} 위로 이동" ${mi===0?'disabled':''}>↑</button><button type="button" class="btn small" data-catalog-action="move-model-down" data-product-index="${pi}" data-model-index="${mi}" title="모델을 아래로 이동" aria-label="모델 ${esc(m)} 아래로 이동" ${mi===p.models.length-1?'disabled':''}>↓</button><button type="button" class="btn small" data-catalog-action="edit-model" data-product-index="${pi}" data-model-index="${mi}">수정</button><button type="button" class="btn small danger" data-catalog-action="delete-model" data-product-index="${pi}" data-model-index="${mi}">삭제</button></div></div>`).join(''):'<div class="small-note">등록된 모델명이 없습니다. 아래에서 모델명을 추가하세요.</div>'}</div>
        <form class="catalogModelForm btn-row" data-product-index="${pi}" style="align-items:center;margin-top:11px"><input class="control" style="max-width:320px" name="modelName" placeholder="${esc(p.name)} 모델명 추가" required><button class="btn" type="submit">＋ 모델 추가</button></form>
      </div>`).join('')}</div>
      <div class="note-box" style="margin-top:13px">제품명과 모델명 옆의 ↑ 위로 / ↓ 아래로 버튼을 눌러 순서를 변경하세요. 변경한 순서는 자동 저장되며 AS접수 선택 목록에도 즉시 반영됩니다. 기존 재고와 업무 이력의 내용은 변경되지 않습니다. 목록은 JSON 백업 파일에도 함께 포함됩니다.</div>
    </section>`;

  function addCatalogProduct(name){
    const clean=normalizeCatalogName(name);if(!clean){toast('제품명을 입력해 주세요.','error');return false;}
    if(productCatalog.some(p=>p.name.toLocaleLowerCase()===clean.toLocaleLowerCase())){toast('이미 등록된 제품명입니다.','error');return false;}
    productCatalog.push({name:clean,models:[]});saveProductCatalog();toast(`제품명 '${clean}'을(를) 추가했습니다.`,'success');return true;
  }
  function attachProductCatalogSettingsEvents(){
    const productForm=$('#catalogProductForm');
    productForm?.addEventListener('submit',e=>{e.preventDefault();const input=$('#catalogNewProductName');if(addCatalogProduct(input.value))renderMain();});
    $$('.catalogModelForm').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const pi=Number(form.dataset.productIndex),input=form.elements.modelName,p=productCatalog[pi],name=normalizeCatalogName(input.value);if(!p||!name)return;if(p.models.some(m=>m.toLocaleLowerCase()===name.toLocaleLowerCase())){toast('이미 등록된 모델명입니다.','error');return;}p.models.push(name);saveProductCatalog();toast(`${p.name} 모델명을 추가했습니다.`,'success');renderMain();}));
    $$('[data-catalog-action]').forEach(button=>button.addEventListener('click',()=>{
      const action=button.dataset.catalogAction,pi=Number(button.dataset.productIndex),mi=Number(button.dataset.modelIndex),p=productCatalog[pi];if(!p)return;
      if(action==='move-product-up'||action==='move-product-down'){
        const nextIndex=pi+(action==='move-product-up'?-1:1);if(nextIndex<0||nextIndex>=productCatalog.length)return;
        [productCatalog[pi],productCatalog[nextIndex]]=[productCatalog[nextIndex],productCatalog[pi]];
        saveProductCatalog();renderMain();toast('제품명 표시 순서를 변경했습니다.','success');
      }else if(action==='move-model-up'||action==='move-model-down'){
        if(!Number.isInteger(mi)||mi<0||mi>=p.models.length)return;
        const nextIndex=mi+(action==='move-model-up'?-1:1);if(nextIndex<0||nextIndex>=p.models.length)return;
        [p.models[mi],p.models[nextIndex]]=[p.models[nextIndex],p.models[mi]];
        saveProductCatalog();renderMain();toast(`${p.name} 모델명 표시 순서를 변경했습니다.`,'success');
      }else if(action==='rename-product'){
        const next=normalizeCatalogName(prompt('변경할 제품명을 입력하세요.',p.name)||'');if(!next||next===p.name)return;
        if(productCatalog.some((x,i)=>i!==pi&&x.name.toLocaleLowerCase()===next.toLocaleLowerCase())){toast('이미 등록된 제품명입니다.','error');return;}
        p.name=next;saveProductCatalog();renderMain();toast('제품명을 수정했습니다.','success');
      }else if(action==='delete-product'){
        if(!confirm(`제품명 '${p.name}' 목록을 삭제할까요?\n기존 재고와 업무 이력은 삭제되지 않습니다.`))return;
        productCatalog.splice(pi,1);saveProductCatalog();renderMain();toast('제품 목록에서 삭제했습니다.','success');
      }else if(action==='edit-model'){
        const old=p.models[mi];if(old===undefined)return;const next=normalizeCatalogName(prompt('변경할 모델명을 입력하세요.',old)||'');if(!next||next===old)return;
        if(p.models.some((m,i)=>i!==mi&&m.toLocaleLowerCase()===next.toLocaleLowerCase())){toast('이미 등록된 모델명입니다.','error');return;}
        p.models[mi]=next;saveProductCatalog();renderMain();toast('모델명을 수정했습니다.','success');
      }else if(action==='delete-model'){
        const old=p.models[mi];if(old===undefined)return;if(!confirm(`모델명 '${old}'을(를) 목록에서 삭제할까요?\n기존 업무 기록은 변경되지 않습니다.`))return;
        p.models.splice(mi,1);saveProductCatalog();renderMain();toast('모델명을 삭제했습니다.','success');
      }
    }));
  }

    <section class="panel panel-pad"><div class="panel-head"><div><h3 class="panel-title">Google Sheets 자동 기록</h3><div class="panel-desc">설정 완료 후 새로 등록하는 업무 이력부터 Google 스프레드시트에 자동으로 추가합니다.</div></div><span class="pill green">신규 기록 자동 저장</span></div><div class="field"><label>Google Apps Script 웹 앱 URL</label><input id="googleSheetUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(googleSheetConfig.url||'')}"><div class="helper">Google Apps Script를 웹 앱으로 배포한 뒤 표시되는 /exec 주소를 입력하세요.</div></div><div class="field"><label>연결 비밀문구</label><input id="googleSheetToken" type="password" placeholder="Apps Script 코드의 SECRET_TOKEN과 동일하게 입력" value="${esc(googleSheetConfig.token||'')}"><div class="helper">임의의 긴 문구를 정해 Apps Script 코드와 동일하게 입력하세요.</div></div><div class="btn-row" style="margin-top:12px"><button class="btn primary" data-action="save-google-sheet">Google Sheets 연결 저장</button><button class="btn" data-action="open-google-script">Apps Script 열기 ↗</button></div><div class="small-note" id="googleSheetStatus" style="margin-top:10px">${googleSheetConfig.url?'연결 주소가 저장되어 있습니다. 신규 기록부터 자동 전송합니다.':'아직 연결되지 않았습니다. 설정 전의 기존 제품·이력은 자동으로 전송하지 않습니다.'}</div><div class="note-box" style="margin-top:12px">저장 대상: AS접수, AS발송, AS회수, 출고등록, CS용, 상품화, 폐기, 제품 정보 수정, 품목 삭제. 모든 업무 단계는 전체기록과 해당 업무별 탭에 함께 저장됩니다. 기존 데이터는 전송하지 않으며, 연결 저장 이후 새로 발생한 기록만 전송합니다.</div></section>
    <section class="panel panel-pad"><div class="panel-head"><div><h3 class="panel-title">공용 클라우드 연결</h3><div class="panel-desc">PC와 스마트폰에서 같은 계정으로 로그인하면 데이터를 동기화할 수 있습니다.</div></div><span class="pill ${cloudSession?.access_token?'green':'gray'}">${cloudSession?.access_token?'로그인됨':'연결 전'}</span></div><div class="field-grid"><div class="field full"><label>Supabase Project URL</label><input id="cloudUrl" placeholder="https://프로젝트ID.supabase.co" value="${esc(cloudConfig.url||'')}"><div class="helper">Supabase 프로젝트의 Project URL을 입력합니다.</div></div><div class="field full"><label>Supabase anon / publishable key</label><input id="cloudKey" placeholder="공개용 anon 또는 publishable key" value="${esc(cloudConfig.key||'')}"><div class="helper">service_role 키는 절대 입력하지 마세요.</div></div><div class="field"><label>계정 이메일</label><input id="cloudEmail" type="email" placeholder="이메일 주소"></div><div class="field"><label>계정 비밀번호</label><input id="cloudPassword" type="password" placeholder="Supabase 로그인 비밀번호"></div></div><div class="btn-row" style="margin-top:14px"><button class="btn" data-action="save-cloud">연결 설정 저장</button><button class="btn primary" data-action="cloud-login">로그인 및 동기화</button>${cloudSession?.access_token?'<button class="btn" data-action="cloud-logout">로그아웃</button>':''}</div><div class="small-note" id="cloudStatusText" style="margin-top:11px">${cloudSession?.access_token?'클라우드 계정이 연결되어 있습니다.':'클라우드 연결은 선택 기능입니다. 연결하지 않아도 로컬 기능은 사용할 수 있습니다.'}</div><div class="divider"></div><details><summary style="font-size:12px;font-weight:800;cursor:pointer">처음 연결하는 방법 보기</summary><div class="small-note" style="margin:12px 0">1. Supabase에서 프로젝트를 만듭니다.<br>2. Authentication에서 이메일/비밀번호 로그인을 활성화하고 계정을 생성합니다.<br>3. SQL Editor에서 아래 SQL을 실행합니다.<br>4. Project URL과 공개용 anon/publishable key를 입력하고 로그인합니다.<br>5. PC와 스마트폰에서 동일한 계정으로 로그인하면 데이터가 동기화됩니다.</div><div class="code-box">${esc(SQL_SETUP)}</div><div class="btn-row" style="margin-top:10px"><button class="btn small" data-action="copy-sql">SQL 복사</button><button class="btn small" data-action="open-supabase">Supabase 열기 ↗</button></div></details></section></div><div class="panel panel-pad" style="margin-top:16px"><div class="panel-head"><div><h3 class="panel-title">사용 안내 및 개인정보</h3><div class="panel-desc">현장 사용 전에 확인하세요.</div></div></div><div class="stage-list"><div class="stage-line" style="grid-template-columns:24px 1fr"><span class="grade S">1</span><div><div style="font-size:12px;font-weight:750">카메라 바코드 촬영</div><div class="small-note">카메라는 HTTPS 주소에서 열어야 합니다. 카메라 권한을 허용하고, 지원하지 않는 브라우저에서는 바코드 번호를 직접 입력할 수 있습니다.</div></div></div><div class="stage-line" style="grid-template-columns:24px 1fr"><span class="grade A">2</span><div><div style="font-size:12px;font-weight:750">자동 저장 및 백업</div><div class="small-note">브라우저 데이터 삭제 또는 기기 변경 전에 JSON 백업을 내려받으세요. 로컬 모드의 데이터는 브라우저별로 따로 저장됩니다.</div></div></div><div class="stage-line" style="grid-template-columns:24px 1fr"><span class="grade B">3</span><div><div style="font-size:12px;font-weight:750">공용 데이터 보안</div><div class="small-note">클라우드 연결은 Supabase 계정 인증과 사용자별 RLS 정책을 사용합니다. 공유 기기에서는 로그아웃하고, 계정 비밀번호를 안전하게 관리하세요.</div></div></div></div></div>`;}
  function attachViewEvents(){
    if(currentView==='settings')attachProductCatalogSettingsEvents();
    // 업무 단계 카드는 업무등록 화면만 열도록 제한합니다. 재고 목록의 tr[data-stage] 행을 클릭 대상으로 포함하면 수정 버튼 클릭 시 등록 모달이 겹쳐 열립니다.
    $$('.workflow-card[data-stage]').forEach(b=>b.addEventListener('click',()=>openWorkModal(b.dataset.stage)));
    $$('[data-action]').forEach(b=>b.addEventListener('click',()=>handleAction(b.dataset.action,b)));
    $$('[data-history-mode]').forEach(b=>b.addEventListener('click',()=>{historyMode=b.dataset.historyMode;renderMain();}));
    $$('[data-report-mode]').forEach(b=>b.addEventListener('click',()=>{reportMode=b.dataset.reportMode;renderMain();}));
    $$('#appContent [data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
    const search=$('#historySearch'),filter=$('#historyFilter');if(search)search.addEventListener('input',filterHistoryRows);if(filter)filter.addEventListener('change',filterHistoryRows);
    const year=$('#reportYear'),month=$('#reportMonth');if(year)year.addEventListener('change',()=>renderMain());if(month)month.addEventListener('change',()=>renderMain());
    $$('[data-detail-barcode]').forEach(b=>b.addEventListener('click',()=>showItemDetail(b.dataset.detailBarcode)));
    $$('[data-edit-barcode]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openItemEdit(b.dataset.editBarcode);}));
    $$('[data-delete-barcode]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();deleteInventoryItem(b.dataset.deleteBarcode);}));
  }
  function filterHistoryRows(){const q=($('#historySearch')?.value||'').toLowerCase().trim(),stage=$('#historyFilter')?.value||'';$$('#historyTableWrap tbody tr[data-search]').forEach(tr=>{tr.classList.toggle('hide',!tr.dataset.search.includes(q)||(stage&&tr.dataset.stage!==stage));});}
  function handleAction(action){
    if(action==='new-work')setView('workflow');
    else if(action==='new-outbound')openWorkModal('출고등록');
    else if(action==='quick-report')setView('reports');
    else if(action==='show-inventory'){historyMode='inventory';setView('history');}
    else if(action==='show-history'){historyMode='events';setView('history');}
    else if(action==='export-csv')exportCSV();
    else if(action==='backup-json')backupJSON();
    else if(action==='import-json')$('#importFile')?.click();
    else if(action==='print-report')window.print();
    else if(action==='reset-data')resetData();
    else if(action==='save-cloud'){saveConfig();}
    else if(action==='save-google-sheet'){saveGoogleSheetConfig();}
    else if(action==='open-google-script')window.open('https://script.google.com/home','_blank','noopener');
    else if(action==='cloud-login')cloudLogin();
    else if(action==='cloud-logout')cloudLogout();
    else if(action==='copy-sql')navigator.clipboard?.writeText(SQL_SETUP).then(()=>toast('SQL을 복사했습니다.','success')).catch(()=>toast('복사할 수 없습니다. SQL을 직접 선택해 복사해 주세요.','error'));
    else if(action==='open-supabase')window.open('https://supabase.com/dashboard','_blank','noopener');
  }
  function openWorkModal(stage){const fields=FIELD_MAP[stage];if(!fields)return;const fieldHtml=fields.map(f=>{
    const required=f.required?'<span class="required">*</span>':'';let control='';const currentDate=today();const defaultValue=stage==='AS접수'?(AS_RECEIPT_DEFAULTS[f.key]??''):'';
    if(f.type==='productCatalog')control=`<select id="field-${f.key}" name="${f.key}" required><option value="">제품명을 선택하세요</option>${productCatalog.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('')}</select><div class="helper">제품 목록은 설정·데이터 관리에서 추가·수정·삭제할 수 있습니다.</div>`;
    else if(f.type==='modelCatalog')control=`<select id="field-${f.key}" name="${f.key}" required disabled><option value="">먼저 제품명을 선택하세요</option></select><div class="helper" id="modelCatalogHelp">제품명을 선택하면 해당 제품의 모델명 목록이 표시됩니다.</div>`;
    else if(f.type==='barcode')control=`<div class="input-action"><input id="field-${f.key}"  name="${f.key}" ${f.required?'required':''} placeholder="${esc(f.placeholder)}" autocomplete="off"><button type="button" class="btn" data-scan-for="field-${f.key}">▣ 촬영</button></div><div class="helper">바코드가 잘 보이도록 맞춰 주세요. 카메라가 안 열리면 번호를 직접 입력할 수 있습니다.</div>`;
    else if(f.type==='textarea')control=`<textarea id="field-${f.key}" name="${f.key}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'내용 입력')}">${esc(defaultValue)}</textarea>`;
    else if(f.type==='select')control=`<select id="field-${f.key}" name="${f.key}" ${f.required?'required':''}><option value="">선택하세요</option>${f.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
    else if(f.type==='grade')control=`<select id="field-${f.key}" name="${f.key}" ${f.required?'required':''}><option value="">등급 선택</option>${GRADES.map(g=>`<option value="${g}">${g} 등급</option>`).join('')}</select><div class="helper">S(최상) · A · B · C · D(최하)</div>`;
    else control=`<input id="field-${f.key}" name="${f.key}" type="${f.type==='date'?'date':f.type==='tel'?'tel':'text'}" ${f.required?'required':''} ${f.type==='date'?`value="${currentDate}"`:`value="${esc(defaultValue)}" placeholder="${esc(f.placeholder||'입력하세요')}"`} ${f.type==='tel'?'inputmode="tel" autocomplete="tel"':''}>`;
    return `<div class="field ${f.type==='textarea'?'full':''}"><label for="field-${f.key}">${f.label}${required}</label>${control}</div>`;
  }).join('');
    const outboundHelp=stage==='출고등록'?'<div class="small-note" id="outboundLookupStatus" style="margin-top:10px">바코드를 입력하거나 촬영하면 기존 재고를 조회합니다. 등록된 재고만 출고할 수 있습니다.</div>':'';
    $('#modalRoot').innerHTML=`<div class="modal-backdrop" id="workBackdrop"><div class="modal"><div class="modal-head"><div><div class="eyebrow">WORKFLOW REGISTER</div><h2 style="margin-top:7px">${stage} 등록</h2><p>${stageObj(stage).hint}</p></div><button class="icon-btn" type="button" data-close-modal aria-label="닫기">×</button></div><form id="workForm"><div class="modal-body"><div class="field-grid">${fieldHtml}</div>${outboundHelp}<div class="small-note" style="margin-top:15px">${stage==='출고등록'?'* 기존 재고에 등록된 바코드만 출고할 수 있습니다. 스캔 후 제품명·모델명이 자동 조회되었는지 확인해 주세요.':'* 필수 항목입니다. 바코드가 이미 등록되어 있으면 해당 품목의 현재 단계가 변경되고 기존 이력은 보존됩니다.'}</div></div><div class="modal-foot"><button type="button" class="btn" data-close-modal>취소</button><button class="btn primary" type="submit">등록 및 저장</button></div></form></div></div>`;
    $$('[data-close-modal]').forEach(b=>b.addEventListener('click',closeModal));$('#workBackdrop').addEventListener('click',e=>{if(e.target.id==='workBackdrop')closeModal();});
    $$('[data-scan-for]').forEach(b=>b.addEventListener('click',()=>startScanner(b.dataset.scanFor)));
    if(stage==='AS접수'){
      const productSelect=$('#field-productName'),modelSelect=$('#field-modelName'),modelHelp=$('#modelCatalogHelp');
      const updateModels=()=>{
        const product=productCatalog.find(p=>p.name===productSelect?.value);
        const models=product?.models||[];
        modelSelect.innerHTML=`<option value="">${product?(models.length?'모델명을 선택하세요':'설정에서 모델명을 먼저 등록하세요'):'먼저 제품명을 선택하세요'}</option>${models.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}`;
        modelSelect.disabled=false;
        if(modelHelp)modelHelp.textContent=product?(models.length?`${product.name}에 등록된 모델 ${models.length}개 중 선택하세요.`:`${product.name}에 등록된 모델명이 없습니다. 설정·데이터 관리에서 모델명을 추가해 주세요.`):'제품명을 선택하면 해당 제품의 모델명 목록이 표시됩니다.';
      };
      productSelect?.addEventListener('change',updateModels);updateModels();
    }
    if(stage==='출고등록'){
      const barcodeInput=$('#field-barcode'),productInput=$('#field-productName'),modelInput=$('#field-modelName'),status=$('#outboundLookupStatus');
      const lookupOutbound=()=>{const code=cleanBarcodeValue(barcodeInput?.value||'');const match=code?state.inventory.find(i=>cleanBarcodeValue(i.barcode)===code):null;if(match){if(productInput)productInput.value=match.productName||'';if(modelInput)modelInput.value=match.modelName||'';if(status)status.textContent=`기존 재고 확인 완료 · ${match.productName||'제품명 없음'} / ${match.modelName||'모델명 없음'} · 현재 단계: ${match.stage||'-'}`;}else if(status){status.textContent=code?'등록된 재고가 없습니다. 출고하려면 먼저 업무 등록에서 이 바코드를 등록해 주세요.':'바코드를 입력하거나 촬영하면 기존 재고를 조회합니다.';}};
      barcodeInput?.addEventListener('input',lookupOutbound);barcodeInput?.addEventListener('change',lookupOutbound);lookupOutbound();
    }
    $('#workForm').addEventListener('submit',saveWorkForm);

  function latestItemActionByBarcode(events=state.events){
    const latest=new Map();
    for(const event of events||[]){
      const code=cleanBarcodeValue(event?.barcode);
      if(!code)continue;
      const stamp=Date.parse(event.timestamp||0)||0;
      const previous=latest.get(code);
      if(!previous||stamp>=previous.timestamp){
        latest.set(code,{timestamp:stamp,deleted:event.action==='품목 삭제'});
      }
    }
    return latest;
  }
  function pruneDeletedInventoryByEvents(){
    const latest=latestItemActionByBarcode();
    const removed=[];
    state.inventory=state.inventory.filter(item=>{
      const code=cleanBarcodeValue(item?.barcode);
      if(latest.get(code)?.deleted){removed.push(String(item.barcode));return false;}
      return true;
    });
    return [...new Set(removed)];
  }

  function cleanBarcodeValue(value){
    // A barcode is an identifier, not a number. Never convert it to Number or remove leading zeroes.
    return String(value??'').replace(/^\s+|\s+$/g,'');

  function uniqueBarcodeValues(values){return [...new Set((values||[]).map(cleanBarcodeValue).filter(v=>v.length>0))];}
  async function detectWithNativeBarcodeDetector(canvas){
    if(!('BarcodeDetector' in window))return [];
    try{
      let detector;
      try{
        const formats=await window.BarcodeDetector.getSupportedFormats();
        detector=formats?.length?new window.BarcodeDetector({formats}):new window.BarcodeDetector();
      }catch{detector=new window.BarcodeDetector();}
      const hits=await detector.detect(canvas);
      return uniqueBarcodeValues((hits||[]).map(hit=>hit?.rawValue));
    }catch{return [];}
  }
  function upscaleFocusRegion(source){
    // Second-pass fallback: enlarge the green guide area from the still image for small barcodes.
    const sx=Math.round(source.width*.16),sy=Math.round(source.height*.30);
    const sw=Math.max(1,Math.round(source.width*.68)),sh=Math.max(1,Math.round(source.height*.40));
    const canvas=document.createElement('canvas');
    canvas.width=Math.min(sw*2,4096);canvas.height=Math.min(sh*2,2048);
    const ctx=canvas.getContext('2d');
    if(ctx){ctx.imageSmoothingEnabled=false;ctx.drawImage(source,sx,sy,sw,sh,0,0,canvas.width,canvas.height);}
    return canvas;
  }
  async function scanImageWithHtml5Qrcode(canvas){
    if(!window.Html5Qrcode)await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
    if(!window.Html5Qrcode)throw new Error('바코드 이미지 판독 기능을 사용할 수 없습니다.');
    const host=$('#scanner-fallback-reader');
    if(!host)throw new Error('바코드 판독용 화면을 찾을 수 없습니다.');
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('촬영 이미지 변환에 실패했습니다.')),'image/png'));
    const file=new File([blob],'barcode-capture.png',{type:'image/png'});
    const reader=new window.Html5Qrcode('scanner-fallback-reader',{verbose:false});
    scannerInstance=reader;
    try{
      const decoded=await reader.scanFile(file,false);
      return uniqueBarcodeValues([decoded]);
    }finally{
      try{reader.clear();}catch{}

      host.replaceChildren();
    }

  async function decodeCapturedBarcode(canvas){
    const nativeValues=await detectWithNativeBarcodeDetector(canvas);
    if(nativeValues.length)return nativeValues;
    // The fallback decodes the actual still image (not a constantly moving video frame).
    const fullFrameValues=await scanImageWithHtml5Qrcode(canvas).catch(()=>[]);
    if(fullFrameValues.length)return fullFrameValues;
    const focused=upscaleFocusRegion(canvas);
    const focusedNativeValues=await detectWithNativeBarcodeDetector(focused);
    if(focusedNativeValues.length)return focusedNativeValues;
    return await scanImageWithHtml5Qrcode(focused).catch(()=>[]);

  async function captureAndDecodeBarcode(){

      $('#retakeBarcode')?.classList.remove('hide');
      setScanMessage('촬영 완료 · 고해상도 이미지에서 바코드를 판독하고 있습니다...');
      // Release camera after the still is saved; this also prevents the live feed shifting during decode.
      if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null;}

      setScanMessage('바코드를 읽지 못했습니다. 초점을 맞추고 바코드 전체가 보이게 다시 촬영해 주세요.');

    }catch(err){
      setScanMessage(err?.message||'바코드 촬영 중 오류가 발생했습니다.');
      setScanStatus('번호를 입력하지 않았습니다. 다시 촬영하거나 직접 입력해 주세요.','error');

  }
  function showBarcodeCandidates(values){

  async function finishScan(value){
    const inputId=activeBarcodeInput;

    if(!exactValue){setScanMessage('빈 바코드 값은 입력할 수 없습니다. 다시 촬영해 주세요.');return;}

      input.value=exactValue;
      input.dispatchEvent(new Event('input',{bubbles:true}));

  }

  async function validAccessToken(){if(!cloudSession?.access_token)throw new Error('먼저 클라우드에 로그인하세요.');if(cloudSession.expires_at>Date.now()+60000)return cloudSession.access_token;const refreshed=await authRequest('token?grant_type=refresh_token',{refresh_token:cloudSession.refresh_token});cloudSession={...cloudSession,access_token:refreshed.access_token,refresh_token:refreshed.refresh_token||cloudSession.refresh_token,expires_at:Date.now()+(Number(refreshed.expires_in)||3600)*1000,user:refreshed.user||cloudSession.user};localStorage.setItem(SESSION_KEY,JSON.stringify(cloudSession));return cloudSession.access_token;}
  async function cloudRequest(path,options={}){const token=await validAccessToken();const headers={'apikey':cloudConfig.key,'Authorization':'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})};const res=await fetch(normalizedUrl()+'/rest/v1/'+path,{method:options.method||'GET',headers,body:options.body===undefined?undefined:JSON.stringify(options.body)});if(!res.ok){const text=await res.text();throw new Error(text.slice(0,350)||`클라우드 요청 오류 (${res.status})`);}if(res.status===204)return null;const txt=await res.text();return txt?JSON.parse(txt):null;}
  async function syncFromCloudMerge(){const uid=cloudSession?.user?.id;if(!uid)throw new Error('로그인 사용자 정보를 확인할 수 없습니다.');const [remoteInv,remoteEvents]=await Promise.all([cloudRequest(`inventory?select=barcode,data&user_id=eq.${encodeURIComponent(uid)}`),cloudRequest(`events?select=id,data&user_id=eq.${encodeURIComponent(uid)}`)]);const imap=new Map();[...state.inventory,...(remoteInv||[]).map(r=>r.data)].forEach(item=>{if(!item?.barcode)return;const code=cleanBarcodeValue(item.barcode);const prev=imap.get(code);if(!prev||(item.updatedAt||'')>(prev.updatedAt||''))imap.set(code,item);});const emap=new Map();[...state.events,...(remoteEvents||[]).map(r=>r.data)].forEach(ev=>{if(ev?.id)emap.set(ev.id,ev)});state.inventory=[...imap.values()];state.events=[...emap.values()].sort((a,b)=>(a.timestamp||'').localeCompare(b.timestamp||''));const deleted=pruneDeletedInventoryByEvents();saveStore();for(const code of deleted)await deleteCloudInventoryBarcode(code);await syncAll();}
  async function syncOne(item,event){if(!cloudSession?.access_token)return;try{const uid=cloudSession.user.id;await cloudRequest('inventory?on_conflict=user_id%2Cbarcode',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,barcode:item.barcode,data:item,updated_at:item.updatedAt||new Date().toISOString()}});await cloudRequest('events?on_conflict=user_id%2Cid',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,id:event.id,data:event,created_at:event.timestamp||new Date().toISOString()}});updateSyncLabels();}catch(e){const s=$('#cloudStatusText');if(s)s.textContent='로컬 저장은 완료했지만 클라우드 동기화에 실패했습니다: '+e.message;toast('로컬 저장 완료 · 클라우드 동기화 실패: '+e.message,'error');}}
  async function syncAll(){if(!cloudSession?.access_token)return;try{const uid=cloudSession.user.id;const latest=latestItemActionByBarcode();const deletedCodes=[...latest.entries()].filter(([,v])=>v.deleted).map(([code])=>code);if(pruneDeletedInventoryByEvents().length)saveStore();for(const code of deletedCodes)await deleteCloudInventoryBarcode(code);for(let i=0;i<state.inventory.length;i+=100){const batch=state.inventory.slice(i,i+100).map(item=>({user_id:uid,barcode:item.barcode,data:item,updated_at:item.updatedAt||new Date().toISOString()}));if(batch.length)await cloudRequest('inventory?on_conflict=user_id%2Cbarcode',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:batch});}for(let i=0;i<state.events.length;i+=100){const batch=state.events.slice(i,i+100).map(ev=>({user_id:uid,id:ev.id,data:ev,created_at:ev.timestamp||new Date().toISOString()}));if(batch.length)await cloudRequest('events?on_conflict=user_id%2Cid',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:batch});}const s=$('#cloudStatusText');if(s)s.textContent=`클라우드 동기화 완료 · 품목 ${state.inventory.length}개, 이력 ${state.events.length}건`;updateSyncLabels();}catch(e){const s=$('#cloudStatusText');if(s)s.textContent='동기화 실패: '+e.message;toast('클라우드 동기화 오류: '+e.message,'error');}}
  async function deleteCloudInventoryBarcode(barcode){const uid=cloudSession?.user?.id;if(!uid)return;await cloudRequest(`inventory?user_id=eq.${encodeURIComponent(uid)}&barcode=eq.${encodeURIComponent(String(barcode))}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});}
  async function deleteCloudAll(){const uid=cloudSession.user.id;await cloudRequest(`inventory?user_id=eq.${encodeURIComponent(uid)}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});await cloudRequest(`events?user_id=eq.${encodeURIComponent(uid)}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});}
  function cloudLogout(){cloudSession=null;localStorage.removeItem(SESSION_KEY);updateSyncLabels();renderMain();toast('클라우드에서 로그아웃했습니다. 로컬 데이터는 유지됩니다.','success');}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b&&b.closest('#sideNav,#mobileNav'))setView(b.dataset.view);});
  // The import input exists only after the Settings view is rendered. Use delegated handling
  // so the initial Dashboard render is never interrupted by a null-element exception.
  document.addEventListener('change',e=>{
    if(e.target && e.target.id==='importFile'){
      const file=e.target.files?.[0];
      if(file)importJSONFile(file);
      e.target.value='';
    }
  });
  renderMain();
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  if(cloudConfig.url&&cloudConfig.key&&cloudSession?.access_token){syncFromCloudMerge().then(()=>{updateSyncLabels();if(currentView==='settings')renderMain();}).catch(e=>{console.warn('Cloud resume:',e);toast('클라우드 재연결 필요: 설정에서 다시 로그인해 주세요.','error');});}
})();
</script>
