    ].map((c,i)=>`<div class="metric"><div class="metric-top"><div class="metric-label">${c[0]}</div><div class="metric-icon">${c[2]}</div></div><div class="metric-value">${c[1].toLocaleString('ko-KR')}</div><div class="metric-bottom">${c[3]}</div></div>`).join('')}</div>
    ${renderDashboardCSMinimumPanel()}
    <div class="panel-grid"><section class="panel panel-pad"><div class="panel-head"><div><h3 class="panel-title">월별 업무 처리량</h3><div class="panel-desc">최근 6개월 · 등록된 업무 이력 기준</div></div><span class="pill green">${new Date().getFullYear()}년</span></div><div class="chart"><div class="bar-chart">${last6.map(m=>`<div class="bar-group"><div class="bar-value">${m.count}</div><div class="bar-stack"><div class="bar-fill" style="height:${Math.max(m.count?4:0,m.count/maxBar*100)}%"></div></div><div class="bar-month">${m.label}</div></div>`).join('')}</div></div><div class="legend"><span><i></i>월별 등록 이력 건수</span><span style="margin-left:auto">총 ${last6.reduce((a,b)=>a+b.count,0)}건</span></div></section>
    <section class="panel panel-pad"><div class="panel-head"><div><h3 class="panel-title">현재 업무 단계</h3><div class="panel-desc">단계별 현재 품목 수</div></div><button class="btn small" data-action="show-inventory">재고 확인 ↗</button></div><div class="stage-list">${counts.map(s=>`<div class="stage-line"><div class="stage-name">${esc(s.stage)}</div><div class="stage-track"><div class="stage-progress" style="width:${Math.min(100,s.count/Math.max(1,state.inventory.length)*100)}%"></div></div><div class="stage-count">${s.count}</div></div>`).join('')}</div><div class="divider"></div><div class="panel-desc">전체 품목 ${state.inventory.length}개 중 폐기 ${statCount('폐기')}개</div></section></div>
    <div class="panel-grid"><section class="panel"><div class="panel-head" style="padding:19px 20px 0;margin-bottom:8px"><div><h3 class="panel-title">최근 업무 이력</h3><div class="panel-desc">가장 최근에 등록·변경된 기록</div></div><button class="btn small" data-action="show-history">전체 이력 ↗</button></div><div class="table-wrap"><table><thead><tr><th>업무 단계</th><th>제품 / 모델</th><th>바코드</th><th>등급</th><th>입력자</th><th>처리 일시</th></tr></thead><tbody>${recent.length?recent.map(e=>`<tr><td>${stagePill(e.stage)}</td><td><div class="table-primary">${esc(e.data?.productName||e.productName||'-')}</div><div class="table-secondary">${esc(e.data?.modelName||e.modelName||'-')}</div></td><td>${esc(e.barcode||'-')}</td><td>${gradeHtml(e.data?.grade||e.grade)}</td><td>${esc(eventOperator(e)||'-')}</td><td>${fmtDate(e.timestamp,true)}</td></tr>`).join(''):`<tr><td colspan="6"><div class="empty"><div class="empty-icon">▤</div>아직 등록된 업무 이력이 없습니다.<br>업무 등록에서 첫 품목을 추가해 보세요.</div></td></tr>`}</tbody></table></div></section>
    <section class="panel panel-pad"><div class="panel-head"><div><h3 class="panel-title">등급별 재고</h3><div class="panel-desc">폐기·출고 단계를 제외한 현재 재고</div></div></div><div class="stage-list">${gradeCounts.map(g=>`<div class="stage-line"><div style="display:flex;align-items:center;gap:7px">${gradeHtml(g.grade)}<span class="stage-name">등급</span></div><div class="stage-track"><div class="stage-progress" style="width:${g.count/maxGrade*100}%;background:${g.grade==='D'?'#cf7272':g.grade==='C'?'#d4a342':g.grade==='A'||g.grade==='B'?'#4d8dbb':'var(--green)'}"></div></div><div class="stage-count">${g.count}</div></div>`).join('')}</div><div class="divider"></div><div class="small-note">등급은 S(최상)부터 D(폐급/불량)까지 관리합니다. 실제 등급 의미는 사내 기준에 맞춰 적용해 주세요.</div></section></div>`;
  }
  function renderDashboardCSMinimumPanel(){
    const rows=getCSStockRows();
    const lowRows=rows.filter(row=>row.minimum!==null&&row.current<row.minimum);
    const totalCS=rows.reduce((sum,row)=>sum+row.current,0);
    return `<section class="panel panel-pad cs-minimum-dashboard" style="margin-bottom:16px">
      <div class="panel-head"><div><h3 class="panel-title">CS용 최소수량 · 현재수량 현황</h3><div class="panel-desc">CS용으로 등록된 제품을 모델별로 묶어 현재 재고와 설정한 최소수량을 비교합니다.</div></div><div class="btn-row no-print"><span class="pill ${lowRows.length?'red':'green'}">${lowRows.length?`최소수량 부족 ${lowRows.length}종`:'최소수량 부족 없음'}</span><button class="btn small" data-action="open-cs-minimum-settings">최소수량 설정 ↗</button></div></div>
      <div class="outbound-summary" style="margin-bottom:14px"><div class="metric"><div class="metric-label">현재 CS용 재고</div><div class="metric-value">${totalCS.toLocaleString('ko-KR')}개</div><div class="metric-bottom">등록된 CS용 바코드 수량 합계</div></div><div class="metric"><div class="metric-label">최소수량 기준 등록</div><div class="metric-value">${csMinimumCatalog.items.length.toLocaleString('ko-KR')}종</div><div class="metric-bottom">제품·모델별 기준 수량</div></div><div class="metric"><div class="metric-label">최소수량 부족</div><div class="metric-value" style="${lowRows.length?'color:var(--red)':''}">${lowRows.length.toLocaleString('ko-KR')}종</div><div class="metric-bottom">현재수량이 최소수량보다 적은 모델</div></div></div>
      ${rows.length?`<div class="table-wrap"><table class="cs-minimum-table"><thead><tr><th>제품명</th><th>모델명</th><th style="text-align:right">현재 수량</th><th style="text-align:right">최소 수량</th><th>재고 상태</th></tr></thead><tbody>${rows.map(row=>{const configured=row.minimum!==null;const shortage=configured?Math.max(0,row.minimum-row.current):0;const status=!configured?'<span class="pill gray">기준 미설정</span>':shortage?`<span class="pill red">부족 ${shortage}개</span>`:'<span class="pill green">정상</span>';return `<tr><td><strong>${esc(row.productName)}</strong></td><td>${esc(row.modelName)}</td><td style="text-align:right;font-weight:850">${row.current.toLocaleString('ko-KR')}개</td><td style="text-align:right">${configured?row.minimum.toLocaleString('ko-KR')+'개':'-'}</td><td>${status}</td></tr>`;}).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">▦</div>CS용 재고가 아직 없습니다.<br>설정에서 제품별 최소수량을 등록하면 현재 수량과 함께 표시됩니다.</div>`}
      <div class="small-note" style="margin-top:10px">현재 수량은 재고 단계가 ‘CS용’인 바코드 품목 수를 기준으로 계산합니다. 최소수량은 설정에서 제품·모델별로 지정합니다.</div>
    </section>`;
  }
  function renderWorkflow(){return `<div class="section-head"><div><div class="eyebrow">WORKFLOW / REGISTER</div><h2 class="section-title" style="margin-top:7px">업무 등록</h2><div class="section-sub">업무 단계를 선택하고 상품 정보와 바코드를 입력하세요. 같은 바코드는 기존 품목을 찾아 단계가 갱신됩니다.</div></div></div><div class="workflow-grid">${WORKFLOW_STAGES.map(s=>`<button class="workflow-card" data-stage="${esc(s.id)}"><div class="workflow-head"><div class="workflow-ico">${s.icon}</div><span class="workflow-count">${s.id==='재입고'?'대기 '+getPendingReintakeItems().length+'개':'현재 '+statCount(s.id)+'개'}</span></div><h3>${s.label}</h3><p>${s.hint}</p><span class="arrow">↗</span></button>`).join('')}</div><div class="panel panel-pad" style="margin-top:17px"><div class="panel-head"><div><h3 class="panel-title">등록 순서</h3><div class="panel-desc">현장 담당자가 빠르게 기록할 수 있도록 단계를 단순화했습니다.</div></div></div><div class="workflow-steps">${WORKFLOW_STAGES.map((s,i)=>`<div style="text-align:center"><div style="height:32px;width:32px;border-radius:10px;background:#edf6e8;color:#4b8d38;font-weight:850;font-size:11px;display:grid;place-items:center;margin:0 auto 7px">${String(i+1).padStart(2,'0')}</div><div style="font-size:10px;font-weight:750">${s.label}</div></div>`).join('')}</div><div class="small-note" style="margin-top:18px">※ 재입고는 기존 출고 상태인 제품만 처리할 수 있습니다. 재입고 기록은 이력에 남고, 선택한 AS접수·CS용·상품화 재고로 이동합니다. 폐기 처리된 품목도 기록에서 사라지지 않고 폐기 사유와 함께 보관됩니다.</div></div>`;}
  function renderOutbound(){
    const outboundItems=state.inventory.filter(i=>i.stage==='출고등록').sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
    const activeOutboundEvents=getActiveOutboundEvents().sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||''));
    const outboundEvents=activeOutboundEvents.slice(0,30);
    const cancelEvents=[...state.events].filter(e=>e.stage==='출고취소').sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||'')).slice(0,20);
    const monthKey=today().slice(0,7);const monthCount=activeOutboundEvents.filter(e=>(e.timestamp||'').slice(0,7)===monthKey).length;
    return `<div class="section-head"><div><div class="eyebrow">OUTBOUND / REGISTER</div><h2 class="section-title" style="margin-top:7px">출고등록</h2><div class="section-sub">기존 재고를 바코드로 확인한 다음 출고처·출고자·출고 구분·날짜를 기록합니다.</div></div><div class="btn-row no-print"><button class="btn" data-view="history">재고·이력 보기</button><button class="btn primary" data-action="new-outbound">＋ 출고 등록</button><button class="btn danger" data-action="cancel-outbound">출고 등록 취소</button></div></div>
      <div class="outbound-summary"><div class="metric"><div class="metric-label">현재 출고 처리 품목</div><div class="metric-value">${outboundItems.length.toLocaleString('ko-KR')}</div><div class="metric-bottom">현재 단계가 출고등록인 품목</div></div><div class="metric"><div class="metric-label">이번 달 유효 출고 이력</div><div class="metric-value">${monthCount.toLocaleString('ko-KR')}</div><div class="metric-bottom">취소된 건 제외 · ${today().slice(0,7).replace('-', '년 ')}월</div></div><div class="metric"><div class="metric-label">누적 유효 출고 이력</div><div class="metric-value">${activeOutboundEvents.length.toLocaleString('ko-KR')}</div><div class="metric-bottom">출고 취소 건 제외</div></div></div>
      <section class="panel panel-pad" style="margin-bottom:16px"><div class="panel-head"><div><h3 class="panel-title">출고 등록 순서</h3><div class="panel-desc">출고 구분과 출고자를 입력합니다. 취소한 내역도 사유와 함께 이력에 남습니다.</div></div></div><div class="stage-list"><div class="stage-line" style="grid-template-columns:25px 1fr"><span class="grade S">1</span><div><div style="font-size:12px;font-weight:750">기존 바코드 스캔</div><div class="small-note">등록된 재고 바코드만 출고 처리할 수 있습니다.</div></div></div><div class="stage-line" style="grid-template-columns:25px 1fr"><span class="grade A">2</span><div><div style="font-size:12px;font-weight:750">출고처·출고자·출고 구분 입력</div><div class="small-note">출고 구분에서 CS용 또는 상품화 중 하나를 선택하고 출고자 이름을 입력합니다.</div></div></div><div class="stage-line" style="grid-template-columns:25px 1fr"><span class="grade B">3</span><div><div style="font-size:12px;font-weight:750">저장 및 이력 반영</div><div class="small-note">저장 즉시 현재 재고 단계가 출고등록으로 변경됩니다. 취소하면 취소 사유를 기록하고 출고 전 재고 단계로 복원합니다.</div></div></div></div></section>
      <section class="panel" style="margin-bottom:16px"><div class="panel-head" style="padding:18px 20px 0"><div><h3 class="panel-title">최근 출고 이력</h3><div class="panel-desc">취소되지 않은 최근 출고 30건 · 출고처, 출고자 및 출고 구분 확인</div></div><span class="pill blue">${outboundEvents.length}건</span></div><div class="table-wrap"><table><thead><tr><th>출고 날짜</th><th>제품 / 모델</th><th>바코드</th><th>출고처</th><th>출고자</th><th>출고 구분</th><th>등급</th></tr></thead><tbody>${outboundEvents.length?outboundEvents.map(e=>`<tr><td>${fmtDate(e.data?.outboundDate||e.timestamp)}</td><td><div class="table-primary">${esc(e.data?.productName||'-')}</div><div class="table-secondary">${esc(e.data?.modelName||'-')}</div></td><td><span class="table-primary">${esc(e.barcode||'-')}</span></td><td>${esc(e.data?.outboundTo||'-')}</td><td>${esc(e.data?.outboundOperator||e.operatorName||'-')}</td><td>${esc(e.data?.outboundReason||'-')}</td><td>${gradeHtml(e.data?.grade)}</td></tr>`).join(''):`<tr><td colspan="7"><div class="empty"><div class="empty-icon">↗</div>아직 유효한 출고 등록 내역이 없습니다.</div></td></tr>`}</tbody></table></div><div class="small-note" style="padding:0 18px 15px">※ 출고 취소된 기록은 아래 취소 이력과 전체 업무 이력에 보존됩니다.</div></section>
      <section class="panel"><div class="panel-head" style="padding:18px 20px 0"><div><h3 class="panel-title">출고 등록 취소 내역</h3><div class="panel-desc">취소 날짜, 복원 위치 및 입력한 취소 사유</div></div><span class="pill gray">${cancelEvents.length}건</span></div><div class="table-wrap"><table><thead><tr><th>취소 날짜</th><th>제품 / 모델</th><th>바코드</th><th>복원 위치</th><th>취소 사유</th></tr></thead><tbody>${cancelEvents.length?cancelEvents.map(e=>`<tr><td>${fmtDate(e.timestamp,true)}</td><td><div class="table-primary">${esc(e.data?.productName||'-')}</div><div class="table-secondary">${esc(e.data?.modelName||'-')}</div></td><td>${esc(e.barcode||'-')}</td><td>${esc(e.data?.restoredStage||'-')}</td><td>${esc(e.data?.cancelReason||e.data?.memo||'-')}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">아직 출고 등록을 취소한 내역이 없습니다.</div></td></tr>`}</tbody></table></div><div class="small-note" style="padding:0 18px 15px">취소 내역은 삭제되지 않으며 Google Sheets의 전체기록 및 출고취소 탭에도 저장 요청됩니다.</div></section>`;
  }
  function renderHistory(){return `<div class="section-head"><div><div class="eyebrow">INVENTORY / HISTORY</div><h2 class="section-title" style="margin-top:7px">재고·이력 조회</h2><div class="section-sub">바코드, 제품명, 모델명으로 검색하고 현재 상태 또는 업무 변경 내역을 확인합니다.</div></div><div class="btn-row no-print"><button class="btn" data-action="export-csv">CSV 내보내기</button><button class="btn primary" data-action="new-work">＋ 업무 등록</button></div></div><div class="panel"><div class="panel-pad" style="padding-bottom:14px"><div class="toolbar"><div class="segmented"><button class="${historyMode==='inventory'?'active':''}" data-history-mode="inventory">현재 재고 (${state.inventory.length})</button><button class="${historyMode==='events'?'active':''}" data-history-mode="events">업무 이력 (${state.events.length})</button></div><div class="searchbox"><span class="search-icon">⌕</span><input id="historySearch" placeholder="바코드·제품명·모델명 검색"></div><select class="filter-select" id="historyFilter"><option value="">전체 단계</option>${[...STAGES,OUTBOUND_STAGE,OUTBOUND_CANCEL_STAGE].map(s=>`<option value="${s.id}">${s.label}</option>`).join('')}</select></div></div><div class="table-wrap" id="historyTableWrap">${renderHistoryTable()}</div><div class="small-note" style="padding:0 18px 15px">총 ${historyMode==='inventory'?state.inventory.length:state.events.length}건 · 기록은 바코드 기준으로 연결됩니다. 이동 횟수는 AS발송·출고등록을 나감, AS회수·최초 AS접수 이후 재접수를 들어옴으로 계산합니다.</div></div>`;}
  function renderHistoryTable(){if(historyMode==='inventory'){const list=[...state.inventory].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));return `<table><thead><tr><th>단계</th><th>제품 / 모델 · 이동 횟수</th><th>바코드</th><th>가맹점 / 출고처</th><th>등급</th><th>최종 변경</th><th class="no-print">관리</th></tr></thead><tbody>${list.length?list.map(item=>{const move=getMovementCounts(item.barcode);return `<tr data-search="${esc([item.stage,item.productName,item.modelName,item.barcode,item.branch,item.returnedBranch,item.outboundTo,item.outboundReason,item.grade,item.reason,item.operatorName].join(' ').toLowerCase())}" data-stage="${esc(item.stage)}"><td>${stagePill(item.stage)}</td><td><div class="table-primary">${esc(item.productName||'-')}</div><div class="table-secondary">${esc(item.modelName||'-')}</div><div class="movement-line" title="나감: AS발송+출고등록 / 들어옴: AS회수+최초 AS접수 이후 재접수"><span class="movement-tag out">↗ 나감 ${move.outbound}회</span><span class="movement-tag in">↩ 들어옴 ${move.returned}회</span></div><div class="table-secondary">최근 입력자: ${esc(item.operatorName||'-')}</div></td><td><span class="table-primary">${esc(item.barcode||'-')}</span></td><td>${esc(item.outboundTo||item.returnedBranch||item.branch||'-')}</td><td>${gradeHtml(item.grade)}</td><td>${fmtDate(item.updatedAt,true)}</td><td class="no-print"><div class="btn-row" style="flex-wrap:nowrap"><button class="btn small" data-detail-barcode="${esc(item.barcode)}">상세</button><button class="btn small primary" data-edit-barcode="${esc(item.barcode)}">수정</button><button class="btn small danger" data-delete-barcode="${esc(item.barcode)}">삭제</button></div></td></tr>`}).join(''):`<tr><td colspan="7"><div class="empty"><div class="empty-icon">▦</div>등록된 품목이 없습니다.</div></td></tr>`}</tbody></table>`;}
    const events=[...state.events].sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||''));return `<table><thead><tr><th>업무 단계</th><th>제품 / 모델 · 누적 이동</th><th>바코드</th><th>등급</th><th>입력자</th><th>변경 날짜</th><th>메모</th></tr></thead><tbody>${events.length?events.map(e=>{const move=getMovementCounts(e.barcode);return `<tr data-search="${esc([e.stage,e.data?.productName,e.data?.modelName,e.barcode,e.data?.branch,e.data?.returnedBranch,e.data?.grade,e.data?.reason,e.data?.cancelReason,e.data?.memo,e.data?.outboundTo,e.data?.outboundOperator,e.data?.outboundReason,e.operatorName,e.data?.operatorName].join(' ').toLowerCase())}" data-stage="${esc(e.stage)}"><td>${stagePill(e.stage)}</td><td><div class="table-primary">${esc(e.data?.productName||'-')}</div><div class="table-secondary">${esc(e.data?.modelName||'-')}</div><div class="movement-line"><span class="movement-tag out">↗ 나감 ${move.outbound}회</span><span class="movement-tag in">↩ 들어옴 ${move.returned}회</span></div></td><td>${esc(e.barcode||'-')}</td><td>${gradeHtml(e.data?.grade)}</td><td>${esc(eventOperator(e)||'-')}</td><td>${fmtDate(e.timestamp,true)}</td><td>${esc(eventMemo(e))}</td></tr>`}).join(''):`<tr><td colspan="7"><div class="empty"><div class="empty-icon">◷</div>아직 업무 이력이 없습니다.</div></td></tr>`}</tbody></table>`;}
  function renderReports(){const y=Number($('#reportYear')?.value||new Date().getFullYear());const m=Number($('#reportMonth')?.value||new Date().getMonth()+1);return reportBody(y,m,reportCompareMonth);}
  function reportBody(year,month,compareMonth){let start,end,label;if(reportMode==='monthly'){start=new Date(year,month-1,1);end=new Date(year,month,1);label=`${year}년 ${month}월 월간 보고서`;}else{start=new Date(year,0,1);end=new Date(year+1,0,1);label=`${year}년 연간 보고서`;}
    const cancelledOutboundIds=getCancelledOutboundEventIds();
    const getEventsBetween=(rangeStart,rangeEnd)=>state.events.filter(e=>{const d=new Date(e.timestamp||0);return d>=rangeStart&&d<rangeEnd&&!(e.stage==='출고등록'&&cancelledOutboundIds.has(e.id));});
    const periodEvents=getEventsBetween(start,end);
    const closed=periodEvents.filter(e=>e.stage==='폐기').length;const newProducts=periodEvents.filter(e=>e.stage==='AS접수').length;const goods=periodEvents.filter(e=>e.stage==='상품화').length;const rows=[...STAGES,REINTAKE_STAGE,OUTBOUND_STAGE,OUTBOUND_CANCEL_STAGE].map(s=>({stage:s.id,count:periodEvents.filter(e=>e.stage===s.id).length}));const max=Math.max(1,...rows.map(r=>r.count));const periodItems=state.inventory.filter(item=>{const d=new Date(item.updatedAt||0);return d>=start&&d<end;}).length;
    const currentStageCounts=[...STAGES,OUTBOUND_STAGE].map(s=>({stage:s.id,count:statCount(s.id)}));
    // 보고서 작성 시점의 CS용 재고와 최소수량 현황입니다. 과거 월말 재고 스냅샷이 아닌 현재 상태를 표시합니다.
    const csReportRows=getCSStockRows();
    const csReportTotal=csReportRows.reduce((sum,row)=>sum+row.current,0);

    const csShortageTotal=csLowRows.reduce((sum,row)=>sum+(row.minimum-row.current),0);
    const csReportHtml=`<section class="panel cs-report-panel"><div class="panel-head"><div><h3 class="panel-title">CS용 현재 재고 · 최소수량 현황</h3><div class="panel-desc">보고서 작성 시점의 현재 수량을 표시합니다. 월간·연간 과거 시점의 재고가 아니라 현재 재고 스냅샷입니다.</div></div><span class="pill green">CS STOCK</span></div><div class="cs-report-summary"><div class="cs-report-stat"><span>현재 CS용 재고</span><strong>${csReportTotal.toLocaleString('ko-KR')}개</strong></div><div class="cs-report-stat"><span>최소수량 기준 등록</span><strong>${csConfiguredRows.length.toLocaleString('ko-KR')}종</strong></div><div class="cs-report-stat ${csLowRows.length?'is-low':''}"><span>최소수량 부족 모델</span><strong>${csLowRows.length.toLocaleString('ko-KR')}종</strong></div><div class="cs-report-stat ${csShortageTotal?'is-low':''}"><span>총 부족 수량</span><strong>${csShortageTotal.toLocaleString('ko-KR')}개</strong></div></div>${csReportRows.length?`<div class="table-wrap"><table class="cs-report-table"><thead><tr><th>제품명</th><th>모델명</th><th style="text-align:right">현재 수량</th><th style="text-align:right">최소 수량</th><th style="text-align:right">부족 수량</th><th>상태</th></tr></thead><tbody>${csReportRows.map(row=>{const configured=row.minimum!==null;const shortage=configured?Math.max(0,row.minimum-row.current):0;const status=!configured?'<span class="pill gray">기준 미설정</span>':shortage?`<span class="pill red">부족 ${shortage}개</span>`:'<span class="pill green">정상</span>';return `<tr><td><strong>${esc(row.productName)}</strong></td><td>${esc(row.modelName)}</td><td style="text-align:right;font-weight:800">${row.current.toLocaleString('ko-KR')}개</td><td style="text-align:right">${configured?row.minimum.toLocaleString('ko-KR')+'개':'-'}</td><td style="text-align:right;color:${shortage?'var(--red)':'inherit'};font-weight:${shortage?800:500}">${configured?shortage.toLocaleString('ko-KR')+'개':'-'}</td><td>${status}</td></tr>`;}).join('')}</tbody></table></div>`:`<div class="empty">CS용 재고가 없습니다. 업무 등록에서 CS용으로 등록하면 이 보고서에 표시됩니다.</div>`}<div class="small-note cs-report-note">※ 최소수량 기준은 설정·데이터 관리에서 제품·모델별로 등록합니다. 출고·재입고에 따라 현재 수량이 변경되며 보고서를 다시 열면 갱신됩니다.</div></section>`;
    // 선택 기간의 업무 이력을 바코드/제품별로 묶어 제품 단위 실적을 계산합니다.
    const productMap=new Map();

      const d=e.data||{};
      const key=String(e.barcode||d.barcode||`${d.productName||'미등록'}|${d.modelName||''}`);
      if(!productMap.has(key)) productMap.set(key,{key,barcode:e.barcode||d.barcode||'',productName:d.productName||e.productName||'제품명 없음',modelName:d.modelName||e.modelName||'',total:0,stages:{},lastAt:e.timestamp||''});
      const row=productMap.get(key); row.total++; row.stages[e.stage]=(row.stages[e.stage]||0)+1;
      if((e.timestamp||'')>row.lastAt) row.lastAt=e.timestamp||'';
      if(!row.productName||row.productName==='제품명 없음') row.productName=d.productName||e.productName||row.productName;
      if(!row.modelName) row.modelName=d.modelName||e.modelName||'';
    });
    const productRows=[...productMap.values()].sort((a,b)=>b.total-a.total||String(a.productName).localeCompare(String(b.productName),'ko'));
    const productStageCols=['AS접수','AS발송','AS회수','출고등록','CS용','상품화','폐기'];
    let comparisonChartHtml='';
    if(reportMode==='monthly'){
      const compareYear=compareMonth>month?year-1:year;
      const compareStart=new Date(compareYear,compareMonth-1,1);

      const compareLabel=`${compareYear}년 ${compareMonth}월`;
      const currentLabel=`${year}년 ${month}월`;
      const comparisonStages=[...STAGES,REINTAKE_STAGE,OUTBOUND_STAGE,OUTBOUND_CANCEL_STAGE];
      const comparisonRows=comparisonStages.map(stage=>({stage:stage.id,previous:compareMonthEvents.filter(e=>e.stage===stage.id).length,current:periodEvents.filter(e=>e.stage===stage.id).length}));
      const comparisonMax=Math.max(1,...comparisonRows.flatMap(r=>[r.previous,r.current]));
      const difference=periodEvents.length-compareMonthEvents.length;
      const differenceText=compareMonthEvents.length?`${difference>0?'+':''}${difference}건 (${difference>0?'+':''}${Math.round(difference/compareMonthEvents.length*100)}%)`:periodEvents.length?'비교 월 기록 없음':'동일';
      comparisonChartHtml=`<section class="panel report-compare-panel"><div class="panel-head"><div><h3 class="panel-title">월별 업무 처리량 비교</h3><div class="panel-desc">${compareLabel}과 ${currentLabel}의 업무 단계별 등록 건수를 비교합니다. 아래에서 비교할 두 달을 각각 선택할 수 있습니다.</div></div><span class="pill green">MONTHLY COMPARISON</span></div><div class="compare-legend"><span><i class="previous-key"></i>${compareLabel}</span><span><i class="current-key"></i>${currentLabel}</span></div><div class="compare-summary"><div class="compare-summary-card"><div class="caption">${compareMonth}월 전체 업무</div><strong>${compareMonthEvents.length.toLocaleString('ko-KR')}건</strong><div class="sub">${compareYear}년 ${compareMonth}월</div></div><div class="compare-summary-card"><div class="caption">${month}월 전체 업무</div><strong>${periodEvents.length.toLocaleString('ko-KR')}건</strong><div class="sub">${year}년 ${month}월</div></div><div class="compare-summary-card"><div class="caption">${compareMonth}월 대비 증감</div><strong>${differenceText}</strong><div class="sub">취소된 출고는 집계에서 제외</div></div></div><div class="compare-stage-list">${comparisonRows.map(r=>`<div class="compare-stage-row"><div class="compare-stage-name">${esc(r.stage)}</div><div class="compare-stage-bars"><div class="compare-stage-line"><span class="compare-stage-label">${compareMonth}월</span><div class="compare-track"><div class="compare-fill previous" style="width:${r.previous/comparisonMax*100}%"></div></div><span class="compare-value">${r.previous}</span></div><div class="compare-stage-line"><span class="compare-stage-label">${month}월</span><div class="compare-track"><div class="compare-fill current" style="width:${r.current/comparisonMax*100}%"></div></div><span class="compare-value">${r.current}</span></div></div></div>`).join('')}</div></section>`;
    }else{
      const previousYearStart=new Date(year-1,0,1);
      const previousYearEnd=new Date(year,0,1);
      const previousYearEvents=getEventsBetween(previousYearStart,previousYearEnd);
      const monthlyCounts=Array.from({length:12},(_,index)=>{
        const monthStart=new Date(year,index,1),monthEnd=new Date(year,index+1,1);
        const previousMonthStart=new Date(year-1,index,1),previousMonthEnd=new Date(year-1,index+1,1);
        return {month:index+1,previous:getEventsBetween(previousMonthStart,previousMonthEnd).length,current:getEventsBetween(monthStart,monthEnd).length};
      });
      const annualMax=Math.max(1,...monthlyCounts.flatMap(r=>[r.previous,r.current]));
      const difference=periodEvents.length-previousYearEvents.length;
      const differenceText=previousYearEvents.length?`${difference>0?'+':''}${difference}건 (${difference>0?'+':''}${Math.round(difference/previousYearEvents.length*100)}%)`:periodEvents.length?'전년도 기록 없음':'동일';
      comparisonChartHtml=`<section class="panel report-compare-panel"><div class="panel-head"><div><h3 class="panel-title">연간 실적 비교</h3><div class="panel-desc">${year-1}년과 ${year}년의 월별 업무 처리량을 비교합니다.</div></div><span class="pill green">YEARLY COMPARISON</span></div><div class="compare-legend"><span><i class="previous-key"></i>${year-1}년</span><span><i class="current-key"></i>${year}년</span></div><div class="compare-summary"><div class="compare-summary-card"><div class="caption">${year-1}년 전체 업무</div><strong>${previousYearEvents.length.toLocaleString('ko-KR')}건</strong><div class="sub">전년도 합계</div></div><div class="compare-summary-card"><div class="caption">${year}년 전체 업무</div><strong>${periodEvents.length.toLocaleString('ko-KR')}건</strong><div class="sub">선택 연도 합계</div></div><div class="compare-summary-card"><div class="caption">전년 대비 증감</div><strong>${differenceText}</strong><div class="sub">취소된 출고는 집계에서 제외</div></div></div><div class="annual-compare-scroll"><div class="annual-compare-chart">${monthlyCounts.map(r=>`<div class="annual-month-group"><div class="annual-bars"><div class="annual-bar-column"><span class="annual-bar-value">${r.previous||''}</span><div class="annual-bar previous" style="height:${r.previous/annualMax*120}px"></div></div><div class="annual-bar-column"><span class="annual-bar-value">${r.current||''}</span><div class="annual-bar current" style="height:${r.current/annualMax*120}px"></div></div></div><div class="annual-month-label">${r.month}월</div></div>`).join('')}</div></div></section>`;
    }
    return `<div class="section-head"><div><div class="eyebrow">REPORTS / ANALYTICS</div><h2 class="section-title" style="margin-top:7px">월간·연간 보고서</h2><div class="section-sub">월간은 비교할 월과 보고할 월을 각각 선택하고, 연간은 전년도와 선택 연도를 비교합니다. PDF로 저장할 수 있습니다.</div></div><div class="btn-row no-print"><button class="btn" data-action="export-csv">데이터 CSV</button><button class="btn primary" data-action="print-report">PDF 보고서 저장 ↗</button></div></div>
    <div class="panel panel-pad report-controls no-print"><div class="toolbar"><div class="segmented"><button data-report-mode="monthly" class="${reportMode==='monthly'?'active':''}">월간 보고서</button><button data-report-mode="annual" class="${reportMode==='annual'?'active':''}">연간 보고서</button></div><select class="filter-select" id="reportYear" aria-label="보고 연도">${Array.from({length:8},(_,i)=>new Date().getFullYear()-5+i).map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}년</option>`).join('')}</select>${reportMode==='monthly'?`<select class="filter-select" id="reportCompareMonth" aria-label="비교할 월">${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===reportCompareMonth?'selected':''}>비교: ${m}월</option>`).join('')}</select><select class="filter-select" id="reportMonth" aria-label="보고할 월">${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===month?'selected':''}>보고: ${m}월</option>`).join('')}</select>`:''}<span class="small-note">PDF 저장: 버튼을 누른 뒤 프린터에서 ‘PDF로 저장’을 선택하세요.</span></div></div>
    <div class="report-sheet"><div class="print-only" style="font-size:10px;color:#62737d;margin-bottom:14px">AS FLOW · 재고 및 A/S 업무 보고서</div><div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start"><div><div class="eyebrow">AS FLOW · PERIOD REPORT</div><h1 class="report-title" style="margin-top:8px">${label}</h1><div class="report-subtitle">보고서 생성일 ${fmtDate(today())} · 저장된 업무 이력 기준</div></div><div class="pill green">${reportMode==='monthly'?'MONTHLY':'ANNUAL'} REPORT</div></div>
      <div class="report-summary"><div class="report-stat"><div class="label">기간 내 업무 이력</div><div class="value">${periodEvents.length}</div><div class="note">모든 단계의 등록·변경 수</div></div><div class="report-stat"><div class="label">AS 접수</div><div class="value">${newProducts}</div><div class="note">기간 내 접수 기록</div></div><div class="report-stat"><div class="label">상품화 등록</div><div class="value">${goods}</div><div class="note">기간 내 상품화 기록</div></div><div class="report-stat"><div class="label">폐기 처리</div><div class="value">${closed}</div><div class="note">기간 내 폐기 기록</div></div></div>
      ${comparisonChartHtml}

  const SQL_SETUP = `create table if not exists public.inventory (
  user_id uuid not null references auth.users(id) on delete cascade,
  barcode text not null,
  data jsonb not null,
  updated_at timestamptz not null default now(),
  primary key (user_id, barcode)
);
create table if not exists public.events (
  user_id uuid not null references auth.users(id) on delete cascade,
  id text not null,
  data jsonb not null,
  created_at timestamptz not null default now(),
  primary key (user_id, id)
);
create table if not exists public.shared_catalog (
  user_id uuid not null references auth.users(id) on delete cascade,
  catalog_key text not null default 'main',
  data jsonb not null default '[]'::jsonb,
  updated_at timestamptz not null default now(),
  primary key (user_id, catalog_key)
);
alter table public.inventory enable row level security;
alter table public.events enable row level security;
alter table public.shared_catalog enable row level security;
drop policy if exists "Users manage own inventory" on public.inventory;
create policy "Users manage own inventory" on public.inventory for all to authenticated using (auth.uid() = user_id) with check (auth.uid() = user_id);
drop policy if exists "Users manage own events" on public.events;
create policy "Users manage own events" on public.events for all to authenticated using (auth.uid() = user_id) with check (auth.uid() = user_id);
drop policy if exists "Users manage own shared catalog" on public.shared_catalog;
create policy "Users manage own shared catalog" on public.shared_catalog for all to authenticated using (auth.uid() = user_id) with check (auth.uid() = user_id);
revoke all on table public.shared_catalog from anon;
grant select, insert, update, delete on table public.shared_catalog to authenticated;`;
  function renderStaffCatalogSettings(){

  function attachStaffCatalogSettingsEvents(){
    $$('.staffNameForm').forEach(form=>form.addEventListener('submit',e=>{
      e.preventDefault();const type=form.dataset.staffType;const list=type==='outboundOperators'?staffCatalog.outboundOperators:staffCatalog.inputters;
      const input=form.elements.staffName;const name=normalizeCatalogName(input.value);if(!name)return;
      if(list.some(existing=>existing.toLocaleLowerCase()===name.toLocaleLowerCase())){toast('이미 등록된 이름입니다.','error');return;}
      list.push(name);saveStaffCatalog();renderMain();toast(`${type==='outboundOperators'?'출고자':'입력자'} 이름 '${name}'을(를) 추가했습니다.`,'success');
    }));
    $$('[data-staff-action]').forEach(button=>button.addEventListener('click',()=>{
      const type=button.dataset.staffType,index=Number(button.dataset.staffIndex);const list=type==='outboundOperators'?staffCatalog.outboundOperators:staffCatalog.inputters;const old=list[index];if(old===undefined)return;
      if(button.dataset.staffAction==='edit'){
        const next=normalizeCatalogName(prompt('변경할 이름을 입력하세요.',old)||'');if(!next||next===old)return;
        if(list.some((name,i)=>i!==index&&name.toLocaleLowerCase()===next.toLocaleLowerCase())){toast('이미 등록된 이름입니다.','error');return;}
        list[index]=next;saveStaffCatalog();renderMain();toast('이름을 수정했습니다.','success');
      }else if(button.dataset.staffAction==='delete'){
        if(!confirm(`'${old}' 이름을 선택 목록에서 삭제할까요?\n기존 업무 이력에 저장된 이름은 그대로 유지됩니다.`))return;
        list.splice(index,1);saveStaffCatalog();renderMain();toast('이름을 선택 목록에서 삭제했습니다.','success');
      }
    }));
  }
  function renderProductCatalogSettings(){

  function addCatalogProduct(name){
    const clean=normalizeCatalogName(name);if(!clean){toast('제품명을 입력해 주세요.','error');return false;}
    if(productCatalog.some(p=>p.name.toLocaleLowerCase()===clean.toLocaleLowerCase())){toast('이미 등록된 제품명입니다.','error');return false;}
    productCatalog.push({name:clean,models:[]});saveProductCatalog();toast(`제품명 '${clean}'을(를) 추가했습니다.`,'success');return true;
  }
  function attachProductCatalogSettingsEvents(){
    const productForm=$('#catalogProductForm');
    productForm?.addEventListener('submit',e=>{e.preventDefault();const input=$('#catalogNewProductName');if(addCatalogProduct(input.value))renderMain();});
    $$('.catalogModelForm').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const pi=Number(form.dataset.productIndex),input=form.elements.modelName,p=productCatalog[pi],name=normalizeCatalogName(input.value);if(!p||!name)return;if(p.models.some(m=>m.toLocaleLowerCase()===name.toLocaleLowerCase())){toast('이미 등록된 모델명입니다.','error');return;}p.models.push(name);saveProductCatalog();toast(`${p.name} 모델명을 추가했습니다.`,'success');renderMain();}));
    $$('[data-catalog-action]').forEach(button=>button.addEventListener('click',()=>{
      const action=button.dataset.catalogAction,pi=Number(button.dataset.productIndex),mi=Number(button.dataset.modelIndex),p=productCatalog[pi];if(!p)return;
      if(action==='move-product-up'||action==='move-product-down'){
        const nextIndex=pi+(action==='move-product-up'?-1:1);if(nextIndex<0||nextIndex>=productCatalog.length)return;
        [productCatalog[pi],productCatalog[nextIndex]]=[productCatalog[nextIndex],productCatalog[pi]];
        saveProductCatalog();renderMain();toast('제품명 표시 순서를 변경했습니다.','success');
      }else if(action==='move-model-up'||action==='move-model-down'){
        if(!Number.isInteger(mi)||mi<0||mi>=p.models.length)return;
        const nextIndex=mi+(action==='move-model-up'?-1:1);if(nextIndex<0||nextIndex>=p.models.length)return;
        [p.models[mi],p.models[nextIndex]]=[p.models[nextIndex],p.models[mi]];
        saveProductCatalog();renderMain();toast(`${p.name} 모델명 표시 순서를 변경했습니다.`,'success');
      }else if(action==='rename-product'){
        const next=normalizeCatalogName(prompt('변경할 제품명을 입력하세요.',p.name)||'');if(!next||next===p.name)return;
        if(productCatalog.some((x,i)=>i!==pi&&x.name.toLocaleLowerCase()===next.toLocaleLowerCase())){toast('이미 등록된 제품명입니다.','error');return;}
        p.name=next;saveProductCatalog();renderMain();toast('제품명을 수정했습니다.','success');
      }else if(action==='delete-product'){
        if(!confirm(`제품명 '${p.name}' 목록을 삭제할까요?\n기존 재고와 업무 이력은 삭제되지 않습니다.`))return;
        productCatalog.splice(pi,1);saveProductCatalog();renderMain();toast('제품 목록에서 삭제했습니다.','success');
      }else if(action==='edit-model'){
        const old=p.models[mi];if(old===undefined)return;const next=normalizeCatalogName(prompt('변경할 모델명을 입력하세요.',old)||'');if(!next||next===old)return;
        if(p.models.some((m,i)=>i!==mi&&m.toLocaleLowerCase()===next.toLocaleLowerCase())){toast('이미 등록된 모델명입니다.','error');return;}
        p.models[mi]=next;saveProductCatalog();renderMain();toast('모델명을 수정했습니다.','success');
      }else if(action==='delete-model'){
        const old=p.models[mi];if(old===undefined)return;if(!confirm(`모델명 '${old}'을(를) 목록에서 삭제할까요?\n기존 업무 기록은 변경되지 않습니다.`))return;
        p.models.splice(mi,1);saveProductCatalog();renderMain();toast('모델명을 삭제했습니다.','success');
      }
    }));
  }

  function attachCSMinimumSettingsEvents(){
    const product=$('#csMinimumProduct'),model=$('#csMinimumModel'),form=$('#csMinimumForm'),qty=$('#csMinimumQty');
    const refreshModels=(selected='')=>{
      const p=productCatalog.find(x=>x.name===product?.value);
      const models=p?.models||[];
      if(model){model.innerHTML=`<option value="">${p?(models.length?'모델명을 선택하세요':'등록된 모델명이 없습니다'):'먼저 제품명을 선택하세요'}</option>${models.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('')}`;model.disabled=!p||!models.length;model.value=models.includes(selected)?selected:'';}
    };
    product?.addEventListener('change',()=>refreshModels(''));
    form?.addEventListener('submit',e=>{
      e.preventDefault();const productName=normalizeCatalogName(product?.value),modelName=normalizeCatalogName(model?.value),minimum=Number(qty?.value);
      if(!productName||!modelName){toast('제품명과 모델명을 모두 선택해 주세요.','error');return;}
      if(!Number.isInteger(minimum)||minimum<0){toast('최소 수량은 0 이상의 정수로 입력해 주세요.','error');return;}
      const key=csMinimumKey(productName,modelName);
      const existing=csMinimumCatalog.items.findIndex(row=>csMinimumKey(row.productName,row.modelName)===key);
      if(existing>=0){csMinimumCatalog.items[existing].minimum=minimum;}
      else csMinimumCatalog.items.push({productName,modelName,minimum});
      saveCSMinimumCatalog();csMinimumEditKey='';renderMain();toast(`${productName} / ${modelName} 최소수량을 ${minimum}개로 저장했습니다.`,'success');
    });
    $('#csMinimumCancelEdit')?.addEventListener('click',()=>{csMinimumEditKey='';renderMain();});
    $$('[data-cs-min-action]').forEach(button=>button.addEventListener('click',()=>{
      const index=Number(button.dataset.index),row=csMinimumCatalog.items[index];if(!row)return;
      if(button.dataset.csMinAction==='edit'){
        csMinimumEditKey=csMinimumKey(row.productName,row.modelName);
        if(product)product.value=row.productName;refreshModels(row.modelName);if(qty)qty.value=String(row.minimum);
        const saveButton=$('#csMinimumSaveButton');if(saveButton)saveButton.textContent='최소수량 수정 저장';
        $('#csMinimumCancelEdit')?.classList.remove('hide');qty?.focus();
      }else if(button.dataset.csMinAction==='delete'){
        if(!confirm(`${row.productName} / ${row.modelName}의 최소수량 기준을 삭제할까요? CS용 재고와 업무 이력은 삭제되지 않습니다.`))return;
        csMinimumCatalog.items.splice(index,1);saveCSMinimumCatalog();csMinimumEditKey='';renderMain();toast('최소수량 기준을 삭제했습니다.','success');
      }
    }));
  }

다.':'클라우드 연결 전입니다. 연결 전에는 각 기기에 데이터가 따로 저장됩니다.'}</div><div class="divider"></div><details><summary style="font-size:12px;font-weight:800;cursor:pointer">처음 연결하는 방법 보기</summary><div class="small-note" style="margin:12px 0">1. Supabase에서 프로젝트를 만듭니다.<br>2. Authentication에서 팀 공용 이메일/비밀번호 계정을 하나 만듭니다. 가입은 꺼두고 믿을 수 있는 직원에게만 공용 계정을 알려주세요.<br>3. SQL Editor에서 아래 SQL 전체를 실행합니다. 기존 데이터는 삭제되지 않으며 공유용 제품·모델 목록 테이블이 추가됩니다.<br>4. Project URL과 공개용 anon/publishable key를 입력하고 공용 계정으로 로그인합니다.<br>5. 다른 PC·스마트폰에서도 같은 웹앱 주소와 같은 Supabase URL·공개 키·공용 계정으로 로그인합니다.<br>6. 다른 기기의 변경사항은 약 20초마다 자동으로 확인됩니다.</div><div class="code-box">${esc(SQL_SETUP)}</div><div class="btn-row" style="margin-top:10px"><button class="btn small" data-action="copy-sql">공용 연결 SQL 복사</button><button class="btn small" data-action="open-supabase">Supabase 열기 ↗</button></div></details></section></div><div class="panel panel-pad" style="margin-top:16px"><div class="panel-head"><div><h3 class="panel-title">사용 안내 및 개인정보</h3><div class="panel-desc">현장 사용 전에 확인하세요.</div></div></div><div class="stage-list"><div class="stage-line" style="grid-template-columns:24px 1fr"><span class="grade S">1</span><div><div style="font-size:12px;font-weight:750">카메라 바코드 촬영</div><div class="small-note">카메라는 HTTPS 주소에서 열어야 합니다. 카메라 권한을 허용하고, 지원하지 않는 브라우저에서는 바코드 번호를 직접 입력할 수 있습니다.</div></div></div><div class="stage-line" style="grid-template-columns:24px 1fr"><span class="grade A">2</span><div><div style="font-size:12px;font-weight:750">자동 저장 및 백업</div><div class="small-note">브라우저 데이터 삭제 또는 기기 변경 전에 JSON 백업을 내려받으세요. 로컬 모드의 데이터는 브라우저별로 따로 저장됩니다.</div></div></div><div class="stage-line" style="grid-template-columns:24px 1fr"><span class="grade B">3</span><div><div style="font-size:12px;font-weight:750">공용 데이터 보안</div><div class="small-note">클라우드 연결은 Supabase 계정 인증과 사용자별 RLS 정책을 사용합니다. 공유 기기에서는 로그아웃하고, 계정 비밀번호를 안전하게 관리하세요.</div></div></div></div></div>`;}
  function attachViewEvents(){

  function handleAction(action){
    if(action==='new-work')setView('workflow');
    else if(action==='new-outbound')openWorkModal('출고등록');
    else if(action==='cancel-outbound')openOutboundCancelModal();
    else if(action==='quick-report')setView('reports');
    else if(action==='show-inventory'){historyMode='inventory';setView('history');}
    else if(action==='show-history'){historyMode='events';setView('history');}
    else if(action==='open-cs-minimum-settings')setView('settings');
    else if(action==='export-csv')exportCSV();
    else if(action==='backup-json')backupJSON();
    else if(action==='import-json')$('#importFile')?.click();
    else if(action==='print-report')window.print();
    else if(action==='reset-data')resetData();
    else if(action==='save-cloud'){saveConfig();}
    else if(action==='save-google-sheet'){saveGoogleSheetConfig();}
    else if(action==='save-mybox-backup'){saveMyboxBackupSettings();}
    else if(action==='run-mybox-backup-now'){requestMyboxBackupNow();}
    else if(action==='check-mybox-backup-status'){requestMyboxBackupStatus();}
    else if(action==='open-mybox-token')window.open('https://developers.mybox.naver.com/getting-started','_blank','noopener');
    else if(action==='save-security-password'){saveSecurityPassword();}
    else if(action==='open-google-script')window.open('https://script.google.com/home','_blank','noopener');
    else if(action==='cloud-login')cloudLogin();
    else if(action==='cloud-logout')cloudLogout();
    else if(action==='cloud-sync-now')syncNow();
    else if(action==='copy-app-link')copyAppLink();
    else if(action==='copy-sql')navigator.clipboard?.writeText(SQL_SETUP).then(()=>toast('공용 클라우드 SQL을 복사했습니다.','success')).catch(()=>toast('복사할 수 없습니다. SQL을 직접 선택해 복사해 주세요.','error'));
    else if(action==='open-supabase')window.open('https://supabase.com/dashboard','_blank','noopener');
  }

    const outboundHelp=stage==='출고등록'?'<div class="small-note" id="outboundLookupStatus" style="margin-top:10px">바코드를 입력하거나 촬영하면 기존 재고를 조회합니다. 등록된 재고만 출고할 수 있습니다.</div>':'';

    $('#modalRoot').innerHTML=`<div class="modal-backdrop" id="workBackdrop"><div class="modal"><div class="modal-head"><div><div class="eyebrow">WORKFLOW REGISTER</div><h2 style="margin-top:7px">${stage} 등록</h2><p>${stageObj(stage).hint}</p></div><button class="icon-btn" type="button" data-close-modal aria-label="닫기">×</button></div><form id="workForm"><div class="modal-body"><div class="field-grid">${fieldHtml}</div>${outboundHelp}${asDispatchHelp}${asReturnHelp}${reintakeHelp}<div class="small-note" style="margin-top:15px">${stage==='출고등록'?'* 기존 재고에 등록된 바코드만 출고할 수 있습니다. 스캔 후 제품명·모델명이 자동 조회되었는지 확인해 주세요.':['CS용','상품화','폐기','AS회수','AS발송','재입고'].includes(stage)?'* 등록 후 창이 유지됩니다. 다음 등록을 위해 바코드와 사유 등 입력 항목은 초기화됩니다.':'* 필수 항목입니다. AS발송은 AS접수 목록에서 선택한 제품의 정보가 자동 입력됩니다.'}</div></div><div class="modal-foot"><button type="button" class="btn" data-close-modal>닫기</button><button class="btn primary" type="submit">${['CS용','상품화','폐기','AS회수','AS발송','재입고'].includes(stage)?'등록 후 계속 입력':'등록 및 저장'}</button></div></form></div></div>`;
    $$('[data-close-modal]').forEach(b=>b.addEventListener('click',closeModal));$('#workBackdrop').addEventListener('click',e=>{if(e.target.id==='workBackdrop')closeModal();});

    const catalogSelectors=bindProductModelSelectors($('#workForm'),'field-');

  function latestItemActionByBarcode(events=state.events){
    const latest=new Map();
    for(const event of events||[]){
      const code=cleanBarcodeValue(event?.barcode);
      if(!code)continue;
      const stamp=Date.parse(event.timestamp||0)||0;
      const previous=latest.get(code);
      if(!previous||stamp>=previous.timestamp){
        latest.set(code,{timestamp:stamp,deleted:event.action==='품목 삭제'});
      }
    }
    return latest;
  }
  function pruneDeletedInventoryByEvents(){
    const latest=latestItemActionByBarcode();
    const removed=[];
    state.inventory=state.inventory.filter(item=>{
      const code=cleanBarcodeValue(item?.barcode);
      if(latest.get(code)?.deleted){removed.push(String(item.barcode));return false;}
      return true;
    });
    return [...new Set(removed)];
  }
  async function deleteInventoryItem(barcode,passwordVerified=false){
    const code=cleanBarcodeValue(barcode);
    const item=state.inventory.find(i=>cleanBarcodeValue(i.barcode)===code);
    if(!item){toast('삭제할 제품을 찾을 수 없습니다. 목록을 새로고침해 주세요.','error');return;}
    if(!passwordVerified){
      if(!hasSecurityPassword()){
        toast('제품 삭제 전에 설정·데이터 관리에서 관리 비밀번호를 먼저 등록해 주세요.','error');
        setView('settings');
        return;
      }
      const label=[item.productName,item.modelName].filter(Boolean).join(' / ')||'선택한 제품';
      showSecurityPrompt('제품 삭제 비밀번호 확인',`${label} 제품을 삭제하려면 관리 비밀번호를 입력하세요.`,()=>deleteInventoryItem(barcode,true));
      return;
    }
    const label=[item.productName,item.modelName].filter(Boolean).join(' / ')||'선택한 제품';
    const confirmed=confirm(`${label}\n바코드: ${item.barcode}\n\n이 제품을 현재 재고 목록에서 삭제할까요?\n\n※ 기존 AS접수·발송·회수·출고 업무 이력은 보존됩니다. 삭제 기록도 남으며, 클라우드 연결 시 다른 기기에도 반영됩니다.`);
    if(!confirmed)return;
    const now=new Date().toISOString();
    const deletionEvent={
      id:idgen(),barcode:String(item.barcode),stage:'품목 삭제',timestamp:now,
      data:{...item,deletedAt:now},action:'품목 삭제'
    };
    state.inventory=state.inventory.filter(i=>cleanBarcodeValue(i.barcode)!==code);
    state.events.push(deletionEvent);

    sendNewEventToGoogleSheet(deletionEvent);
    renderMain();
    toast('제품을 현재 재고에서 삭제했습니다. 기존 업무 이력은 보존됩니다.','success');
    await syncDeletedInventoryItem(item,deletionEvent);
  }
  async function syncDeletedInventoryItem(item,event){
    if(!cloudSession?.access_token)return;
    try{
      const uid=cloudSession.user.id;
      // Store the deletion event first. If the row deletion is interrupted,
      // the tombstone will remove it the next time another device synchronizes.
      await cloudRequest('events?on_conflict=user_id%2Cid',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,id:event.id,data:event,created_at:event.timestamp}});
      await deleteCloudInventoryBarcode(item.barcode);
      updateSyncLabels();
      toast('클라우드에도 제품 삭제가 반영되었습니다.','success');
    }catch(err){
      const status=$('#cloudStatusText');
      if(status)status.textContent='로컬 삭제는 완료했지만 클라우드 반영에 실패했습니다. 다시 동기화해 주세요: '+err.message;

    }
  }

  function cleanBarcodeValue(value){
    // A barcode is an identifier, not a number. Never convert it to Number or remove leading zeroes.
    return String(value??'').replace(/^\s+|\s+$/g,'');
  }
  function uniqueBarcodeValues(values){return [...new Set((values||[]).map(cleanBarcodeValue).filter(v=>v.length>0))];}
  async function detectWithNativeBarcodeDetector(canvas){
    if(!('BarcodeDetector' in window))return [];
    try{
      let detector;
      try{
        const formats=await window.BarcodeDetector.getSupportedFormats();
        detector=formats?.length?new window.BarcodeDetector({formats}):new window.BarcodeDetector();
      }catch{detector=new window.BarcodeDetector();}
      const hits=await detector.detect(canvas);
      return uniqueBarcodeValues((hits||[]).map(hit=>hit?.rawValue));
    }catch{return [];}
  }
  function upscaleFocusRegion(source){
    // Second-pass fallback: enlarge the green guide area from the still image for small barcodes.
    const sx=Math.round(source.width*.16),sy=Math.round(source.height*.30);
    const sw=Math.max(1,Math.round(source.width*.68)),sh=Math.max(1,Math.round(source.height*.40));
    const canvas=document.createElement('canvas');
    canvas.width=Math.min(sw*2,4096);canvas.height=Math.min(sh*2,2048);
    const ctx=canvas.getContext('2d');
    if(ctx){ctx.imageSmoothingEnabled=false;ctx.drawImage(source,sx,sy,sw,sh,0,0,canvas.width,canvas.height);}
    return canvas;
  }
  async function scanImageWithHtml5Qrcode(canvas){
    if(!window.Html5Qrcode)await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
    if(!window.Html5Qrcode)throw new Error('바코드 이미지 판독 기능을 사용할 수 없습니다.');
    const host=$('#scanner-fallback-reader');
    if(!host)throw new Error('바코드 판독용 화면을 찾을 수 없습니다.');
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('촬영 이미지 변환에 실패했습니다.')),'image/png'));
    const file=new File([blob],'barcode-capture.png',{type:'image/png'});
    const reader=new window.Html5Qrcode('scanner-fallback-reader',{verbose:false});
    scannerInstance=reader;
    try{
      const decoded=await reader.scanFile(file,false);
      return uniqueBarcodeValues([decoded]);
    }finally{
      try{reader.clear();}catch{}
      if(scannerInstance===reader)scannerInstance=null;
      host.replaceChildren();
    }
  }
  async function decodeCapturedBarcode(canvas){
    const nativeValues=await detectWithNativeBarcodeDetector(canvas);
    if(nativeValues.length)return nativeValues;
    // The fallback decodes the actual still image (not a constantly moving video frame).
    const fullFrameValues=await scanImageWithHtml5Qrcode(canvas).catch(()=>[]);
    if(fullFrameValues.length)return fullFrameValues;
    const focused=upscaleFocusRegion(canvas);
    const focusedNativeValues=await detectWithNativeBarcodeDetector(focused);
    if(focusedNativeValues.length)return focusedNativeValues;
    return await scanImageWithHtml5Qrcode(focused).catch(()=>[]);
  }
  async function captureAndDecodeBarcode(){
    if(scanBusy)return;
    const video=$('#scannerVideo');

    scanBusy=true;
    const shutter=$('#captureBarcode');
    if(shutter)shutter.disabled=true;
    try{
      const canvas=document.createElement('canvas');
      // Use the camera's original frame resolution to avoid losing barcode bars or digits.
      canvas.width=video.videoWidth;canvas.height=video.videoHeight;
      const ctx=canvas.getContext('2d',{willReadFrequently:true});
      if(!ctx)throw new Error('촬영 이미지를 준비할 수 없습니다.');
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      scanCaptureCanvas=canvas;

      $('#retakeBarcode')?.classList.remove('hide');
      setScanMessage('촬영 완료 · 고해상도 이미지에서 바코드를 판독하고 있습니다...');
      // Release camera after the still is saved; this also prevents the live feed shifting during decode.
      if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null;}
      const values=await decodeCapturedBarcode(canvas);
      if(values.length===1){await finishScan(values[0]);return;}
      if(values.length>1){showBarcodeCandidates(values);setScanMessage('한 장의 사진에서 바코드가 여러 개 발견됐습니다. 입력할 번호를 선택하세요.');setScanStatus('잘못된 바코드가 자동 입력되지 않도록 번호를 직접 선택해 주세요.','error');return;}
      setScanMessage('바코드를 읽지 못했습니다. 초점을 맞추고 바코드 전체가 보이게 다시 촬영해 주세요.');

    }catch(err){
      setScanMessage(err?.message||'바코드 촬영 중 오류가 발생했습니다.');
      setScanStatus('번호를 입력하지 않았습니다. 다시 촬영하거나 직접 입력해 주세요.','error');

  }

  async function finishScan(value){

  }

    try{
      const data=await authRequest('token?grant_type=password',{email,password});
      cloudSession={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+(Number(data.expires_in)||3600)*1000,user:{id:data.user.id,email:data.user.email}};
      localStorage.setItem(SESSION_KEY,JSON.stringify(cloudSession));
      await syncFromCloudMerge();
      startCloudPolling();
      updateSyncLabels();renderMain();
      toast('공용 데이터 연결 및 초기 동기화가 완료되었습니다.','success');
    }catch(e){if(status)status.textContent='연결 실패: '+e.message;toast('공용 클라우드 로그인 실패: '+e.message,'error');}
  }
  function saveConfigQuiet(){cloudConfig={url:($('#cloudUrl')?.value||'').trim().replace(/\/$/,''),key:($('#cloudKey')?.value||'').trim()};localStorage.setItem(CONFIG_KEY,JSON.stringify(cloudConfig));}
  async function validAccessToken(){if(!cloudSession?.access_token)throw new Error('먼저 공용 클라우드 계정으로 로그인하세요.');if(cloudSession.expires_at>Date.now()+60000)return cloudSession.access_token;const refreshed=await authRequest('token?grant_type=refresh_token',{refresh_token:cloudSession.refresh_token});cloudSession={...cloudSession,access_token:refreshed.access_token,refresh_token:refreshed.refresh_token||cloudSession.refresh_token,expires_at:Date.now()+(Number(refreshed.expires_in)||3600)*1000,user:refreshed.user||cloudSession.user};localStorage.setItem(SESSION_KEY,JSON.stringify(cloudSession));return cloudSession.access_token;}
  async function cloudRequest(path,options={}){const token=await validAccessToken();const headers={'apikey':cloudConfig.key,'Authorization':'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})};const res=await fetch(normalizedUrl()+'/rest/v1/'+path,{method:options.method||'GET',headers,body:options.body===undefined?undefined:JSON.stringify(options.body)});if(!res.ok){const text=await res.text();throw new Error(text.slice(0,350)||`클라우드 요청 오류 (${res.status})`);}if(res.status===204)return null;const txt=await res.text();return txt?JSON.parse(txt):null;}
  function mergeInventoryAndEvents(remoteInv,remoteEvents){
    const beforeInv=JSON.stringify(state.inventory),beforeEvents=JSON.stringify(state.events);
    const imap=new Map();
    [...state.inventory,...(remoteInv||[]).map(r=>r.data)].forEach(item=>{
      if(!item?.barcode)return;
      const code=cleanBarcodeValue(item.barcode),prev=imap.get(code);
      if(!prev||(item.updatedAt||'')>(prev.updatedAt||''))imap.set(code,item);
    });
    const emap=new Map();
    [...state.events,...(remoteEvents||[]).map(r=>r.data)].forEach(ev=>{if(ev?.id)emap.set(ev.id,ev)});
    state.inventory=[...imap.values()];
    state.events=[...emap.values()].sort((a,b)=>(a.timestamp||'').localeCompare(b.timestamp||''));
    const deleted=pruneDeletedInventoryByEvents();
    return {changed:beforeInv!==JSON.stringify(state.inventory)||beforeEvents!==JSON.stringify(state.events),deleted};
  }
  async function fetchSharedCloudData(){
    const uid=cloudSession?.user?.id;if(!uid)throw new Error('로그인 사용자 정보를 확인할 수 없습니다.');
    const [remoteInv,remoteEvents,remoteCatalog,remoteStaff,remoteCSMinimums]=await Promise.all([
      cloudRequest(`inventory?select=barcode,data&user_id=eq.${encodeURIComponent(uid)}`),
      cloudRequest(`events?select=id,data&user_id=eq.${encodeURIComponent(uid)}`),
      cloudRequest(`shared_catalog?select=catalog_key,data,updated_at&user_id=eq.${encodeURIComponent(uid)}&catalog_key=eq.main`),
      cloudRequest(`shared_catalog?select=catalog_key,data,updated_at&user_id=eq.${encodeURIComponent(uid)}&catalog_key=eq.staff`),
      cloudRequest(`shared_catalog?select=catalog_key,data,updated_at&user_id=eq.${encodeURIComponent(uid)}&catalog_key=eq.cs_minimums`)
    ]);
    return {remoteInv:remoteInv||[],remoteEvents:remoteEvents||[],remoteCatalog:remoteCatalog?.[0]||null,remoteStaff:remoteStaff?.[0]||null,remoteCSMinimums:remoteCSMinimums?.[0]||null};
  }
  async function syncFromCloudMerge(){
    const {remoteInv,remoteEvents,remoteCatalog,remoteStaff,remoteCSMinimums}=await fetchSharedCloudData();
    const merged=mergeInventoryAndEvents(remoteInv,remoteEvents);
    if(remoteCatalog?.data){
      productCatalog=normalizeProductCatalog(remoteCatalog.data);
      localStorage.setItem(PRODUCT_CATALOG_KEY,JSON.stringify(productCatalog));
    }
    if(remoteStaff?.data){
      const remoteTime=Date.parse(remoteStaff.updated_at||remoteStaff.data.updatedAt||0)||0;
      const localTime=Date.parse(staffCatalog.updatedAt||0)||0;
      if(localTime>remoteTime)await syncStaffCatalogToCloud();
      else{staffCatalog=normalizeStaffCatalog({...remoteStaff.data,updatedAt:remoteStaff.updated_at||remoteStaff.data.updatedAt||''});saveStaffCatalogLocal();}
    }else if(!staffCatalog.updatedAt){
      const migrated=collectLegacyStaffCatalog();
      staffCatalog={...migrated,updatedAt:''};saveStaffCatalogLocal();
    }
    if(remoteCSMinimums?.data){
      const remote=normalizeCSMinimumCatalog(remoteCSMinimums.data);
      const remoteTime=Date.parse(remoteCSMinimums.updated_at||remote.updatedAt||0)||0;
      const localTime=Date.parse(csMinimumCatalog.updatedAt||0)||0;
      if(localTime>remoteTime)await syncCSMinimumCatalogToCloud();
      else{csMinimumCatalog=normalizeCSMinimumCatalog({...remote,updatedAt:remoteCSMinimums.updated_at||remote.updatedAt||''});saveCSMinimumCatalogLocal();}
    }else if(csMinimumCatalog.items.length){await syncCSMinimumCatalogToCloud();}
    saveStore();
    for(const code of merged.deleted)await deleteCloudInventoryBarcode(code);
    await syncAll();
  }
  async function syncProductCatalogToCloud(){
    if(!cloudSession?.access_token)return;
    const uid=cloudSession.user.id;
    catalogCloudWritePending=true;
    try{
      await cloudRequest('shared_catalog?on_conflict=user_id%2Ccatalog_key',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,catalog_key:'main',data:normalizeProductCatalog(productCatalog),updated_at:new Date().toISOString()}});
    }finally{catalogCloudWritePending=false;}
  }
  async function syncStaffCatalogToCloud(){
    if(!cloudSession?.access_token)return;
    const uid=cloudSession.user.id;
    staffCatalogCloudWritePending=true;
    try{
      if(!staffCatalog.updatedAt){staffCatalog.updatedAt=new Date().toISOString();saveStaffCatalogLocal();}
      await cloudRequest('shared_catalog?on_conflict=user_id%2Ccatalog_key',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,catalog_key:'staff',data:{inputters:staffCatalog.inputters,outboundOperators:staffCatalog.outboundOperators,updatedAt:staffCatalog.updatedAt},updated_at:staffCatalog.updatedAt}});
    }finally{staffCatalogCloudWritePending=false;}
  }
  async function syncCSMinimumCatalogToCloud(){
    if(!cloudSession?.access_token)return;
    const uid=cloudSession.user.id;
    if(!csMinimumCatalog.updatedAt){csMinimumCatalog.updatedAt=new Date().toISOString();saveCSMinimumCatalogLocal();}
    csMinimumCatalogCloudWritePending=true;
    try{await cloudRequest('shared_catalog?on_conflict=user_id%2Ccatalog_key',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,catalog_key:'cs_minimums',data:csMinimumCatalog,updated_at:csMinimumCatalog.updatedAt}});}
    finally{csMinimumCatalogCloudWritePending=false;}
  }
  async function pullCloudUpdates(silent=true){
    if(!cloudSession?.access_token||cloudPollBusy||document.hidden)return;
    cloudPollBusy=true;
    try{
      const {remoteInv,remoteEvents,remoteCatalog,remoteStaff,remoteCSMinimums}=await fetchSharedCloudData();
      const merged=mergeInventoryAndEvents(remoteInv,remoteEvents);
      let catalogChanged=false,staffChanged=false,csMinimumsChanged=false;
      if(remoteCatalog?.data&&!catalogCloudWritePending){
        const remote=normalizeProductCatalog(remoteCatalog.data);
        catalogChanged=JSON.stringify(remote)!==JSON.stringify(productCatalog);
        if(catalogChanged){productCatalog=remote;localStorage.setItem(PRODUCT_CATALOG_KEY,JSON.stringify(productCatalog));}
      }
      if(remoteStaff?.data&&!staffCatalogCloudWritePending){
        const remoteTime=Date.parse(remoteStaff.updated_at||remoteStaff.data.updatedAt||0)||0;
        const localTime=Date.parse(staffCatalog.updatedAt||0)||0;
        if(!localTime||remoteTime>localTime){staffCatalog=normalizeStaffCatalog({...remoteStaff.data,updatedAt:remoteStaff.updated_at||remoteStaff.data.updatedAt||''});saveStaffCatalogLocal();staffChanged=true;}
      }
      if(remoteCSMinimums?.data&&!csMinimumCatalogCloudWritePending){
        const remote=normalizeCSMinimumCatalog(remoteCSMinimums.data);
        const remoteTime=Date.parse(remoteCSMinimums.updated_at||remote.updatedAt||0)||0;
        const localTime=Date.parse(csMinimumCatalog.updatedAt||0)||0;
        if(!localTime||remoteTime>localTime){csMinimumCatalog=normalizeCSMinimumCatalog({...remote,updatedAt:remoteCSMinimums.updated_at||remote.updatedAt||''});saveCSMinimumCatalogLocal();csMinimumsChanged=true;}
      }
      if(merged.changed||catalogChanged||staffChanged||csMinimumsChanged){saveStore();if(!silent)toast('다른 기기의 변경사항을 가져왔습니다.','success');if(!$('#modalRoot .modal'))renderMain();else if(!silent)toast('현재 입력 중인 창은 유지했습니다. 닫으면 최신 내용이 반영됩니다.','');}
      const status=$('#cloudStatusText');if(status)status.textContent=`공용 데이터 동기화 중 · ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 확인 · 약 20초마다 자동 확인`;
      updateSyncLabels();
    }catch(e){
      const status=$('#cloudStatusText');if(status)status.textContent='공용 데이터 확인 실패: '+e.message;
      if(!silent)toast('동기화 실패: '+e.message,'error');
    }finally{cloudPollBusy=false;}
  }
  function startCloudPolling(){
    if(cloudPollTimer)clearInterval(cloudPollTimer);
    if(!cloudSession?.access_token)return;
    cloudPollTimer=setInterval(()=>pullCloudUpdates(true),CLOUD_POLL_INTERVAL_MS);
  }
  async function syncNow(){
    if(!cloudSession?.access_token){toast('먼저 공용 클라우드 계정으로 로그인하세요.','error');return;}
    try{await syncFromCloudMerge();await pullCloudUpdates(false);toast('지금 동기화를 완료했습니다.','success');}
    catch(e){toast('동기화 실패: '+e.message,'error');}
  }
  async function copyAppLink(){
    const url=location.href.split('#')[0];
    try{await navigator.clipboard.writeText(url);toast('웹앱 주소를 복사했습니다. 직원에게 카카오톡 등으로 보내세요.','success');}
    catch{window.prompt('아래 웹앱 주소를 복사해 직원에게 보내세요.',url);}
  }
  async function syncOne(item,event){if(!cloudSession?.access_token)return;try{const uid=cloudSession.user.id;await cloudRequest('inventory?on_conflict=user_id%2Cbarcode',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,barcode:item.barcode,data:item,updated_at:item.updatedAt||new Date().toISOString()}});await cloudRequest('events?on_conflict=user_id%2Cid',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,id:event.id,data:event,created_at:event.timestamp||new Date().toISOString()}});updateSyncLabels();}catch(e){const s=$('#cloudStatusText');if(s)s.textContent='로컬 저장은 완료했지만 클라우드 동기화에 실패했습니다: '+e.message;toast('로컬 저장 완료 · 클라우드 동기화 실패: '+e.message,'error');}}
  async function syncAll(){if(!cloudSession?.access_token)return;try{const uid=cloudSession.user.id;const latest=latestItemActionByBarcode();const deletedCodes=[...latest.entries()].filter(([,v])=>v.deleted).map(([code])=>code);if(pruneDeletedInventoryByEvents().length)saveStore();for(const code of deletedCodes)await deleteCloudInventoryBarcode(code);for(let i=0;i<state.inventory.length;i+=100){const batch=state.inventory.slice(i,i+100).map(item=>({user_id:uid,barcode:item.barcode,data:item,updated_at:item.updatedAt||new Date().toISOString()}));if(batch.length)await cloudRequest('inventory?on_conflict=user_id%2Cbarcode',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:batch});}for(let i=0;i<state.events.length;i+=100){const batch=state.events.slice(i,i+100).map(ev=>({user_id:uid,id:ev.id,data:ev,created_at:ev.timestamp||new Date().toISOString()}));if(batch.length)await cloudRequest('events?on_conflict=user_id%2Cid',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:batch});}await syncProductCatalogToCloud();await syncStaffCatalogToCloud();await syncCSMinimumCatalogToCloud();const s=$('#cloudStatusText');if(s)s.textContent=`공용 데이터 동기화 완료 · 품목 ${state.inventory.length}개, 이력 ${state.events.length}건`;updateSyncLabels();}catch(e){const s=$('#cloudStatusText');if(s)s.textContent='동기화 실패: '+e.message;toast('클라우드 동기화 오류: '+e.message,'error');}}
  async function deleteCloudInventoryBarcode(barcode){const uid=cloudSession?.user?.id;if(!uid)return;await cloudRequest(`inventory?user_id=eq.${encodeURIComponent(uid)}&barcode=eq.${encodeURIComponent(String(barcode))}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});}
  async function deleteCloudAll(){const uid=cloudSession.user.id;await cloudRequest(`inventory?user_id=eq.${encodeURIComponent(uid)}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});await cloudRequest(`events?user_id=eq.${encodeURIComponent(uid)}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});}
  function cloudLogout(){if(cloudPollTimer){clearInterval(cloudPollTimer);cloudPollTimer=null;}cloudSession=null;localStorage.removeItem(SESSION_KEY);updateSyncLabels();renderMain();toast('공용 클라우드에서 로그아웃했습니다. 로컬 데이터는 유지됩니다.','success');}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b&&b.closest('#sideNav,#mobileNav'))setView(b.dataset.view);});
  // The import input exists only after the Settings view is rendered. Use delegated handling
  // so the initial Dashboard render is never interrupted by a null-element exception.
  document.addEventListener('change',e=>{
    if(e.target && e.target.id==='importFile'){
      const file=e.target.files?.[0];
      if(file)importJSONFile(file);
      e.target.value='';
    }
  });
  renderMain();
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  if(cloudConfig.url&&cloudConfig.key&&cloudSession?.access_token){syncFromCloudMerge().then(()=>{startCloudPolling();updateSyncLabels();if(currentView==='settings')renderMain();}).catch(e=>{console.warn('Cloud resume:',e);toast('공용 클라우드 재연결 필요: 설정에서 다시 로그인해 주세요.','error');});}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloudSession?.access_token)pullCloudUpdates(true);});
  window.addEventListener('focus',()=>{if(cloudSession?.access_token)pullCloudUpdates(true);});
})();
</script>
