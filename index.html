    /* v1.0.39: keep the left navigation and current page title visible while the
       main document scrolls.  The sidebar and topbar track the viewport; the
       report/workspace content remains the page's normal scrolling content. */
    html, body {
      width: 100% !important;
      height: auto !important;
      min-height: 100% !important;
      margin: 0 !important;
      overflow-x: clip !important;
      overflow-y: visible !important;
    }
    body {
      min-height: 100vh !important;
      min-height: 100dvh !important;
    }
    .shell {
      display: grid !important;
      grid-template-columns: 240px minmax(0, 1fr) !important;
      grid-template-rows: auto !important;
      align-items: start !important;
      align-content: start !important;
      width: 100% !important;
      height: auto !important;
      min-height: 100vh !important;
      min-height: 100dvh !important;
      max-height: none !important;
      overflow: visible !important;
      position: relative !important;
    }
    .sidebar {
      position: sticky !important;
      top: 0 !important;
      align-self: start !important;
      height: 100vh !important;
      height: 100dvh !important;
      min-height: 100vh !important;
      min-height: 100dvh !important;
      max-height: 100vh !important;
      max-height: 100dvh !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      z-index: 30 !important;
    }
    .side-bottom { margin-top: auto !important; flex-shrink: 0 !important; }
    .main {
      position: relative !important;
      min-width: 0 !important;
      width: auto !important;
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;
      overflow: visible !important;
    }
    .topbar {
      position: sticky !important;
      top: 0 !important;
      z-index: 25 !important;
      height: 78px !important;
      background: rgba(255,255,255,.94) !important;
      backdrop-filter: blur(12px) !important;
      box-shadow: 0 5px 18px rgba(20,42,63,.06) !important;
    }
    .content, #appContent {
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;
      overflow: visible !important;
    }
    @media (max-width: 850px) {
      .shell {
        display: block !important;
        width: 100% !important;
        height: auto !important;
        min-height: 100vh !important;
        min-height: 100dvh !important;
        overflow: visible !important;
      }
      .sidebar { display: none !important; }

        display: block !important;
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      .topbar { position: sticky !important; top: 0 !important; z-index: 25 !important; }
      .mobile-nav { position: fixed !important; }
    }

  function isASReceiptDeletedForDispatch(barcode){
    const code=cleanBarcodeValue(barcode||'');
    if(!code)return false;
    const events=Array.isArray(state.events)?state.events:[];
    const deletionMarkers=events.filter(event=>{
      const eventBarcode=cleanBarcodeValue(event.barcode||event.data?.barcode||'');
      if(eventBarcode!==code)return false;
      const data=event.data||{};
      return (event.stage==='이력 삭제'&&data.originalStage==='AS접수')
        ||(event.stage==='등록 오류 삭제'&&(data.correctionOriginalStage==='AS접수'||event.originalStageBeforeCorrectionDelete==='AS접수'))
        ||(event.stage==='품목 삭제'&&(data.stage==='AS접수'||data.originalStage==='AS접수'));
    });
    if(!deletionMarkers.length)return false;
    const latestDeleteAt=Math.max(...deletionMarkers.map(event=>Date.parse(event.timestamp||event.data?.deletedAt||0)||0));
    const newerActiveReceipt=events.some(event=>{
      if(event.stage!=='AS접수'||event.correctionDeletedAt||event.deletedAt)return false;
      const eventBarcode=cleanBarcodeValue(event.barcode||event.data?.barcode||'');
      if(eventBarcode!==code)return false;

      return eventAt>latestDeleteAt;

  function bytesToBase64(bytes){let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));return btoa(binary);}
  function base64ToBytes(value){const binary=atob(value);return Uint8Array.from(binary,ch=>ch.charCodeAt(0));}

  async function deriveSecurityHash(password,saltBase64,iterations=150000){
    if(!window.crypto?.subtle)throw new Error('비밀번호 보호 기능은 HTTPS로 접속한 브라우저에서 사용할 수 있습니다.');

    const bits=await window.crypto.subtle.deriveBits({name:'PBKDF2',salt:base64ToBytes(saltBase64),iterations,hash:'SHA-256'},material,256);

  async function saveSecurityPassword(){
    const hadPassword=hasSecurityPassword();
    const current=$('#securityCurrentPassword')?.value||'';
    const next=$('#securityNewPassword')?.value||'';
    const confirmNext=$('#securityConfirmPassword')?.value||'';
    if(hasSecurityPassword()){
      if(!current){toast('현재 비밀번호를 입력하세요.','error');return;}
      if(!await verifySecurityPassword(current)){toast('현재 비밀번호가 올바르지 않습니다.','error');return;}
    }
    if(next.length<4){toast('새 비밀번호는 4자 이상 입력하세요.','error');return;}
    if(next!==confirmNext){toast('새 비밀번호 확인이 일치하지 않습니다.','error');return;}
    try{
      const salt=bytesToBase64(window.crypto.getRandomValues(new Uint8Array(16)));
      const iterations=150000;
      const hash=await deriveSecurityHash(next,salt,iterations);
      securityConfig={salt,hash,iterations,updatedAt:new Date().toISOString(),version:1};
      localStorage.setItem(SECURITY_KEY,JSON.stringify(securityConfig));
      settingsUnlocked=true;
      renderMain();
      toast(hadPassword?'관리 비밀번호를 변경했습니다.':'관리 비밀번호를 등록했습니다.','success');

  }

    const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(request);form.appendChild(input);
    document.body.appendChild(frame);document.body.appendChild(form);

      .sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||''));

    return `<div class="section-head"><div><div class="eyebrow">CORRECTION / REGISTER</div><h2 class="section-title" style="margin-top:7px">등록 오류 수정</h2><div class="section-sub">업무등록과 출고등록에서 잘못 입력한 내용을 찾아 건별로 수정하거나 삭제합니다. 삭제에는 관리 비밀번호가 필요하며 처리 이력은 별도로 보존됩니다.</div></div><div class="btn-row no-print"><button class="btn" data-view="workflow">업무 등록으로 이동</button><button class="btn primary" data-view="outbound">출고등록으로 이동</button></div></div>
      <section class="panel panel-pad"><div class="panel-head"><div><h3 class="panel-title">등록 기록 목록</h3><div class="panel-desc">총 ${events.length.toLocaleString('ko-KR')}건 · 최신 등록 순</div></div><span class="pill blue">건별 수정·삭제 가능</span></div>
        <div class="toolbar no-print"><div class="searchbox"><span class="search-icon">⌕</span><input id="correctionSearch" placeholder="제품명·모델명·바코드·사업자번호 검색"></div><select class="filter-select" id="correctionStageFilter"><option value="">전체 업무</option>${stages.map(stage=>`<option value="${esc(stage)}">${esc(stage)}</option>`).join('')}</select></div>
        <div class="table-wrap" id="correctionTableWrap"><table><thead><tr><th>등록 일시</th><th>업무 구분</th><th>제품 / 모델</th><th>바코드</th><th>입력자 / 등록 내용</th><th>관리</th></tr></thead><tbody>${events.length?events.map(row).join(''):`<tr><td colspan="6"><div class="empty"><div class="empty-icon">✎</div>수정할 등록 이력이 없습니다.</div></td></tr>`}</tbody></table></div>
        <div class="small-note" style="margin-top:12px">수정하면 현재 재고 상태와 연결된 최신 등록 건일 경우 재고 정보도 함께 갱신됩니다. 삭제 시 관리 비밀번호를 확인하며, 현재 재고의 최신 등록 건이면 이전 유효 단계로 복원하거나 최초 등록 건인 경우 현재 재고에서도 제거합니다. 이미 다음 단계로 이동한 과거 기록은 현재 재고에 영향을 주지 않습니다. 삭제 처리 이력은 별도로 남깁니다.</div>

  async function deleteWorkflowCorrectionEvent(eventId,passwordVerified=false){
    const event=state.events.find(item=>item.id===eventId);
    if(!event||!getCorrectionEvents().some(item=>item.id===eventId)){
      toast('삭제할 등록 기록을 찾을 수 없습니다. 목록을 새로고침해 주세요.','error');return;
    }
    if(!passwordVerified){
      if(!hasSecurityPassword()){
        toast('등록 기록을 삭제하려면 먼저 설정에서 관리 비밀번호를 등록해 주세요.','error');
        setView('settings');
        return;
      }
      const d=event.data||{};
      const label=[d.productName,d.modelName].filter(Boolean).join(' / ')||event.stage;
      showSecurityPrompt('등록 오류 삭제 비밀번호 확인',`${label} · ${event.stage} 기록을 삭제하려면 관리 비밀번호를 입력하세요.`,()=>deleteWorkflowCorrectionEvent(eventId,true));
      return;
    }

    const stage=event.stage;
    const originalData={...(event.data||{})};
    const barcode=cleanBarcodeValue(event.barcode||originalData.barcode||'');
    const label=[originalData.productName,originalData.modelName].filter(Boolean).join(' / ')||'선택한 등록 기록';
    const codeLabel=barcode?`\n바코드: ${barcode}`:'';
    const confirmed=confirm(`${label}\n업무 구분: ${stage}${codeLabel}\n\n이 등록 기록을 삭제할까요?\n\n• 삭제에는 관리 비밀번호가 확인되었습니다.\n• 삭제한 기록은 등록 오류 수정 목록에서 사라집니다.\n• 현재 재고에 연결된 최신 등록이면 이전 단계로 복원합니다.\n• 과거 이력과 삭제 처리 기록은 감사용으로 보존됩니다.`);
    if(!confirmed)return;

    const now=new Date().toISOString();
    const currentItem=barcode?state.inventory.find(item=>cleanBarcodeValue(item.barcode)===barcode):null;
    const childEvent=(stage==='AS회수'||stage==='재입고')
      ? state.events.find(other=>other.id!==event.id&&cleanBarcodeValue(other.barcode)===barcode&&String(other.action||'').startsWith(`${stage} 후 `)&&Math.abs((Date.parse(other.timestamp||0)||0)-(Date.parse(event.timestamp||0)||0))<=5000)
      : null;
    const referenceTime=Date.parse(originalData.correctionUpdatedAt||event.timestamp||0)||0;
    const currentItemTime=Date.parse(currentItem?.updatedAt||currentItem?.createdAt||0)||0;
    const expectedStage=(stage==='AS회수'?originalData.returnTarget||originalData.stage:stage==='재입고'?originalData.reintakeTarget||originalData.stage:stage);
    const isCurrentRecord=!!currentItem&&currentItem.stage===expectedStage&&(!currentItemTime||!referenceTime||Math.abs(currentItemTime-referenceTime)<=5000);

    // Keep the original payload for audit, but change its stage so it no longer
    // appears as an active registration or contributes to stage-based reports.
    const markDeleted=(target,kind)=>{
      if(!target)return;
      const oldStage=target.stage;
      const oldData={...(target.data||{})};
      target.originalStageBeforeCorrectionDelete=oldStage;
      target.correctionDeletedAt=now;
      target.stage='등록 오류 삭제';
      target.action=kind==='linked'?'연결된 자동 기록 삭제':'등록 오류 삭제';
      target.data={...oldData,correctionDeletedAt:now,correctionOriginalStage:oldStage,correctionDeleteType:kind};
    };
    markDeleted(event,'selected');
    if(childEvent)markDeleted(childEvent,'linked');

    let restoredItem=null,previousEvent=null,removedCurrentItem=false,tombstoneEvent=null;
    if(isCurrentRecord&&barcode){
      const cancelledIds=getCancelledOutboundEventIds();
      const eligibleStages=new Set([...STAGES.map(item=>item.id),REINTAKE_STAGE.id,OUTBOUND_STAGE.id]);
      const eventTime=Date.parse(event.timestamp||0)||0;
      previousEvent=state.events
        .filter(other=>other.id!==event.id&&other.id!==childEvent?.id)
        .filter(other=>cleanBarcodeValue(other.barcode||other.data?.barcode||'')===barcode)
        .filter(other=>eligibleStages.has(other.stage)&&!other.correctionDeletedAt&&other.action!=='품목 삭제')
        .filter(other=>!(other.stage==='출고등록'&&cancelledIds.has(other.id)))
        .filter(other=>(Date.parse(other.timestamp||0)||0)<eventTime)
        .sort((a,b)=>(Date.parse(b.timestamp||0)||0)-(Date.parse(a.timestamp||0)||0))[0]||null;

      if(previousEvent){
        const previousData={...(previousEvent.data||{})};
        const restoredStage=previousData.stage||previousData.returnTarget||previousData.reintakeTarget||previousEvent.stage;
        restoredItem={...previousData,barcode:String(currentItem.barcode||event.barcode),stage:restoredStage,createdAt:previousData.createdAt||currentItem.createdAt||now,updatedAt:now};
        state.inventory=state.inventory.map(item=>cleanBarcodeValue(item.barcode)===barcode?restoredItem:item);
      }else{
        state.inventory=state.inventory.filter(item=>cleanBarcodeValue(item.barcode)!==barcode);
        removedCurrentItem=true;
        tombstoneEvent={
          id:idgen(),barcode:String(currentItem.barcode||event.barcode),stage:'품목 삭제',timestamp:new Date(Date.parse(now)+1).toISOString(),
          operatorName:event.operatorName||originalData.operatorName||'',action:'품목 삭제',
          data:{...currentItem,deletedAt:now,deletionReason:'등록 오류 수정에서 최초 등록 기록 삭제',originEventId:event.id}
        };
        state.events.push(tombstoneEvent);
      }
    }

    const auditEvent={
      id:idgen(),barcode:event.barcode||barcode,stage:'등록 오류 삭제',timestamp:now,
      operatorName:event.operatorName||originalData.operatorName||originalData.outboundOperator||'',
      action:'등록 오류 삭제',
      data:{targetEventId:event.id,originalStage:stage,productName:originalData.productName||'',modelName:originalData.modelName||'',barcode:event.barcode||barcode,deletedAt:now,linkedEventId:childEvent?.id||'',inventoryAction:isCurrentRecord?(restoredItem?`이전 단계 ${restoredItem.stage}로 복원`:'현재 재고에서 제거'):'현재 재고 유지'}
    };
    state.events.push(auditEvent);
    saveStore();

    // Update the same event IDs in the shared cloud so other devices also stop
    // treating the registration as active. Never hard-delete the audit trail.
    if(cloudSession?.access_token){
      await syncEventOnly(event);
      if(childEvent)await syncEventOnly(childEvent);
      await syncEventOnly(auditEvent);
      if(restoredItem&&previousEvent)await syncOne(restoredItem,previousEvent);
      else if(removedCurrentItem)await deleteCloudInventoryBarcode(barcode);
      if(tombstoneEvent)await syncEventOnly(tombstoneEvent);
    }
    sendNewEventToGoogleSheet(auditEvent);
    if(tombstoneEvent)sendNewEventToGoogleSheet(tombstoneEvent);
    renderMain();
    const resultMessage=isCurrentRecord?(restoredItem?`등록 기록을 삭제하고 현재 재고를 이전 단계(${restoredItem.stage})로 복원했습니다.`:'등록 기록과 해당 현재 재고를 삭제했습니다. 삭제 이력은 보존했습니다.'):'등록 기록을 삭제했습니다. 이후 단계의 현재 재고는 유지했습니다.';
    toast(resultMessage,'success');
  }

  function filterCorrectionRows(){
    const q=($('#correctionSearch')?.value||'').toLowerCase().trim();
    const stage=$('#correctionStageFilter')?.value||'';
    $$('#correctionTableWrap tbody tr[data-correction-row]').forEach(row=>{
      row.classList.toggle('hide',!!(q&&!row.dataset.search.includes(q))||!!(stage&&row.dataset.stage!==stage));
    });
  }
  function correctionFieldValue(event,field){
    const d=event.data||{};
    if(field.key==='barcode')return event.barcode||d.barcode||'';
    if(field.key==='operatorName')return d.operatorName||event.operatorName||'';
    if(field.key==='outboundOperator')return d.outboundOperator||event.operatorName||'';
    if(field.key==='branch')return d.branch||d.businessRegistrationNumber||'';
    if(field.key==='returnedBranch')return d.returnedBranch||d.returnedBusinessRegistrationNumber||'';
    if(field.key==='outboundTo')return d.outboundTo||d.outboundBusinessRegistrationNumber||'';
    const value=d[field.key];
    if(field.type==='date')return String(value||'').slice(0,10);
    return value??'';
  }
  function openInitialDefectCorrectionModal(event){
    const d=event.data||{};
    const productName=String(d.productName||'');
    const modelName=String(d.modelName||'');
    if(productName)ensureProductModelCatalog(productName,modelName);
    const receivedDate=String(d.receivedDate||event.timestamp||today()).slice(0,10);
    const operatorName=String(d.operatorName||event.operatorName||'');
    const barcode=cleanBarcodeValue(event.barcode||d.barcode||'');
    const symptom=String(d.defectSymptom||'');

  function addCatalogProduct(name){
    const clean=normalizeCatalogName(name);if(!clean){toast('제품명을 입력해 주세요.','error');return false;}
    if(productCatalog.some(p=>p.name.toLocaleLowerCase()===clean.toLocaleLowerCase())){toast('이미 등록된 제품명입니다.','error');return false;}
    productCatalog.push({name:clean,models:[]});saveProductCatalog();toast(`제품명 '${clean}'을(를) 추가했습니다.`,'success');return true;
  }
  function attachProductCatalogSettingsEvents(){
    const productForm=$('#catalogProductForm');
    productForm?.addEventListener('submit',e=>{e.preventDefault();const input=$('#catalogNewProductName');if(addCatalogProduct(input.value))renderMain();});
    $$('.catalogModelForm').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const pi=Number(form.dataset.productIndex),input=form.elements.modelName,p=productCatalog[pi],name=normalizeCatalogName(input.value);if(!p||!name)return;if(p.models.some(m=>m.toLocaleLowerCase()===name.toLocaleLowerCase())){toast('이미 등록된 모델명입니다.','error');return;}p.models.push(name);saveProductCatalog();toast(`${p.name} 모델명을 추가했습니다.`,'success');renderMain();}));
    $$('[data-catalog-action]').forEach(button=>button.addEventListener('click',()=>{
      const action=button.dataset.catalogAction,pi=Number(button.dataset.productIndex),mi=Number(button.dataset.modelIndex),p=productCatalog[pi];if(!p)return;
      if(action==='move-product-up'||action==='move-product-down'){
        const nextIndex=pi+(action==='move-product-up'?-1:1);if(nextIndex<0||nextIndex>=productCatalog.length)return;
        [productCatalog[pi],productCatalog[nextIndex]]=[productCatalog[nextIndex],productCatalog[pi]];
        saveProductCatalog();renderMain();toast('제품명 표시 순서를 변경했습니다.','success');
      }else if(action==='move-model-up'||action==='move-model-down'){
        if(!Number.isInteger(mi)||mi<0||mi>=p.models.length)return;
        const nextIndex=mi+(action==='move-model-up'?-1:1);if(nextIndex<0||nextIndex>=p.models.length)return;
        [p.models[mi],p.models[nextIndex]]=[p.models[nextIndex],p.models[mi]];
        saveProductCatalog();renderMain();toast(`${p.name} 모델명 표시 순서를 변경했습니다.`,'success');
      }else if(action==='rename-product'){
        const next=normalizeCatalogName(prompt('변경할 제품명을 입력하세요.',p.name)||'');if(!next||next===p.name)return;
        if(productCatalog.some((x,i)=>i!==pi&&x.name.toLocaleLowerCase()===next.toLocaleLowerCase())){toast('이미 등록된 제품명입니다.','error');return;}
        p.name=next;saveProductCatalog();renderMain();toast('제품명을 수정했습니다.','success');
      }else if(action==='delete-product'){
        if(!confirm(`제품명 '${p.name}' 목록을 삭제할까요?\n기존 재고와 업무 이력은 삭제되지 않습니다.`))return;
        productCatalog.splice(pi,1);saveProductCatalog();renderMain();toast('제품 목록에서 삭제했습니다.','success');
      }else if(action==='edit-model'){
        const old=p.models[mi];if(old===undefined)return;const next=normalizeCatalogName(prompt('변경할 모델명을 입력하세요.',old)||'');if(!next||next===old)return;
        if(p.models.some((m,i)=>i!==mi&&m.toLocaleLowerCase()===next.toLocaleLowerCase())){toast('이미 등록된 모델명입니다.','error');return;}
        p.models[mi]=next;saveProductCatalog();renderMain();toast('모델명을 수정했습니다.','success');
      }else if(action==='delete-model'){
        const old=p.models[mi];if(old===undefined)return;if(!confirm(`모델명 '${old}'을(를) 목록에서 삭제할까요?\n기존 업무 기록은 변경되지 않습니다.`))return;
        p.models.splice(mi,1);saveProductCatalog();renderMain();toast('모델명을 삭제했습니다.','success');
      }
    }));
  }

  function attachCSMinimumSettingsEvents(){
    const product=$('#csMinimumProduct'),model=$('#csMinimumModel'),form=$('#csMinimumForm'),qty=$('#csMinimumQty');
    const refreshModels=(selected='')=>{
      const p=productCatalog.find(x=>x.name===product?.value);
      const models=p?.models||[];
      if(model){model.innerHTML=`<option value="">${p?(models.length?'모델명을 선택하세요':'등록된 모델명이 없습니다'):'먼저 제품명을 선택하세요'}</option>${models.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('')}`;model.disabled=!p||!models.length;model.value=models.includes(selected)?selected:'';}
    };
    product?.addEventListener('change',()=>refreshModels(''));
    form?.addEventListener('submit',e=>{
      e.preventDefault();const productName=normalizeCatalogName(product?.value),modelName=normalizeCatalogName(model?.value),minimum=Number(qty?.value);
      if(!productName||!modelName){toast('제품명과 모델명을 모두 선택해 주세요.','error');return;}
      if(!Number.isInteger(minimum)||minimum<0){toast('최소 수량은 0 이상의 정수로 입력해 주세요.','error');return;}
      const key=csMinimumKey(productName,modelName);
      const existing=csMinimumCatalog.items.findIndex(row=>csMinimumKey(row.productName,row.modelName)===key);
      if(existing>=0){csMinimumCatalog.items[existing].minimum=minimum;}
      else csMinimumCatalog.items.push({productName,modelName,minimum});
      saveCSMinimumCatalog();csMinimumEditKey='';renderMain();toast(`${productName} / ${modelName} 최소수량을 ${minimum}개로 저장했습니다.`,'success');
    });
    $('#csMinimumCancelEdit')?.addEventListener('click',()=>{csMinimumEditKey='';renderMain();});
    $$('[data-cs-min-action]').forEach(button=>button.addEventListener('click',()=>{
      const index=Number(button.dataset.index),row=csMinimumCatalog.items[index];if(!row)return;
      if(button.dataset.csMinAction==='edit'){
        csMinimumEditKey=csMinimumKey(row.productName,row.modelName);
        if(product)product.value=row.productName;refreshModels(row.modelName);if(qty)qty.value=String(row.minimum);
        const saveButton=$('#csMinimumSaveButton');if(saveButton)saveButton.textContent='최소수량 수정 저장';
        $('#csMinimumCancelEdit')?.classList.remove('hide');qty?.focus();
      }else if(button.dataset.csMinAction==='delete'){
        if(!confirm(`${row.productName} / ${row.modelName}의 최소수량 기준을 삭제할까요? CS용 재고와 업무 이력은 삭제되지 않습니다.`))return;
        csMinimumCatalog.items.splice(index,1);saveCSMinimumCatalog();csMinimumEditKey='';renderMain();toast('최소수량 기준을 삭제했습니다.','success');
      }
    }));
  }

  function renderOutboundHistorySettings(){
    const visible=getVisibleOutboundEvents().sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||'')).slice(0,100);
    const hidden=getHiddenOutboundHistoryEvents().slice(0,100);
    const rowHtml=(e,hiddenMode=false)=>{
      const d=e.data||{};
      return `<tr><td>${fmtDate(d.outboundDate||e.timestamp,true)}</td><td><div class="table-primary">${esc(d.productName||'-')}</div><div class="table-secondary">${esc(d.modelName||'-')}</div></td><td>${esc(e.barcode||'-')}</td><td>${esc(d.outboundTo||d.outboundBusinessRegistrationNumber||'-')}</td><td>${esc(d.outboundOperator||e.operatorName||'-')}</td><td>${esc(d.outboundReason||'-')}</td><td><div class="btn-row">${hiddenMode?`<button class="btn small primary" type="button" data-outbound-history-action="restore" data-event-id="${esc(e.id)}">목록 복구</button>`:`<button class="btn small" type="button" data-outbound-history-action="edit" data-event-id="${esc(e.id)}">수정</button><button class="btn small danger" type="button" data-outbound-history-action="hide" data-event-id="${esc(e.id)}">목록에서 삭제</button>`}</div></td></tr>`;
    };
    return `<section class="panel panel-pad" style="grid-column:1/-1">
      <div class="panel-head"><div><h3 class="panel-title">최근 출고 이력 관리</h3><div class="panel-desc">출고 이력 한 건씩 수정하거나 최근 출고 목록에서 숨길 수 있습니다.</div></div><span class="pill blue">${visible.length}건 표시</span></div>

      <div class="divider"></div>
      <details><summary style="font-size:12px;font-weight:800;cursor:pointer">숨김 처리된 출고 이력 (${hidden.length}건) · 다시 표시하기</summary><div style="margin-top:12px">${hidden.length?`<div class="table-wrap"><table><thead><tr><th>출고 날짜</th><th>제품 / 모델</th><th>바코드</th><th>사업자등록번호</th><th>출고자</th><th>구분</th><th>관리</th></tr></thead><tbody>${hidden.map(e=>rowHtml(e,true)).join('')}</tbody></table></div>`:`<div class="small-note">숨김 처리된 출고 이력이 없습니다.</div>`}</div></details>
    </section>`;

  function attachOutboundHistorySettingsEvents(){
    $$('[data-outbound-history-action]').forEach(button=>button.addEventListener('click',()=>{
      const action=button.dataset.outboundHistoryAction,id=button.dataset.eventId;
      if(action==='edit')openOutboundHistoryEditModal(id);
      else if(action==='hide')hideOutboundHistoryRecord(id);
      else if(action==='restore')restoreOutboundHistoryRecord(id);
    }));
  }
  function openOutboundHistoryEditModal(eventId){
    const event=state.events.find(e=>e.id===eventId&&e.stage==='출고등록');
    if(!event){toast('수정할 출고 이력을 찾을 수 없습니다.','error');return;}
    const d=event.data||{};
    const currentTo=String(d.outboundTo||d.outboundBusinessRegistrationNumber||'');
    const currentOperator=String(d.outboundOperator||event.operatorName||'');
    const currentReason=String(d.outboundReason||'');
    const legacyReason=currentReason&&!['CS용','상품화'].includes(currentReason)?`<option value="${esc(currentReason)}" selected>기존 기록: ${esc(currentReason)}</option>`:'';
    const date=String(d.outboundDate||event.timestamp||'').slice(0,10);
    $('#modalRoot').innerHTML=`<div class="modal-backdrop" id="outboundHistoryEditBackdrop"><div class="modal"><div class="modal-head"><div><div class="eyebrow">EDIT OUTBOUND HISTORY</div><h2 style="margin-top:7px">출고 이력 수정</h2><p>${esc(d.productName||'-')} / ${esc(d.modelName||'-')} · ${esc(event.barcode||'-')}</p></div><button class="icon-btn" type="button" data-outbound-history-close>×</button></div><form id="outboundHistoryEditForm" data-event-id="${esc(eventId)}"><div class="modal-body"><div class="field-grid"><div class="field full"><label for="editOutboundBusinessNumber">출고처 사업자등록번호<span class="required">*</span></label><input id="editOutboundBusinessNumber" name="outboundTo" value="${esc(currentTo)}" type="text" inputmode="numeric" maxlength="12" data-business-number required></div><div class="field"><label for="editOutboundOperator">출고자<span class="required">*</span></label><select id="editOutboundOperator" name="outboundOperator" required>${staffNameOptionsHtml('outboundOperators',currentOperator)}</select></div><div class="field"><label for="editOutboundReason">출고 구분<span class="required">*</span></label><select id="editOutboundReason" name="outboundReason" required><option value="">선택하세요</option>${legacyReason}${['CS용','상품화'].map(v=>`<option value="${v}" ${currentReason===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="editOutboundDate">출고 날짜</label><input id="editOutboundDate" name="outboundDate" type="date" value="${esc(date)}"></div><div class="field full"><label for="editOutboundMemo">출고 메모</label><textarea id="editOutboundMemo" name="outboundMemo">${esc(d.outboundMemo||'')}</textarea></div></div><div class="note-box" style="margin-top:12px">저장하면 출고 이력의 정보를 수정합니다. 이 제품이 아직 출고등록 상태라면 현재 재고 정보에도 수정 내용이 반영됩니다.</div></div><div class="modal-foot"><button type="button" class="btn" data-outbound-history-close>취소</button><button type="submit" class="btn primary">수정 내용 저장</button></div></form></div></div>`;
    $$('[data-outbound-history-close]').forEach(b=>b.addEventListener('click',closeModal));
    $('#outboundHistoryEditBackdrop').addEventListener('click',e=>{if(e.target.id==='outboundHistoryEditBackdrop')closeModal();});
    bindBusinessNumberInputs($('#outboundHistoryEditForm'));
    $('#outboundHistoryEditForm').addEventListener('submit',saveOutboundHistoryEdit);
  }
  async function saveOutboundHistoryEdit(e){
    e.preventDefault();
    const form=e.currentTarget,event=state.events.find(item=>item.id===form.dataset.eventId&&item.stage==='출고등록');
    if(!event){toast('수정할 출고 이력을 찾을 수 없습니다.','error');return;}
    const data=Object.fromEntries(new FormData(form).entries()),old=event.data||{};
    const rawNumber=String(data.outboundTo||'').trim(),oldNumber=String(old.outboundTo||old.outboundBusinessRegistrationNumber||'').trim();
    if(rawNumber!==oldNumber&&!isValidBusinessNumber(rawNumber)){toast('출고처 사업자등록번호는 숫자 10자리로 입력해 주세요.','error');return;}
    if(!rawNumber){toast('출고처 사업자등록번호를 입력해 주세요.','error');return;}
    if(!String(data.outboundOperator||'').trim()){toast('출고자를 선택해 주세요.','error');return;}
    if(!String(data.outboundReason||'').trim()){toast('출고 구분을 선택해 주세요.','error');return;}
    const before={outboundTo:old.outboundTo||'',outboundOperator:old.outboundOperator||event.operatorName||'',outboundReason:old.outboundReason||'',outboundDate:old.outboundDate||'',outboundMemo:old.outboundMemo||''};
    const now=new Date().toISOString();
    const number=rawNumber===oldNumber?rawNumber:formatBusinessNumber(rawNumber);
    event.data={...old,outboundTo:number,outboundBusinessRegistrationNumber:number,outboundOperator:data.outboundOperator,outboundReason:data.outboundReason,outboundDate:data.outboundDate||old.outboundDate||today(),outboundMemo:data.outboundMemo||'',outboundEditHistory:[...(old.outboundEditHistory||[]),{editedAt:now,before,after:{...data,outboundTo:number}}].slice(-30)};
    event.operatorName=data.outboundOperator;
    event.action='출고 등록 정보 수정';
    const currentItem=state.inventory.find(item=>cleanBarcodeValue(item.barcode)===cleanBarcodeValue(event.barcode));
    const latest=getLatestActiveOutboundEvent(event.barcode);
    let changedItem=null;
    if(currentItem?.stage==='출고등록'&&latest?.id===event.id){
      changedItem={...currentItem,outboundTo:number,outboundBusinessRegistrationNumber:number,outboundOperator:data.outboundOperator,outboundReason:data.outboundReason,outboundDate:event.data.outboundDate,outboundMemo:event.data.outboundMemo,updatedAt:now};
      state.inventory=state.inventory.map(item=>cleanBarcodeValue(item.barcode)===cleanBarcodeValue(event.barcode)?changedItem:item);
    }
    saveStore();
    if(changedItem)await syncOne(changedItem,event);else await syncEventOnly(event);
    closeModal();renderMain();toast('출고 이력을 수정했습니다.','success');
  }
  async function hideOutboundHistoryRecord(eventId){
    const event=state.events.find(e=>e.id===eventId&&e.stage==='출고등록');
    if(!event)return;
    const reason=prompt('최근 출고 이력에서 숨길까요? (사유 입력은 선택 사항입니다)','설정에서 최근 출고 이력 정리');
    if(reason===null)return;
    event.data={...(event.data||{}),outboundHistoryHidden:true,outboundHistoryHiddenAt:new Date().toISOString(),outboundHistoryHiddenReason:String(reason||'').trim()};
    saveStore();await syncEventOnly(event);renderMain();toast('최근 출고 목록에서 숨겼습니다. 전체 업무 이력과 재고는 유지됩니다.','success');
  }
  async function restoreOutboundHistoryRecord(eventId){
    const event=state.events.find(e=>e.id===eventId&&e.stage==='출고등록');
    if(!event)return;
    const data={...(event.data||{})};delete data.outboundHistoryHidden;delete data.outboundHistoryHiddenAt;delete data.outboundHistoryHiddenReason;event.data=data;
    saveStore();await syncEventOnly(event);renderMain();toast('최근 출고 목록에 다시 표시했습니다.','success');
  }

다.':'클라우드 연결 전입니다. 연결 전에는 각 기기에 데이터가 따로 저장됩니다.'}</div><div class="divider"></div><details><summary style="font-size:12px;font-weight:800;cursor:pointer">처음 연결하는 방법 보기</summary><div class="small-note" style="margin:12px 0">1. Supabase에서 프로젝트를 만듭니다.<br>2. Authentication에서 팀 공용 이메일/비밀번호 계정을 하나 만듭니다. 가입은 꺼두고 믿을 수 있는 직원에게만 공용 계정을 알려주세요.<br>3. SQL Editor에서 아래 SQL 전체를 실행합니다. 기존 데이터는 삭제되지 않으며 공유용 제품·모델 목록 테이블이 추가됩니다.<br>4. Project URL과 공개용 anon/publishable key를 입력하고 공용 계정으로 로그인합니다.<br>5. 다른 PC·스마트폰에서도 같은 웹앱 주소와 같은 Supabase URL·공개 키·공용 계정으로 로그인합니다.<br>6. 다른 기기의 변경사항은 약 20초마다 자동으로 확인됩니다.</div><div class="code-box">${esc(SQL_SETUP)}</div><div class="btn-row" style="margin-top:10px"><button class="btn small" data-action="copy-sql">공용 연결 SQL 복사</button><button class="btn small" data-action="open-supabase">Supabase 열기 ↗</button></div></details></section></div><div class="panel panel-pad" style="margin-top:16px"><div class="panel-head"><div><h3 class="panel-title">사용 안내 및 개인정보</h3><div class="panel-desc">현장 사용 전에 확인하세요.</div></div></div><div class="stage-list"><div class="stage-line" style="grid-template-columns:24px 1fr"><span class="grade S">1</span><div><div style="font-size:12px;font-weight:750">카메라 바코드 촬영</div><div class="small-note">카메라는 HTTPS 주소에서 열어야 합니다. 카메라 권한을 허용하고, 지원하지 않는 브라우저에서는 바코드 번호를 직접 입력할 수 있습니다.</div></div></div><div class="stage-line" style="grid-template-columns:24px 1fr"><span class="grade A">2</span><div><div style="font-size:12px;font-weight:750">자동 저장 및 백업</div><div class="small-note">브라우저 데이터 삭제 또는 기기 변경 전에 JSON 백업을 내려받으세요. 로컬 모드의 데이터는 브라우저별로 따로 저장됩니다.</div></div></div><div class="stage-line" style="grid-template-columns:24px 1fr"><span class="grade B">3</span><div><div style="font-size:12px;font-weight:750">공용 데이터 보안</div><div class="small-note">클라우드 연결은 Supabase 계정 인증과 사용자별 RLS 정책을 사용합니다. 공유 기기에서는 로그아웃하고, 계정 비밀번호를 안전하게 관리하세요.</div></div></div></div></div>`;}
  function renderSettings(){
    const sectionMeta=[
      {id:'password',number:'01',title:'관리 비밀번호',desc:'설정 화면과 제품 삭제를 보호하는 비밀번호를 등록하거나 변경합니다.',icon:'01'},
      {id:'staff',number:'02',title:'입력자 · 출고자 이름 관리',desc:'업무 등록 화면에서 선택할 담당자 이름을 추가·수정·삭제합니다.',icon:'02'},
      {id:'products',number:'03',title:'제품명 · 모델명 관리',desc:'제품과 제품별 모델 목록 및 표시 순서를 관리합니다.',icon:'03'},
      {id:'minimum',number:'04',title:'CS용 최소수량 관리',desc:'제품·모델별 CS용 최소 재고 기준을 등록합니다.',icon:'04'},
      {id:'outbound',number:'05',title:'최근 출고 이력 관리',desc:'최근 출고 기록을 건별로 수정하거나 목록에서 숨기고 복구합니다.',icon:'05'},
      {id:'backup',number:'06',title:'데이터 백업 및 복원',desc:'전체 데이터 JSON 백업, 복원 및 CSV 내보내기를 합니다.',icon:'06'},
      {id:'sheets',number:'07',title:'Google Sheets 자동 기록',desc:'새로 등록되는 업무 이력을 구글 스프레드시트에 저장합니다.',icon:'07'},
      {id:'mybox',number:'08',title:'네이버 MYBOX 자동 백업',desc:'예약 백업 시간, 백업 연결 및 보관 상태를 관리합니다.',icon:'08'},
      {id:'cloud',number:'09',title:'웹앱 공유 및 공용 클라우드',desc:'여러 PC와 스마트폰에서 같은 제품·재고·업무 이력을 공유합니다.',icon:'09'},
      {id:'privacy',number:'10',title:'사용 안내 및 개인정보',desc:'카메라, 자동 저장, 백업 및 공용 데이터 보안 안내를 확인합니다.',icon:'10'},
      {id:'print',number:'11',title:'프린트 설정',desc:'A/S 접수표와 월간·연간 보고서의 용지, 방향, 여백 및 자동 인쇄를 설정합니다.',icon:'11'}
    ];
    const template=document.createElement('template');
    template.innerHTML=renderSettingsLegacy();
    const printPanelTemplate=document.createElement('template');
    printPanelTemplate.innerHTML=renderPrintSettingsPanel();
    if(printPanelTemplate.content.firstElementChild)template.content.append(printPanelTemplate.content.firstElementChild);
    const panels=Array.from(template.content.querySelectorAll('section.panel'));
    const panelById={};
    const titleToId=[
      ['관리 비밀번호','password'],
      ['입력자 · 출고자 이름 관리','staff'],
      ['제품명 · 모델명 목록 관리','products'],
      ['CS용 최소수량 관리','minimum'],
      ['최근 출고 이력 관리','outbound'],
      ['데이터 백업 및 복원','backup'],
      ['Google Sheets 자동 기록','sheets'],
      ['네이버 MYBOX 자동 백업','mybox'],
      ['웹앱 공유 및 공용 클라우드 연결','cloud'],
      ['사용 안내 및 개인정보','privacy'],
      ['프린트 설정','print']
    ];
    panels.forEach(panel=>{
      const title=(panel.querySelector('.panel-title')?.textContent||'').trim();
      const match=titleToId.find(([label])=>title.includes(label));
      if(match)panelById[match[1]]=panel;
    });
    const header=`<div class="section-head"><div><div class="eyebrow">SETTINGS / DATA</div><h2 class="section-title" style="margin-top:7px">설정·데이터 관리</h2><div class="section-sub">업무등록처럼 번호를 선택해 필요한 설정으로 들어가세요.</div></div></div>`;
    if(!settingsSection){
      return `${header}<div class="workflow-grid settings-choice-grid">${sectionMeta.map(item=>`<button type="button" class="workflow-card settings-choice-card" data-settings-section="${item.id}"><div class="workflow-head"><div class="workflow-ico">${item.number}</div><span class="workflow-count">설정 ${item.number}</span></div><h3>${item.title}</h3><p>${item.desc}</p><span class="arrow">↗</span></button>`).join('')}</div><div class="note-box" style="margin-top:16px">원하는 번호를 누르면 해당 설정 화면으로 이동합니다. 작업을 마친 뒤에는 ‘설정 목록으로’ 버튼을 눌러 다른 설정을 선택할 수 있습니다.</div>`;
    }
    const selected=sectionMeta.find(item=>item.id===settingsSection);
    const panel=panelById[settingsSection];
    if(!selected||!panel){settingsSection='';return renderSettings();}
    return `${header}<div class="settings-detail-toolbar"><button class="btn" type="button" data-settings-back>← 설정 목록으로</button><span class="pill blue">${selected.number} · ${selected.title}</span></div><div class="settings-detail-panel">${panel.outerHTML}</div>`;
  }
  function attachViewEvents(){
    if(currentView==='settings'){
      attachStaffCatalogSettingsEvents();attachProductCatalogSettingsEvents();attachCSMinimumSettingsEvents();attachOutboundHistorySettingsEvents();
      $$('[data-settings-section]').forEach(button=>button.addEventListener('click',()=>{settingsSection=button.dataset.settingsSection;const meta={password:'관리 비밀번호',staff:'입력자 · 출고자 이름 관리',products:'제품명 · 모델명 관리',minimum:'CS용 최소수량 관리',outbound:'최근 출고 이력 관리',backup:'데이터 백업 및 복원',sheets:'Google Sheets 자동 기록',mybox:'네이버 MYBOX 자동 백업',cloud:'웹앱 공유 및 공용 클라우드',privacy:'사용 안내 및 개인정보',print:'프린트 설정'};$('#pageTitle').textContent=meta[settingsSection]||'설정·데이터 관리';renderMain();window.scrollTo({top:0,behavior:'smooth'});}));
      $('[data-settings-back]')?.addEventListener('click',()=>{settingsSection='';$('#pageTitle').textContent='설정·데이터 관리';renderMain();window.scrollTo({top:0,behavior:'smooth'});});
    }
    // 업무 단계 카드는 업무등록 화면만 열도록 제한합니다. 재고 목록의 tr[data-stage] 행을 클릭 대상으로 포함하면 수정 버튼 클릭 시 등록 모달이 겹쳐 열립니다.
    $$('.workflow-card[data-stage]').forEach(b=>b.addEventListener('click',()=>b.dataset.stage==='AS접수'?openASReceiptChoice():openWorkModal(b.dataset.stage)));
    $$('[data-workflow-tab]').forEach(button=>button.addEventListener('click',()=>{workflowTab=button.dataset.workflowTab;renderMain();}));
    const workflowSearch=$('#workflowRecordSearch');if(workflowSearch)workflowSearch.addEventListener('input',filterWorkflowRecordRows);
    $$('[data-history-mode]').forEach(b=>b.addEventListener('click',()=>{historyMode=b.dataset.historyMode;renderMain();}));
    $$('[data-action]').forEach(b=>b.addEventListener('click',()=>handleAction(b.dataset.action,b)));
    $$('[data-report-mode]').forEach(b=>b.addEventListener('click',()=>{reportMode=b.dataset.reportMode;renderMain();}));
    $$('#appContent [data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
    const search=$('#historySearch'),filter=$('#historyFilter');if(search)search.addEventListener('input',filterHistoryRows);if(filter)filter.addEventListener('change',filterHistoryRows);
    const correctionSearch=$('#correctionSearch'),correctionFilter=$('#correctionStageFilter');if(correctionSearch)correctionSearch.addEventListener('input',filterCorrectionRows);if(correctionFilter)correctionFilter.addEventListener('change',filterCorrectionRows);
    $$('[data-correction-edit]').forEach(button=>button.addEventListener('click',()=>openWorkflowCorrectionModal(button.dataset.correctionEdit)));
    $$('[data-correction-delete]').forEach(button=>button.addEventListener('click',()=>deleteWorkflowCorrectionEvent(button.dataset.correctionDelete)));
    const year=$('#reportYear'),month=$('#reportMonth'),compareMonth=$('#reportCompareMonth');if(year)year.addEventListener('change',()=>renderMain());if(month)month.addEventListener('change',()=>{const nextMonth=Number(month.value);if(nextMonth===reportCompareMonth)reportCompareMonth=nextMonth===1?12:nextMonth-1;renderMain();});if(compareMonth)compareMonth.addEventListener('change',()=>{reportCompareMonth=Number(compareMonth.value);const selectedMonth=Number($('#reportMonth')?.value||new Date().getMonth()+1);if(reportCompareMonth===selectedMonth)reportCompareMonth=selectedMonth===1?12:selectedMonth-1;renderMain();});
    $$('[data-detail-barcode]').forEach(b=>b.addEventListener('click',()=>showItemDetail(b.dataset.detailBarcode)));
    $$('[data-edit-barcode]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openItemEdit(b.dataset.editBarcode);}));
    $$('[data-delete-barcode]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();deleteInventoryItem(b.dataset.deleteBarcode);}));
    $$('[data-delete-event]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();deleteHistoryEvent(b.dataset.deleteEvent);}));
  }
  function filterHistoryRows(){const q=($('#historySearch')?.value||'').toLowerCase().trim(),stage=$('#historyFilter')?.value||'';$$('#historyTableWrap tbody tr[data-search]').forEach(tr=>{tr.classList.toggle('hide',!tr.dataset.search.includes(q)||(stage&&tr.dataset.stage!==stage));});}
  function handleAction(action){
    if(action==='new-work')setView('workflow');
    else if(action==='new-outbound')openWorkModal('출고등록');
    else if(action==='cancel-outbound')openOutboundCancelModal();
    else if(action==='quick-report')setView('reports');
    else if(action==='show-inventory'){historyMode='inventory';setView('history');}
    else if(action==='show-history'){historyMode='events';setView('history');}
    else if(action==='open-cs-minimum-settings')setView('settings');
    else if(action==='export-csv')exportCSV();
    else if(action==='backup-json')backupJSON();
    else if(action==='import-json')$('#importFile')?.click();
    else if(action==='print-report')printReportWithSettings();
    else if(action==='save-print-settings')savePrintSettings();
    else if(action==='test-print-settings')openPrintSettingsTest();
    else if(action==='reset-data')resetData();
    else if(action==='save-cloud'){saveConfig();}
    else if(action==='save-google-sheet'){saveGoogleSheetConfig();}
    else if(action==='save-mybox-backup'){saveMyboxBackupSettings();}
    else if(action==='run-mybox-backup-now'){requestMyboxBackupNow();}
    else if(action==='check-mybox-backup-status'){requestMyboxBackupStatus();}
    else if(action==='open-mybox-token')window.open('https://developers.mybox.naver.com/getting-started','_blank','noopener');
    else if(action==='save-security-password'){saveSecurityPassword();}
    else if(action==='open-google-script')window.open('https://script.google.com/home','_blank','noopener');
    else if(action==='cloud-login')cloudLogin();
    else if(action==='cloud-logout')cloudLogout();
    else if(action==='cloud-sync-now')syncNow();
    else if(action==='copy-app-link')copyAppLink();
    else if(action==='copy-sql')navigator.clipboard?.writeText(SQL_SETUP).then(()=>toast('공용 클라우드 SQL을 복사했습니다.','success')).catch(()=>toast('복사할 수 없습니다. SQL을 직접 선택해 복사해 주세요.','error'));
    else if(action==='open-supabase')window.open('https://supabase.com/dashboard','_blank','noopener');

  function saveInitialDefect(e){
    e.preventDefault();const form=e.currentTarget;const fd=Object.fromEntries(new FormData(form).entries());
    const operator=String(fd.operatorName||'').trim();
    const barcode=cleanBarcodeValue(fd.barcode||'');const symptom=fd.defectSymptom==='직접입력'?String(fd.customDefectSymptom||'').trim():String(fd.defectSymptom||'');
    if(!operator){toast('입고자를 선택하거나 직접 입력해 주세요.','error');return;}if(!barcode){toast('바코드를 입력해 주세요.','error');return;}if(!symptom){toast('초기불량 증상을 선택하거나 직접 입력해 주세요.','error');return;}
    const linked=state.inventory.find(x=>cleanBarcodeValue(x.barcode)===barcode)||state.events.find(x=>cleanBarcodeValue(x.barcode)===barcode&&x.data?.productName);
    const base=linked?.data||linked||{};const now=new Date().toISOString();
    const productName=String(fd.productName||base.productName||'').trim(),modelName=String(fd.modelName||base.modelName||'').trim();
    if(!productName){toast('제품명을 선택해 주세요.','error');return;}if(!modelName){toast('모델명을 선택해 주세요.','error');return;}
    const event={id:idgen(),barcode,stage:'초기불량',timestamp:new Date(`${fd.receivedDate||today()}T12:00:00`).toISOString(),operatorName:operator,data:{barcode,operatorName:operator,productName,modelName,primaryContact:String(fd.primaryContact||'').trim(),secondaryContact:String(fd.secondaryContact||'').trim(),shippingAddress:String(fd.shippingAddress||'').trim(),defectSymptom:symptom,receivedDate:fd.receivedDate||today(),initialDefect:true},action:'초기불량 입고 등록'};
    state.events.push(event);saveStore();sendNewEventToGoogleSheet(event);syncInitialDefectEvent(event);
    printInitialDefectReceipt(event);closeModal();renderMain();toast('초기불량 기록을 저장하고 인쇄창을 열었습니다.','success');
  }
  async function syncInitialDefectEvent(event){if(!cloudSession?.access_token)return;try{const uid=cloudSession.user.id;await cloudRequest('events?on_conflict=user_id%2Cid',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,id:event.id,data:event,created_at:event.timestamp||new Date().toISOString()}});updateSyncLabels();}catch(err){const status=$('#cloudStatusText');if(status)status.textContent='초기불량은 로컬 저장했지만 클라우드 동기화에 실패했습니다: '+err.message;toast('초기불량 로컬 저장 완료 · 클라우드 동기화 실패: '+err.message,'error');}}
  function printInitialDefectReceipt(event){
    const d=event.data||{};
    const paperConfig={
      A4:{page:'A4 portrait',maxWidth:'190mm',bodyPadding:'18px',sheetPadding:'18px',margin:'8mm'},
      A5:{page:'A5 portrait',maxWidth:'138mm',bodyPadding:'10px',sheetPadding:'12px',margin:'6mm'},
      '80mm':{page:'80mm auto',maxWidth:'76mm',bodyPadding:'2px',sheetPadding:'6px',margin:'2mm'}
    };
    const format=paperConfig[printSettings.receiptPaper]||paperConfig.A4;
    const printWindow=window.open('','_blank','width=820,height=900');
    if(!printWindow){toast('초기불량은 저장했습니다. 인쇄 팝업을 허용한 뒤 다시 인쇄해 주세요.','error');return null;}
    const dateValue=d.receivedDate||event.timestamp||today();

      ['입고자',d.operatorName||'-']
    ];
    const receiptHtml=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AS FLOW 초기불량 접수표</title><style>

      table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}th,td{border:1px solid #cfd8dd;padding:11px 12px;text-align:left;vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.55}th{width:28%;background:#f4f7f8;font-weight:750;color:#344b5b}

    </style></head><body><main class="sheet"><header class="head"><div><div class="brand">AS FLOW · SERVICE MANAGEMENT</div><h1 class="title">초기불량 접수표</h1></div><div class="meta">저장 및 출력: ${esc(printedAt)}<br>업무 구분: 초기불량</div></header><div class="barcode"><strong>바코드 번호</strong>　${esc(event.barcode||'-')}</div><table><tbody>${rows.map(([label,value])=>`<tr><th>${esc(label)}</th><td>${esc(value)}</td></tr>`).join('')}</tbody></table><div class="foot">AS FLOW · 초기불량 접수 정보 확인용</div></main><div class="actions"><button onclick="window.close()">닫기</button><button class="primary" onclick="window.print()">다시 인쇄</button></div></body></html>`;
    printWindow.document.open();printWindow.document.write(receiptHtml);printWindow.document.close();

      printWindow.onload=()=>setTimeout(triggerPrint,250);
      setTimeout(triggerPrint,700);

  async function saveWorkForm(e){e.preventDefault();const form=e.currentTarget;const stage=form.dataset.stage||$('#workBackdrop h2').textContent.replace(' 등록','');const data=Object.fromEntries(new FormData(form).entries());if(stage==='AS발송'){

  function latestItemActionByBarcode(events=state.events){
    const latest=new Map();
    for(const event of events||[]){
      const code=cleanBarcodeValue(event?.barcode);
      if(!code)continue;
      const stamp=Date.parse(event.timestamp||0)||0;
      const previous=latest.get(code);
      if(!previous||stamp>=previous.timestamp){
        latest.set(code,{timestamp:stamp,deleted:event.action==='품목 삭제'});
      }
    }
    return latest;
  }
  function pruneDeletedInventoryByEvents(){
    const latest=latestItemActionByBarcode();
    const removed=[];
    state.inventory=state.inventory.filter(item=>{
      const code=cleanBarcodeValue(item?.barcode);
      if(latest.get(code)?.deleted){removed.push(String(item.barcode));return false;}
      return true;
    });
    return [...new Set(removed)];
  }

  async function saveItemEdit(e,barcode){
    e.preventDefault();
    const prior=state.inventory.find(i=>String(i.barcode??'')===String(barcode??''));if(!prior){toast('수정할 품목이 사라졌습니다. 목록을 새로고침해 주세요.','error');return;}
    const form=e.currentTarget;const data=Object.fromEntries(new FormData(form).entries());
    data.barcode=prior.barcode;
    data.productName=String(data.productName||'').trim();data.modelName=String(data.modelName||'').trim();
    if(!data.productName||!data.modelName){toast('제품명과 모델명을 목록에서 선택해 주세요.','error');return;}
    const selectedProduct=productCatalog.find(p=>p.name===data.productName);
    if(!selectedProduct||!selectedProduct.models.includes(data.modelName)){toast('선택한 제품에 등록된 모델명을 선택해 주세요.','error');return;}
    for(const key of ['branch','returnedBranch','outboundTo']){
      const raw=String(data[key]||'').trim(),old=String(prior[key]||'').trim();
      if(raw&&raw!==old){if(!isValidBusinessNumber(raw)){toast('사업자등록번호는 숫자 10자리로 입력해 주세요.','error');return;}data[key]=formatBusinessNumber(raw);}
    }
    if(data.branch)data.businessRegistrationNumber=data.branch;
    if(data.returnedBranch)data.returnedBusinessRegistrationNumber=data.returnedBranch;
    if(data.outboundTo)data.outboundBusinessRegistrationNumber=data.outboundTo;
    const now=new Date().toISOString();
    const updated={...prior,...data,barcode:prior.barcode,createdAt:prior.createdAt||now,updatedAt:now};
    if(updated.stage==='폐기'&&!updated.disposedDate)updated.disposedDate=today();
    state.inventory=state.inventory.map(i=>i.barcode===prior.barcode?updated:i);
    const stageChanged=updated.stage!==prior.stage;
    const event={id:idgen(),barcode:updated.barcode,stage:updated.stage,timestamp:now,data:{...updated},action:stageChanged?`품목 정보 수정 · 단계 변경 (${prior.stage||'미분류'} → ${updated.stage})`:'품목 정보 수정'};
    state.events.push(event);saveStore();sendNewEventToGoogleSheet(event);await syncOne(updated,event);closeModal();toast(`바코드 ${updated.barcode} 제품 정보를 수정했습니다. 기존 업무 이력은 유지됩니다.`,'success');
    if(currentView==='history'){renderMain();}else{historyMode='inventory';setView('history');}
  }

  async function runScanner(){

      const videoSupport=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
      if(!videoSupport)throw new Error('이 브라우저에서는 카메라를 사용할 수 없습니다. HTTPS 주소로 접속해 주세요.');
      const video=$('#scannerVideo');
      if(!video)throw new Error('카메라 미리보기 화면을 찾을 수 없습니다.');
      let stream;
      try{
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
      }catch(firstError){
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      }
      scannerStream=stream;
      const track=stream.getVideoTracks?.()[0];
      try{

      video.srcObject=stream;
      video.setAttribute('playsinline','');
      video.muted=true;
      await video.play();
      $('#scannerStill')?.classList.add('hide');
      $('#scannerFocus')?.classList.remove('hide');
      $('#scannerCandidates')?.classList.add('hide');
      $('#scannerCandidates')?.replaceChildren();
      $('#scannerResult')?.classList.add('hide');

      $('#captureBarcode')?.classList.remove('hide');

      // Keep the live view passive: no code is accepted until the user presses the shutter.
    }catch(err){
      setScanMessage(err?.message||'카메라를 시작하지 못했습니다.');
      $('#captureBarcode')?.setAttribute('disabled','disabled');
      toast('카메라를 시작하지 못했습니다. HTTPS 주소와 카메라 권한을 확인해 주세요.','error');

  function cleanBarcodeValue(value){
    // A barcode is an identifier, not a number. Never convert it to Number or remove leading zeroes.
    return String(value??'').replace(/^\s+|\s+$/g,'');
  }
  function uniqueBarcodeValues(values){return [...new Set((values||[]).map(cleanBarcodeValue).filter(v=>v.length>0))];}
  async function detectWithNativeBarcodeDetector(canvas){
    if(!('BarcodeDetector' in window))return [];
    try{
      let detector;
      try{
        const formats=await window.BarcodeDetector.getSupportedFormats();
        detector=formats?.length?new window.BarcodeDetector({formats}):new window.BarcodeDetector();
      }catch{detector=new window.BarcodeDetector();}
      const hits=await detector.detect(canvas);
      return uniqueBarcodeValues((hits||[]).map(hit=>hit?.rawValue));
    }catch{return [];}
  }
  function upscaleFocusRegion(source){
    // Second-pass fallback: enlarge the green guide area from the still image for small barcodes.
    const sx=Math.round(source.width*.16),sy=Math.round(source.height*.30);
    const sw=Math.max(1,Math.round(source.width*.68)),sh=Math.max(1,Math.round(source.height*.40));
    const canvas=document.createElement('canvas');
    canvas.width=Math.min(sw*2,4096);canvas.height=Math.min(sh*2,2048);
    const ctx=canvas.getContext('2d');
    if(ctx){ctx.imageSmoothingEnabled=false;ctx.drawImage(source,sx,sy,sw,sh,0,0,canvas.width,canvas.height);}
    return canvas;
  }
  async function scanImageWithHtml5Qrcode(canvas){
    if(!window.Html5Qrcode)await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
    if(!window.Html5Qrcode)throw new Error('바코드 이미지 판독 기능을 사용할 수 없습니다.');
    const host=$('#scanner-fallback-reader');
    if(!host)throw new Error('바코드 판독용 화면을 찾을 수 없습니다.');
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('촬영 이미지 변환에 실패했습니다.')),'image/png'));
    const file=new File([blob],'barcode-capture.png',{type:'image/png'});
    const reader=new window.Html5Qrcode('scanner-fallback-reader',{verbose:false});
    scannerInstance=reader;
    try{
      const decoded=await reader.scanFile(file,false);
      return uniqueBarcodeValues([decoded]);
    }finally{
      try{reader.clear();}catch{}
      if(scannerInstance===reader)scannerInstance=null;
      host.replaceChildren();
    }
  }
  async function decodeCapturedBarcode(canvas){
    const nativeValues=await detectWithNativeBarcodeDetector(canvas);
    if(nativeValues.length)return nativeValues;
    // The fallback decodes the actual still image (not a constantly moving video frame).
    const fullFrameValues=await scanImageWithHtml5Qrcode(canvas).catch(()=>[]);
    if(fullFrameValues.length)return fullFrameValues;
    const focused=upscaleFocusRegion(canvas);
    const focusedNativeValues=await detectWithNativeBarcodeDetector(focused);
    if(focusedNativeValues.length)return focusedNativeValues;
    return await scanImageWithHtml5Qrcode(focused).catch(()=>[]);
  }
  async function captureAndDecodeBarcode(){
    if(scanBusy)return;
    const video=$('#scannerVideo');
    if(!video||!video.videoWidth||video.readyState<2){setScanMessage('카메라가 아직 준비되지 않았습니다. 잠시 후 다시 눌러 주세요.');return;}
    scanBusy=true;
    const shutter=$('#captureBarcode');
    if(shutter)shutter.disabled=true;
    try{
      const canvas=document.createElement('canvas');
      // Use the camera's original frame resolution to avoid losing barcode bars or digits.
      canvas.width=video.videoWidth;canvas.height=video.videoHeight;
      const ctx=canvas.getContext('2d',{willReadFrequently:true});
      if(!ctx)throw new Error('촬영 이미지를 준비할 수 없습니다.');
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      scanCaptureCanvas=canvas;
      const still=$('#scannerStill');
      if(still){still.src=canvas.toDataURL('image/jpeg',.97);still.classList.remove('hide');}
      video.pause();video.classList.add('hide');
      $('#scannerFocus')?.classList.add('hide');
      $('#captureBarcode')?.classList.add('hide');
      $('#retakeBarcode')?.classList.remove('hide');
      setScanMessage('촬영 완료 · 고해상도 이미지에서 바코드를 판독하고 있습니다...');
      // Release camera after the still is saved; this also prevents the live feed shifting during decode.
      if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null;}
      const values=await decodeCapturedBarcode(canvas);
      if(values.length===1){await finishScan(values[0]);return;}
      if(values.length>1){showBarcodeCandidates(values);setScanMessage('한 장의 사진에서 바코드가 여러 개 발견됐습니다. 입력할 번호를 선택하세요.');setScanStatus('잘못된 바코드가 자동 입력되지 않도록 번호를 직접 선택해 주세요.','error');return;}
      setScanMessage('바코드를 읽지 못했습니다. 초점을 맞추고 바코드 전체가 보이게 다시 촬영해 주세요.');
      setScanStatus('인식된 번호가 없습니다. 빛 반사를 줄이고 바코드와 카메라를 평행하게 맞춘 다음 다시 촬영해 주세요.','error');
    }catch(err){
      setScanMessage(err?.message||'바코드 촬영 중 오류가 발생했습니다.');
      setScanStatus('번호를 입력하지 않았습니다. 다시 촬영하거나 직접 입력해 주세요.','error');
    }finally{
      scanBusy=false;
      if(shutter&&$('#scannerBackdrop'))shutter.disabled=false;
    }
  }
  function showBarcodeCandidates(values){
    const root=$('#scannerCandidates');if(!root)return;

      const button=document.createElement('button');button.type='button';button.className='btn scanner-candidate';button.textContent=value;button.addEventListener('click',()=>finishScan(value));root.appendChild(button);
    });
    root.classList.toggle('hide',!root.childElementCount);
  }
  async function finishScan(value){
    const inputId=activeBarcodeInput;
    const exactValue=cleanBarcodeValue(value);
    if(!exactValue){setScanMessage('빈 바코드 값은 입력할 수 없습니다. 다시 촬영해 주세요.');return;}
    const input=inputId?$('#'+inputId):null;
    if(input){
      input.value=exactValue;
      input.dispatchEvent(new Event('input',{bubbles:true}));
      input.dispatchEvent(new Event('change',{bubbles:true}));
    }
    await stopScanner();
    toast('바코드 번호를 입력했습니다. 번호와 선행 0이 유지됐는지 확인해 주세요.','success');
    input?.focus();
  }

  }

  function saveConfigQuiet(){cloudConfig={url:($('#cloudUrl')?.value||'').trim().replace(/\/$/,''),key:($('#cloudKey')?.value||'').trim()};localStorage.setItem(CONFIG_KEY,JSON.stringify(cloudConfig));}
  async function validAccessToken(){if(!cloudSession?.access_token)throw new Error('먼저 공용 클라우드 계정으로 로그인하세요.');if(cloudSession.expires_at>Date.now()+60000)return cloudSession.access_token;const refreshed=await authRequest('token?grant_type=refresh_token',{refresh_token:cloudSession.refresh_token});cloudSession={...cloudSession,access_token:refreshed.access_token,refresh_token:refreshed.refresh_token||cloudSession.refresh_token,expires_at:Date.now()+(Number(refreshed.expires_in)||3600)*1000,user:refreshed.user||cloudSession.user};localStorage.setItem(SESSION_KEY,JSON.stringify(cloudSession));return cloudSession.access_token;}
  async function cloudRequest(path,options={}){const token=await validAccessToken();const headers={'apikey':cloudConfig.key,'Authorization':'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})};const res=await fetch(normalizedUrl()+'/rest/v1/'+path,{method:options.method||'GET',headers,body:options.body===undefined?undefined:JSON.stringify(options.body)});if(!res.ok){const text=await res.text();throw new Error(text.slice(0,350)||`클라우드 요청 오류 (${res.status})`);}if(res.status===204)return null;const txt=await res.text();return txt?JSON.parse(txt):null;}
  function mergeInventoryAndEvents(remoteInv,remoteEvents){
    const beforeInv=JSON.stringify(state.inventory),beforeEvents=JSON.stringify(state.events);
    const imap=new Map();
    [...state.inventory,...(remoteInv||[]).map(r=>r.data)].forEach(item=>{
      if(!item?.barcode)return;
      const code=cleanBarcodeValue(item.barcode),prev=imap.get(code);
      if(!prev||(item.updatedAt||'')>(prev.updatedAt||''))imap.set(code,item);
    });
    const emap=new Map();
    [...state.events,...(remoteEvents||[]).map(r=>r.data)].forEach(ev=>{if(ev?.id)emap.set(ev.id,ev)});
    state.inventory=[...imap.values()];
    const mergedEvents=[...emap.values()];
    const deletedHistoryIds=new Set(mergedEvents.filter(ev=>ev?.stage==='이력 삭제').map(ev=>String(ev.data?.targetEventId||'')));
    state.events=mergedEvents.filter(ev=>!deletedHistoryIds.has(String(ev.id))).sort((a,b)=>(a.timestamp||'').localeCompare(b.timestamp||''));
    const deleted=pruneDeletedInventoryByEvents();
    return {changed:beforeInv!==JSON.stringify(state.inventory)||beforeEvents!==JSON.stringify(state.events),deleted};
  }
  async function fetchSharedCloudData(){
    const uid=cloudSession?.user?.id;if(!uid)throw new Error('로그인 사용자 정보를 확인할 수 없습니다.');
    const [remoteInv,remoteEvents,remoteCatalog,remoteStaff,remoteCSMinimums]=await Promise.all([
      cloudRequest(`inventory?select=barcode,data&user_id=eq.${encodeURIComponent(uid)}`),
      cloudRequest(`events?select=id,data&user_id=eq.${encodeURIComponent(uid)}`),
      cloudRequest(`shared_catalog?select=catalog_key,data,updated_at&user_id=eq.${encodeURIComponent(uid)}&catalog_key=eq.main`),
      cloudRequest(`shared_catalog?select=catalog_key,data,updated_at&user_id=eq.${encodeURIComponent(uid)}&catalog_key=eq.staff`),
      cloudRequest(`shared_catalog?select=catalog_key,data,updated_at&user_id=eq.${encodeURIComponent(uid)}&catalog_key=eq.cs_minimums`)
    ]);
    return {remoteInv:remoteInv||[],remoteEvents:remoteEvents||[],remoteCatalog:remoteCatalog?.[0]||null,remoteStaff:remoteStaff?.[0]||null,remoteCSMinimums:remoteCSMinimums?.[0]||null};
  }
  async function syncFromCloudMerge(){
    const {remoteInv,remoteEvents,remoteCatalog,remoteStaff,remoteCSMinimums}=await fetchSharedCloudData();
    const merged=mergeInventoryAndEvents(remoteInv,remoteEvents);
    if(remoteCatalog?.data){
      productCatalog=normalizeProductCatalog(remoteCatalog.data);
      localStorage.setItem(PRODUCT_CATALOG_KEY,JSON.stringify(productCatalog));
    }
    if(remoteStaff?.data){
      const remoteTime=Date.parse(remoteStaff.updated_at||remoteStaff.data.updatedAt||0)||0;
      const localTime=Date.parse(staffCatalog.updatedAt||0)||0;
      if(localTime>remoteTime)await syncStaffCatalogToCloud();
      else{staffCatalog=normalizeStaffCatalog({...remoteStaff.data,updatedAt:remoteStaff.updated_at||remoteStaff.data.updatedAt||''});saveStaffCatalogLocal();}
    }else if(!staffCatalog.updatedAt){
      const migrated=collectLegacyStaffCatalog();
      staffCatalog={...migrated,updatedAt:''};saveStaffCatalogLocal();
    }
    if(remoteCSMinimums?.data){
      const remote=normalizeCSMinimumCatalog(remoteCSMinimums.data);
      const remoteTime=Date.parse(remoteCSMinimums.updated_at||remote.updatedAt||0)||0;
      const localTime=Date.parse(csMinimumCatalog.updatedAt||0)||0;
      if(localTime>remoteTime)await syncCSMinimumCatalogToCloud();
      else{csMinimumCatalog=normalizeCSMinimumCatalog({...remote,updatedAt:remoteCSMinimums.updated_at||remote.updatedAt||''});saveCSMinimumCatalogLocal();}
    }else if(csMinimumCatalog.items.length){await syncCSMinimumCatalogToCloud();}
    saveStore();
    for(const code of merged.deleted)await deleteCloudInventoryBarcode(code);
    await syncAll();
  }
  async function syncProductCatalogToCloud(){
    if(!cloudSession?.access_token)return;
    const uid=cloudSession.user.id;
    catalogCloudWritePending=true;
    try{
      await cloudRequest('shared_catalog?on_conflict=user_id%2Ccatalog_key',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,catalog_key:'main',data:normalizeProductCatalog(productCatalog),updated_at:new Date().toISOString()}});
    }finally{catalogCloudWritePending=false;}
  }
  async function syncStaffCatalogToCloud(){
    if(!cloudSession?.access_token)return;
    const uid=cloudSession.user.id;
    staffCatalogCloudWritePending=true;
    try{
      if(!staffCatalog.updatedAt){staffCatalog.updatedAt=new Date().toISOString();saveStaffCatalogLocal();}
      await cloudRequest('shared_catalog?on_conflict=user_id%2Ccatalog_key',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,catalog_key:'staff',data:{inputters:staffCatalog.inputters,outboundOperators:staffCatalog.outboundOperators,updatedAt:staffCatalog.updatedAt},updated_at:staffCatalog.updatedAt}});
    }finally{staffCatalogCloudWritePending=false;}
  }
  async function syncCSMinimumCatalogToCloud(){
    if(!cloudSession?.access_token)return;
    const uid=cloudSession.user.id;
    if(!csMinimumCatalog.updatedAt){csMinimumCatalog.updatedAt=new Date().toISOString();saveCSMinimumCatalogLocal();}
    csMinimumCatalogCloudWritePending=true;
    try{await cloudRequest('shared_catalog?on_conflict=user_id%2Ccatalog_key',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,catalog_key:'cs_minimums',data:csMinimumCatalog,updated_at:csMinimumCatalog.updatedAt}});}
    finally{csMinimumCatalogCloudWritePending=false;}
  }
  async function pullCloudUpdates(silent=true){
    if(!cloudSession?.access_token||cloudPollBusy||document.hidden)return;
    cloudPollBusy=true;
    try{
      const {remoteInv,remoteEvents,remoteCatalog,remoteStaff,remoteCSMinimums}=await fetchSharedCloudData();
      const merged=mergeInventoryAndEvents(remoteInv,remoteEvents);
      let catalogChanged=false,staffChanged=false,csMinimumsChanged=false;
      if(remoteCatalog?.data&&!catalogCloudWritePending){
        const remote=normalizeProductCatalog(remoteCatalog.data);
        catalogChanged=JSON.stringify(remote)!==JSON.stringify(productCatalog);
        if(catalogChanged){productCatalog=remote;localStorage.setItem(PRODUCT_CATALOG_KEY,JSON.stringify(productCatalog));}
      }
      if(remoteStaff?.data&&!staffCatalogCloudWritePending){
        const remoteTime=Date.parse(remoteStaff.updated_at||remoteStaff.data.updatedAt||0)||0;
        const localTime=Date.parse(staffCatalog.updatedAt||0)||0;
        if(!localTime||remoteTime>localTime){staffCatalog=normalizeStaffCatalog({...remoteStaff.data,updatedAt:remoteStaff.updated_at||remoteStaff.data.updatedAt||''});saveStaffCatalogLocal();staffChanged=true;}
      }
      if(remoteCSMinimums?.data&&!csMinimumCatalogCloudWritePending){
        const remote=normalizeCSMinimumCatalog(remoteCSMinimums.data);
        const remoteTime=Date.parse(remoteCSMinimums.updated_at||remote.updatedAt||0)||0;
        const localTime=Date.parse(csMinimumCatalog.updatedAt||0)||0;
        if(!localTime||remoteTime>localTime){csMinimumCatalog=normalizeCSMinimumCatalog({...remote,updatedAt:remoteCSMinimums.updated_at||remote.updatedAt||''});saveCSMinimumCatalogLocal();csMinimumsChanged=true;}
      }
      if(merged.changed||catalogChanged||staffChanged||csMinimumsChanged){saveStore();if(!silent)toast('다른 기기의 변경사항을 가져왔습니다.','success');if(!$('#modalRoot .modal'))renderMain();else if(!silent)toast('현재 입력 중인 창은 유지했습니다. 닫으면 최신 내용이 반영됩니다.','');}
      const status=$('#cloudStatusText');if(status)status.textContent=`공용 데이터 동기화 중 · ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 확인 · 약 20초마다 자동 확인`;
      updateSyncLabels();
    }catch(e){
      const status=$('#cloudStatusText');if(status)status.textContent='공용 데이터 확인 실패: '+e.message;
      if(!silent)toast('동기화 실패: '+e.message,'error');
    }finally{cloudPollBusy=false;}
  }
  function startCloudPolling(){
    if(cloudPollTimer)clearInterval(cloudPollTimer);
    if(!cloudSession?.access_token)return;
    cloudPollTimer=setInterval(()=>pullCloudUpdates(true),CLOUD_POLL_INTERVAL_MS);
  }
  async function syncNow(){
    if(!cloudSession?.access_token){toast('먼저 공용 클라우드 계정으로 로그인하세요.','error');return;}
    try{await syncFromCloudMerge();await pullCloudUpdates(false);toast('지금 동기화를 완료했습니다.','success');}
    catch(e){toast('동기화 실패: '+e.message,'error');}
  }
  async function copyAppLink(){
    const url=location.href.split('#')[0];
    try{await navigator.clipboard.writeText(url);toast('웹앱 주소를 복사했습니다. 직원에게 카카오톡 등으로 보내세요.','success');}
    catch{window.prompt('아래 웹앱 주소를 복사해 직원에게 보내세요.',url);}
  }
  async function syncEventOnly(event){if(!cloudSession?.access_token||!event?.id)return;try{const uid=cloudSession.user.id;await cloudRequest('events?on_conflict=user_id%2Cid',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,id:event.id,data:event,created_at:event.timestamp||new Date().toISOString()}});updateSyncLabels();}catch(e){const status=$('#cloudStatusText');if(status)status.textContent='출고 이력은 이 기기에 저장했지만 공용 클라우드 동기화에 실패했습니다: '+e.message;toast('로컬 저장 완료 · 클라우드 동기화 실패: '+e.message,'error');}}
  async function syncOne(item,event){if(!cloudSession?.access_token)return;try{const uid=cloudSession.user.id;await cloudRequest('inventory?on_conflict=user_id%2Cbarcode',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,barcode:item.barcode,data:item,updated_at:item.updatedAt||new Date().toISOString()}});await cloudRequest('events?on_conflict=user_id%2Cid',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,id:event.id,data:event,created_at:event.timestamp||new Date().toISOString()}});updateSyncLabels();}catch(e){const s=$('#cloudStatusText');if(s)s.textContent='로컬 저장은 완료했지만 클라우드 동기화에 실패했습니다: '+e.message;toast('로컬 저장 완료 · 클라우드 동기화 실패: '+e.message,'error');}}
  async function syncAll(){if(!cloudSession?.access_token)return;try{const uid=cloudSession.user.id;const latest=latestItemActionByBarcode();const deletedCodes=[...latest.entries()].filter(([,v])=>v.deleted).map(([code])=>code);if(pruneDeletedInventoryByEvents().length)saveStore();for(const code of deletedCodes)await deleteCloudInventoryBarcode(code);for(let i=0;i<state.inventory.length;i+=100){const batch=state.inventory.slice(i,i+100).map(item=>({user_id:uid,barcode:item.barcode,data:item,updated_at:item.updatedAt||new Date().toISOString()}));if(batch.length)await cloudRequest('inventory?on_conflict=user_id%2Cbarcode',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:batch});}for(let i=0;i<state.events.length;i+=100){const batch=state.events.slice(i,i+100).map(ev=>({user_id:uid,id:ev.id,data:ev,created_at:ev.timestamp||new Date().toISOString()}));if(batch.length)await cloudRequest('events?on_conflict=user_id%2Cid',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:batch});}await syncProductCatalogToCloud();await syncStaffCatalogToCloud();await syncCSMinimumCatalogToCloud();const s=$('#cloudStatusText');if(s)s.textContent=`공용 데이터 동기화 완료 · 품목 ${state.inventory.length}개, 이력 ${state.events.length}건`;updateSyncLabels();}catch(e){const s=$('#cloudStatusText');if(s)s.textContent='동기화 실패: '+e.message;toast('클라우드 동기화 오류: '+e.message,'error');}}
  async function deleteCloudInventoryBarcode(barcode){const uid=cloudSession?.user?.id;if(!uid)return;await cloudRequest(`inventory?user_id=eq.${encodeURIComponent(uid)}&barcode=eq.${encodeURIComponent(String(barcode))}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});}
  async function deleteCloudEventById(eventId){const uid=cloudSession?.user?.id;if(!uid)return;await cloudRequest(`events?user_id=eq.${encodeURIComponent(uid)}&id=eq.${encodeURIComponent(String(eventId))}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});}
  async function deleteCloudAll(){const uid=cloudSession.user.id;await cloudRequest(`inventory?user_id=eq.${encodeURIComponent(uid)}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});await cloudRequest(`events?user_id=eq.${encodeURIComponent(uid)}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});}
  function cloudLogout(){if(cloudPollTimer){clearInterval(cloudPollTimer);cloudPollTimer=null;}cloudSession=null;localStorage.removeItem(SESSION_KEY);updateSyncLabels();renderMain();toast('공용 클라우드에서 로그아웃했습니다. 로컬 데이터는 유지됩니다.','success');}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b&&b.closest('#sideNav,#mobileNav'))setView(b.dataset.view);});
  // The import input exists only after the Settings view is rendered. Use delegated handling
  // so the initial Dashboard render is never interrupted by a null-element exception.
  document.addEventListener('change',e=>{
    if(e.target && e.target.id==='importFile'){
      const file=e.target.files?.[0];
      if(file)importJSONFile(file);
      e.target.value='';
    }
  });
  renderMain();
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  if(cloudConfig.url&&cloudConfig.key&&cloudSession?.access_token){syncFromCloudMerge().then(()=>{startCloudPolling();updateSyncLabels();if(currentView==='settings')renderMain();}).catch(e=>{console.warn('Cloud resume:',e);toast('공용 클라우드 재연결 필요: 설정에서 다시 로그인해 주세요.','error');});}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloudSession?.access_token)pullCloudUpdates(true);});
  window.addEventListener('focus',()=>{if(cloudSession?.access_token)pullCloudUpdates(true);});
})();
</script>
